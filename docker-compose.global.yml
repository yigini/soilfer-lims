# Docker Compose override for Global mode (multi-laboratory with NGINX)
# Usage: docker compose -f docker-compose.yml -f docker-compose.global.yml up -d

services:
  lims:
    environment:
      - DEPLOYMENT_MODE=global

  nginx:
    image: nginx:alpine
    container_name: soilfer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      lims:
        condition: service_healthy
