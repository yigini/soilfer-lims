[book]
title = "SoilFER LIMS: Lab User Manual & Admin Guide"
authors = ["SoilFER-LIMS Documentation Team"]
description = "Role-based user manual, quality control guide, pilot launch kit, and administrator reference for SoilFER LIMS"
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/yigini/soilfer-lims"
edit-url-template = "https://github.com/yigini/soilfer-lims/edit/main/docs/book/src/{path}"
site-url = "/soilfer-lims/"
additional-css = ["src/custom.css"]

[output.html.print]
enable = true

[output.html.search]
enable = true
