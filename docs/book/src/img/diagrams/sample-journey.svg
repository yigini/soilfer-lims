<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="100%" role="img" aria-label="The sample journey from Sample Reception through Drying and Preparation, Workbench, Manager Task List, and Reports">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 14px; stroke: #cbd5e1; stroke-width: 1.5px; }
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 2px; rx: 10px; }
      .box-mgr { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2px; rx: 10px; }
      .box-rpt { fill: #ffffff; stroke: #15803d; stroke-width: 2px; rx: 10px; }
      .step-num { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0f766e; }
      .title { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .badge { font: 600 11.5px 'Segoe UI', Arial, sans-serif; fill: #0f766e; }
      .role { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .heading { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 2.5px; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect x="8" y="8" width="1104" height="284" class="bg" />
  <text x="32" y="42" class="heading">The Sample Journey in SoilFER LIMS</text>

  <!-- Step 1: Reception -->
  <rect x="28" y="66" width="190" height="190" class="box" />
  <text x="44" y="92" class="step-num">1. SAMPLE RECEPTION</text>
  <text x="44" y="116" class="title">Check In &amp; Label</text>
  <text x="44" y="142" class="sub">• Inspect bag &amp; weight</text>
  <text x="44" y="162" class="sub">• Assign Permanent Lab ID</text>
  <text x="44" y="182" class="sub">• Print labels</text>
  <text x="44" y="214" class="badge">Status: Received → Accepted</text>
  <text x="44" y="238" class="role">Role: Reception Clerk</text>

  <line x1="218" y1="160" x2="246" y2="160" class="arrow" />

  <!-- Step 2: Preparation -->
  <rect x="248" y="66" width="190" height="190" class="box" />
  <text x="264" y="92" class="step-num">2. PREPARATION</text>
  <text x="264" y="116" class="title">Dry, Grind &amp; Sieve</text>
  <text x="264" y="142" class="sub">• Record drying method</text>
  <text x="264" y="162" class="sub">• Grind &amp; sieve soil</text>
  <text x="264" y="182" class="sub">• Confirm preparation</text>
  <text x="264" y="214" class="badge">Status: Drying → Prepared</text>
  <text x="264" y="238" class="role">Role: Lab Technician</text>

  <line x1="438" y1="160" x2="466" y2="160" class="arrow" />

  <!-- Step 3: Bench -->
  <rect x="468" y="66" width="190" height="190" class="box" />
  <text x="484" y="92" class="step-num">3. WORKBENCH</text>
  <text x="484" y="116" class="title">Run Batch &amp; QC</text>
  <text x="484" y="142" class="sub">• Start run &amp; select instrument</text>
  <text x="484" y="162" class="sub">• Enter samples, blank &amp; dup</text>
  <text x="484" y="182" class="sub">• Record &amp; send for review</text>
  <text x="484" y="214" class="badge">Status: Recorded → Submitted</text>
  <text x="484" y="238" class="role">Role: Lab Technician</text>

  <line x1="658" y1="160" x2="686" y2="160" class="arrow" />

  <!-- Step 4: Review -->
  <rect x="688" y="66" width="190" height="190" class="box-mgr" />
  <text x="704" y="92" class="step-num" fill="#1d4ed8">4. MANAGER TASK LIST</text>
  <text x="704" y="116" class="title">Review &amp; Approve</text>
  <text x="704" y="142" class="sub">• Check batch QC results</text>
  <text x="704" y="162" class="sub">• Return for repeat if needed</text>
  <text x="704" y="182" class="sub">• Approve verified results</text>
  <text x="704" y="214" class="badge" fill="#1d4ed8">Status: Accepted → Approved</text>
  <text x="704" y="238" class="role">Role: Lab Manager / Reviewer</text>

  <line x1="878" y1="160" x2="906" y2="160" class="arrow" />

  <!-- Step 5: Report -->
  <rect x="908" y="66" width="184" height="190" class="box-rpt" />
  <text x="924" y="92" class="step-num" fill="#15803d">5. REPORTS</text>
  <text x="924" y="116" class="title">Issue &amp; Share PDF</text>
  <text x="924" y="142" class="sub">• Generate Certificate</text>
  <text x="924" y="162" class="sub">• Print / Save as PDF</text>
  <text x="924" y="182" class="sub">• Share with client</text>
  <text x="924" y="214" class="badge" fill="#15803d">Status: Published</text>
  <text x="924" y="238" class="role">Role: Lab Manager / Viewer</text>
</svg>
