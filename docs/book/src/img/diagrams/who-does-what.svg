<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="100%" role="img" aria-label="Who does what in SoilFER LIMS across Reception Clerk, Laboratory Technician, Laboratory Manager, Laboratory Administrator, and Client or Viewer">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 14px; stroke: #cbd5e1; stroke-width: 1.5px; }
      .heading { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .col { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8px; rx: 10px; }
      .hdr-rec { fill: #0f766e; rx: 8px; }
      .hdr-tech { fill: #0369a1; rx: 8px; }
      .hdr-mgr { fill: #1d4ed8; rx: 8px; }
      .hdr-adm { fill: #4338ca; rx: 8px; }
      .hdr-view { fill: #15803d; rx: 8px; }
      .role-title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .menu-label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .item { font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="8" y="8" width="1104" height="314" class="bg" />
  <text x="32" y="40" class="heading">Who Does What in the Laboratory</text>

  <!-- Col 1: Reception -->
  <rect x="24" y="58" width="202" height="244" class="col" />
  <rect x="32" y="66" width="186" height="34" class="hdr-rec" />
  <text x="44" y="88" class="role-title">Reception Clerk</text>
  <text x="40" y="120" class="menu-label">Main menu: Sample Reception</text>
  <text x="40" y="148" class="item">• Check arriving sample bags</text>
  <text x="40" y="172" class="item">• Record weight &amp; condition</text>
  <text x="40" y="196" class="item">• Accept &amp; Print Label</text>
  <text x="40" y="220" class="item">• Flag damaged samples</text>
  <text x="40" y="244" class="item">• Hand over to preparation</text>

  <!-- Col 2: Technician -->
  <rect x="240" y="58" width="202" height="244" class="col" />
  <rect x="248" y="66" width="186" height="34" class="hdr-tech" />
  <text x="260" y="88" class="role-title">Lab Technician</text>
  <text x="256" y="120" class="menu-label">Main menus: My Work, Workbench</text>
  <text x="256" y="148" class="item">• Record Drying &amp; Sieving</text>
  <text x="256" y="172" class="item">• Start run &amp; pick instrument</text>
  <text x="256" y="196" class="item">• Type or paste readings</text>
  <text x="256" y="220" class="item">• Record blanks &amp; duplicates</text>
  <text x="256" y="244" class="item">• Submit run &amp; fix returns</text>

  <!-- Col 3: Manager / QA -->
  <rect x="456" y="58" width="208" height="244" class="col" />
  <rect x="464" y="66" width="192" height="34" class="hdr-mgr" />
  <text x="476" y="88" class="role-title">Lab Manager / QA</text>
  <text x="472" y="120" class="menu-label">Menus: Manager Task List, QA</text>
  <text x="472" y="148" class="item">• Assign Work to technicians</text>
  <text x="472" y="172" class="item">• Review Submissions &amp; QC</text>
  <text x="472" y="196" class="item">• Handle QC failed batches</text>
  <text x="472" y="220" class="item">• Final Approvals &amp; Reports</text>
  <text x="472" y="244" class="item">• Issue &amp; amend PDF reports</text>

  <!-- Col 4: Lab Admin -->
  <rect x="678" y="58" width="202" height="244" class="col" />
  <rect x="686" y="66" width="186" height="34" class="hdr-adm" />
  <text x="698" y="88" class="role-title">Lab Administrator</text>
  <text x="694" y="120" class="menu-label">Menus: Lab Staff, Policies, Admin</text>
  <text x="694" y="148" class="item">• Add User &amp; Reset Password</text>
  <text x="694" y="172" class="item">• Choose lab quality preset</text>
  <text x="694" y="196" class="item">• Enable methods &amp; QC rules</text>
  <text x="694" y="220" class="item">• Register Equipment &amp; CRM lots</text>
  <text x="694" y="244" class="item">• Set lab logo &amp; branding</text>

  <!-- Col 5: Client / Viewer -->
  <rect x="894" y="58" width="202" height="244" class="col" />
  <rect x="902" y="66" width="186" height="34" class="hdr-view" />
  <text x="914" y="88" class="role-title">Client / Viewer</text>
  <text x="910" y="120" class="menu-label">Main menus: Samples, Reports</text>
  <text x="910" y="148" class="item">• Check project sample status</text>
  <text x="910" y="172" class="item">• View report on screen</text>
  <text x="910" y="196" class="item">• Print / Save as PDF</text>
  <text x="910" y="220" class="item">• Read units &amp; interpretation</text>
  <text x="910" y="244" class="item">• Verify public QR links</text>
</svg>
