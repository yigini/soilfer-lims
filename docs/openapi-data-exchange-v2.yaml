          example: National NSIS Integration Gateway
        clientCode:
          type: string
          nullable: true
          example: OPENNSIS_GHANA
        organization:
          type: string
          nullable: true
          example: Ministry of Food and Agriculture
        contactEmail:
          type: string
          nullable: true
          example: integration@mofa.gov.gh
        status:
          type: string
          enum: [ACTIVE, DISABLED, SUSPENDED]
          example: ACTIVE
        capabilities:
          type: array
          items:
            type: string
            enum: [SPATIAL, SPECTRAL, SNAPSHOT, RECEIPT]
          example: [SPATIAL, SNAPSHOT, RECEIPT]
        countries:
          type: array
          items:
            type: string
          example: [GHA]
        projects:
          type: array
          items:
            type: string
          example: ['*']
        labs:
          type: array
          items:
            type: string
          example: [GHA-LAB-01]
        authVersion:
          type: integer
          example: 2
        activeKeyIds:
          type: array
          items:
            type: string
        telemetry:
          type: object
          properties:
            lastReceiptAt:
              type: string
              format: date-time
              nullable: true
            totalImported:
              type: integer
              example: 450
            totalQuarantined:
              type: integer
              example: 2
            lastCheckpoint:
              type: string
              nullable: true
              example: seq_450
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConnectionCreateRequest:
