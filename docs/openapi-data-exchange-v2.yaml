        sourceSystemId:
          type: string
          example: soilfer-lims-core
        boundaryTimestamp:
          type: string
          format: date-time
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Specimen'

    SpecimenDetailResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        data:
          $ref: '#/components/schemas/Specimen'

    ObservationListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        boundaryTimestamp:
          type: string
          format: date-time
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Observation'

    GeoJsonFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        total:
          type: integer
          description: Total eligible spatial features matching filter context
        count:
          type: integer
          description: Number of spatial features delivered in this page
        hasMore:
          type: boolean
          description: Indicates whether additional spatial features remain beyond current page
        nextCursor:
          type: string
          nullable: true
          description: Signed opaque pagination continuation cursor
        features:
          type: array
          items:
            type: object
            required:
              - type
              - geometry
              - properties
            properties:
              type:
                type: string
                enum: [Feature]
              id:
                type: string
              geometry:
                type: object
                required:
                  - type
                  - coordinates
                properties:
                  type:
                    type: string
                    enum: [Point]
                  coordinates:
                    type: array
                    items:
                      type: number
              properties:
                type: object

    SnapshotCreateRequest:
      type: object
      properties:
        profile:
          type: string
          enum: [core-lossless-v2, opennsis]
          default: core-lossless-v2
        ttlHours:
          type: integer
          default: 24
        filter:
          type: object

    SnapshotCreateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        snapshotId:
          type: string
        connectionId:
          type: string
        highWaterSequence:
          type: integer
          description: Highest journal sequence captured at snapshot baseline
          example: 42
        highWaterTimestamp:
          type: string
          format: date-time
        nextCursor:
          type: string
          description: Signed cursor for continuous sync resumption from snapshot boundary
          example: eyJ2IjoyLC...
        totalSamples:
          type: integer
        digest:
          type: string
          description: Verifiable SHA-256 digest of canonical delivered revision content
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        authVersion:
          type: integer
          description: Authorization version of connection at snapshot creation
          example: 1
        epoch:
          type: string
          description: Active signing generation epoch
          example: epoch-1
        expiresAt:
          type: string
          format: date-time
        ttlHours:
          type: integer

    ChangeFeedResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        batchId:
          type: string
          nullable: true
          description: Unique batch identifier recorded for delivery receipt resolution
          example: batch_1727488000_a1b2c3d4
        boundaryTimestamp:
          type: string
          format: date-time
        count:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
        changes:
          type: array
          items:
            type: object
            properties:
              sequence:
                type: integer
              id:
                type: string
                description: Event journal identifier
              eventType:
                type: string
                enum: [PUBLICATION, AMENDMENT, WITHDRAWAL]
              specimenId:
                type: string
              fieldSampleId:
                type: string
                nullable: true
              labSampleId:
                type: string
                nullable: true
              timestamp:
                type: string
                format: date-time
              data:
                $ref: '#/components/schemas/Specimen'
                nullable: true

    ReceiptSubmissionRequest:
      type: object
      properties:
        receiptId:
          type: string
          nullable: true
        snapshotId:
          type: string
          nullable: true
        batchId:
          type: string
          nullable: true
        importedCount:
          type: integer
          minimum: 0
          default: 0
        quarantinedCount:
          type: integer
          minimum: 0
          default: 0
        checkpoint:
          type: string
          nullable: true
