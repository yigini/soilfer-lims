openapi: 3.1.0
info:
  title: SoilFER-LIMS National SIS Data Exchange API (V2 Lossless)
  version: 2.0.0
  description: |
    Authoritative machine-to-machine exchange gateway for SoilFER-LIMS.
    Standardizes lossless soil chemistry, physical metrology, Vis-NIR/MIR spectra,
    and geospatial provenance for ingestion into National Soil Information Systems (NSIS),
    FAO OpenNSIS, and Global Soil Data Portals.
  contact:
    name: SoilFER Technical Team
    url: https://github.com/yigini/soilfer-lims
servers:
  - url: https://lims.yigini.net/api/v2/data-exchange
    description: Production Server
  - url: http://localhost:5000/api/v2/data-exchange
    description: Local Development Server

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /capabilities:
    get:
      summary: Machine discovery of exchange capabilities and profiles
      description: |
        Returns the contract version, supported exchange profiles (core-lossless-v2, opennsis),
        supported matrices, spatial reference constraints, and pagination limits.
      security: []
      responses:
        '200':
          description: Capabilities metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /stats:
    get:
      summary: Dataset publication and metrology statistics
      description: |
        Returns aggregate counts of approved specimens, determinations, and laboratories
        strictly scoped to the caller's authorized laboratory access (IR-14 compliant).
      responses:
        '200':
          description: Scoped dataset statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /samples:
    get:
      summary: Paginated specimen registry and provenance
      description: |
        Retrieves physical specimens with truthful coordinates, unrounded depth intervals,
        distinct collection/reception dates, and namespaced profiles.
      parameters:
        - name: profile
          in: query
          description: Exchange profile. Set to 'opennsis' to enforce genuine lab accession requirement.
          schema:
            type: string
            enum: [core-lossless-v2, opennsis]
            default: core-lossless-v2
        - name: country
          in: query
          description: ISO-3166-1 alpha-3 country code filter
          schema:
            type: string
            example: GTM
        - name: project
          in: query
          description: Project code filter
          schema:
            type: string
            example: SOILFER-GTM
        - name: labId
          in: query
          description: Laboratory identifier filter
          schema:
            type: string
            example: GTM-LAB1
        - name: limit
          in: query
          description: Number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: cursor
          in: query
          description: Opaque boundary cursor for pagination
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of specimens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /samples/{specimenId}:
    get:
      summary: Retrieve complete specimen detail
      description: Returns full specimen provenance, observations, and spectroscopy records.
      parameters:
        - name: specimenId
          in: path
          required: true
          description: Unique specimen identifier
          schema:
            type: string
      responses:
        '200':
          description: Full specimen detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /observations:
    get:
      summary: Lossless analytical observations matrix
      description: |
        Returns individual analytical determinations retaining all replicates, moisture basis,
        censoring flags, detection limits, and method references.
      parameters:
        - name: param
          in: query
          description: Filter by analyte parameter code (e.g. PH_H2O, SOC_WALKLEY_BLACK)
          schema:
            type: string
        - name: basis
          in: query
          description: Filter by analytical basis
          schema:
            type: string
            enum: [AIR_DRY, OVEN_DRY_105, AS_RECEIVED]
        - name: censoring
          in: query
          description: Filter by censoring flag
          schema:
            type: string
            enum: [NONE, LT_LOD, GT_ULOD]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of analytical observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /geojson:
    get:
      summary: RFC 7946 Spatial GeoJSON FeatureCollection
      description: |
        Streams GeoJSON Point features for GIS integration.
        Coordinates are strictly WGS84 [lng, lat]. Root crs object is omitted per RFC 7946.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
          description: Number of features per page
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque pagination continuation cursor
        - name: bbox
          in: query
          schema:
            type: string
          description: Bounding box filter formatted as 'minLng,minLat,maxLng,maxLat'
          example: "34.0,-5.0,42.0,5.0"
        - name: country
          in: query
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
        - name: labId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: GeoJSON FeatureCollection
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'

  /spectra:
    get:
      summary: Spectroscopy dataset (MIR / Vis-NIR)
      description: Returns calibrated spectral signatures linked to verified soil specimens.
      parameters:
        - name: modality
          in: query
          schema:
            type: string
            enum: [MIR, NIR]
            default: MIR
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Spectral records list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object

  /snapshots:
    post:
      summary: Create durable point-in-time export snapshot
      description: |
        Freezes a point-in-time sequence boundary for safe multi-page harvesting without drift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreateRequest'
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotCreateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /snapshots/{snapshotId}/pages:
    get:
      summary: Read pages from a durable snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Snapshot page items
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Specimen'
                  nextCursor:
                    type: string
                    nullable: true

  /changes:
    get:
      summary: Continuous synchronization change feed
      description: |
        Returns monotonically ordered publication and withdrawal events.
        If the cursor has expired or is invalid, responds with HTTP 410 CURSOR_EXPIRED.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Ordered change feed events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedResponse'
        '410':
          description: Cursor expired. Consumer must reinitialize snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts:
    post:
      summary: Submit receiver delivery receipt
      description: |
        Allows external consumers to record successful batch ingestion receipts for audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptSubmissionRequest'
      responses:
        '200':
          description: Receipt recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSubmissionResponse'

  /connections:
    servers:
      - url: https://lims.yigini.net/api/v1/data-exchange
        description: Production Administrative Server
      - url: http://localhost:5000/api/v1/data-exchange
        description: Local Administrative Server
      - url: https://lims.yigini.net/api/v1/sis
        description: Legacy Production SIS Alias
      - url: http://localhost:5000/api/v1/sis
        description: Legacy Local SIS Alias
    get:
      summary: List managed exchange connections
      description: |
        Returns administrative connections, active key linkages, granted capability scopes, and receiver ingestion telemetry.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of exchange connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExchangeConnection'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Create managed exchange connection
      description: |
        Provisions a named connection boundary with explicit capabilities (SPATIAL, SPECTRAL, SNAPSHOT, RECEIPT) and geographic/lab scopes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequest'
      responses:
        '200':
          description: Connection created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ExchangeConnection'
        '400':
          $ref: '#/components/responses/ForbiddenError'

  /connections/{id}:
    servers:
      - url: https://lims.yigini.net/api/v1/data-exchange
        description: Production Administrative Server
      - url: http://localhost:5000/api/v1/data-exchange
        description: Local Administrative Server
      - url: https://lims.yigini.net/api/v1/sis
        description: Legacy Production SIS Alias
      - url: http://localhost:5000/api/v1/sis
        description: Legacy Local SIS Alias
    put:
      summary: Update exchange connection status, capabilities, or scopes
      description: |
        Atomically updates connection status (ACTIVE, DISABLED), capabilities, or scopes. Increments auth_version to invalidate outstanding cursors and immediately halts or restricts associated API keys.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdateRequest'
      responses:
        '200':
          description: Connection updated successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  /keys/{id}/rotate:
    servers:
      - url: https://lims.yigini.net/api/v1/data-exchange
        description: Production Administrative Server
      - url: http://localhost:5000/api/v1/data-exchange
        description: Local Administrative Server
      - url: https://lims.yigini.net/api/v1/sis
        description: Legacy Production SIS Alias
      - url: http://localhost:5000/api/v1/sis
        description: Legacy Local SIS Alias
    post:
      summary: Atomic key rotation
      description: |
        Rotates an existing active API key. Atomically retires the old key using a compare-and-swap (CAS) precondition, creates a new replacement key linked to the same immutable connection identity, and records an audit log entry in a single transaction. Replay with identical idempotency key returns the cached successful outcome.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional idempotency key for safe client retry and response recovery.
      responses:
        '200':
          description: Key rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyRotateResponse'
        '400':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — API key has already been rotated or is no longer active
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: CONFLICT
                  code:
                    type: string
                    example: KEY_ALREADY_ROTATED
                  message:
                    type: string
                    example: API Key has already been rotated or is no longer active.
        '500':
          description: Rotation aborted and rolled back cleanly; previous key remains active

  /keys/{id}/confirm-rotation:
    servers:
      - url: https://lims.yigini.net/api/v1/data-exchange
        description: Production Administrative Server
      - url: http://localhost:5000/api/v1/data-exchange
        description: Local Administrative Server
      - url: https://lims.yigini.net/api/v1/sis
        description: Legacy Production SIS Alias
      - url: http://localhost:5000/api/v1/sis
        description: Legacy Local SIS Alias
    post:
      summary: Confirm pending API key rotation
      description: |
        Explicitly confirms an operation-bound API key rotation. Retires the bound prior rotating key immediately, activates the replacement key, and updates the rotation operation to CONFIRMED. Unrelated keys on the connection are preserved.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID or rotation operation idempotency key to confirm.
      responses:
        '200':
          description: Rotation confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Key rotation confirmed. Prior key has been retired.
                  connectionId:
                    type: string
                    example: conn_sis_rwanda_01
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — replacement key revoked, replacement key expired, or rotation operation was previously aborted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: CONFLICT
                  code:
                    type: string
                    enum: [KEY_REVOKED, KEY_EXPIRED, ROTATION_ABORTED]
                    example: KEY_REVOKED
                  message:
                    type: string
                    example: Cannot confirm rotation: replacement key has been revoked.

  /keys/{id}/abort-rotation:
    servers:
      - url: https://lims.yigini.net/api/v1/data-exchange
        description: Production Administrative Server
      - url: http://localhost:5000/api/v1/data-exchange
        description: Local Administrative Server
      - url: https://lims.yigini.net/api/v1/sis
        description: Legacy Production SIS Alias
      - url: http://localhost:5000/api/v1/sis
        description: Legacy Local SIS Alias
    post:
      summary: Abort pending API key rotation
      description: |
        Aborts an ongoing operation-bound API key rotation. Atomically restores the original rotating key to ACTIVE status and revokes only the unconfirmed replacement key. Independent sibling credentials on the connection remain untouched.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID or rotation operation idempotency key to abort.
      responses:
        '200':
          description: Rotation aborted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Key rotation aborted. Prior key remains active and replacement key has been revoked.
                  connectionId:
                    type: string
                    example: conn_sis_rwanda_01
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Conflict — original key revoked/not rotating, key expired, rotation window expired, or rotation operation was already confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: CONFLICT
                  code:
                    type: string
                    enum: [KEY_REVOKED, KEY_EXPIRED, ROTATION_EXPIRED, ROTATION_ALREADY_CONFIRMED]
                    example: KEY_REVOKED
                  message:
                    type: string
                    example: Cannot abort rotation: original key has been revoked or is no longer in rotating status.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Machine-to-machine API key prefixed with slims_live_
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token or User JWT

  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        contractVersion:
          type: string
          example: "2.0.0"
        schemaVersion:
          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        supportedProfiles:
          type: array
          items:
            type: string
          example: [core-lossless-v2, opennsis, glosis, default]
        supportedMatrices:
          type: array
          items:
            type: string
          example: [SOIL, PLANT, WATER, FERTILIZER]
        limits:
          type: object
          properties:
            defaultLimit:
              type: integer
              example: 50
            maxLimit:
              type: integer
              example: 500
            snapshotTtlHours:
              type: integer
              example: 24

    StatsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            totalSamplesPublished:
              type: integer
            totalApprovedObservations:
              type: integer
            authorizedLaboratories:
              type: array
              items:
                type: string

    Specimen:
      type: object
      required:
        - specimenId
        - sourceSystemId
        - status
        - publicationStatus
      properties:
        schemaVersion:
          type: string
          example: "2026-09-issue140-v2"
        sourceSystemId:
          type: string
          example: "soilfer-lims-core"
        specimenId:
          type: string
          example: "v2-specimen-001"
        fieldSampleId:
          type: string
          nullable: true
          example: "FIELD-GTM-1049"
        labSampleId:
          type: string
          nullable: true
          example: "LAB-2026-0042"
        laboratoryId:
          type: string
          nullable: true
          example: "GTM-LAB1"
        projectCode:
          type: string
          nullable: true
          example: "SOILFER-GTM"
        country:
          type: string
          example: "GTM"
        matrix:
          type: string
          example: "SOIL"
        status:
          type: string
          example: "APPROVED"
        publicationStatus:
          type: string
          enum: [RELEASED, WITHDRAWN, HOLD, DRAFT]
          example: "RELEASED"
        profile:
          type: object
          properties:
            code:
              type: string
              nullable: true
              example: "PLOT-ALPHA"
            namespace:
              type: string
              example: "GTM:SOILFER-GTM"
            key:
              type: string
              nullable: true
              example: "GTM:SOILFER-GTM:PLOT-ALPHA"
            relation:
              type: string
              enum: [SITE_POINT, COMPOSITE, CONFIRMED_PROFILE, UNSPECIFIED]
              example: "SITE_POINT"
        sampling:
          type: object
          properties:
            collectionDate:
              type: string
              nullable: true
              example: "2026-04-10"
            collectionTimestamp:
              type: string
              format: date-time
              nullable: true
            collectorName:
              type: string
              nullable: true
            depths:
              type: object
              properties:
                topCm:
                  type: number
                  nullable: true
                  example: 0.0
                bottomCm:
                  type: number
                  nullable: true
                  example: 20.0
                horizon:
                  type: string
                  nullable: true
                  example: "Ap"
                intervalLabel:
                  type: string
                  nullable: true
                  example: "0–20 cm"
                unit:
                  type: string
                  example: "cm"
            location:
              type: object
              nullable: true
              properties:
                type:
                  type: string
                  example: "Point"
                coordinates:
                  type: array
                  items:
                    type: number
                  example: [-90.5069, 14.6349]
                elevationMeters:
                  type: number
                  nullable: true
                accuracyMeters:
                  type: number
                  nullable: true
                source:
                  type: string
                  example: "FIELD_GPS"
                srid:
                  type: integer
                  example: 4326
            site:
              type: object
              nullable: true
        receipt:
          type: object
          properties:
            receptionDate:
              type: string
              nullable: true
              example: "2026-04-12"
            receptionTimestamp:
              type: string
              format: date-time
              nullable: true
            receivedBy:
              type: string
              nullable: true
            receivedMassGrams:
              type: number
              nullable: true
            moistureOnArrival:
              type: number
              nullable: true
        qualityControl:
          type: object
          properties:
            dryingStatus:
              type: string
              nullable: true
            preparationStatus:
              type: string
              nullable: true
            approvedBy:
              type: string
              nullable: true
            approvedAt:
              type: string
              format: date-time
              nullable: true
        qualityIssues:
          type: array
          items:
            type: string
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time

    Observation:
      type: object
      required:
        - observationId
        - specimenId
        - parameter
        - asMeasured
        - normalized
      properties:
        observationId:
          type: string
        specimenId:
          type: string
        fieldSampleId:
          type: string
          nullable: true
        labSampleId:
          type: string
          nullable: true
        parameter:
          type: string
          example: "PH_H2O"
        parameterCode:
          type: string
          example: "PH_H2O"
        parameterName:
          type: string
          example: "Soil pH (H2O)"
        asMeasured:
          type: object
          properties:
            value:
              type: number
              nullable: true
              example: 6.4
            rawEntry:
              type: string
              nullable: true
              example: "6.40"
            unit:
              type: string
              nullable: true
              example: "pH_units"
        normalized:
          type: object
          properties:
            value:
              type: number
              nullable: true
              example: 6.4
            unit:
              type: string
              nullable: true
              example: "pH_units"
        controlledUnit:
          type: string
          nullable: true
        qudtUnit:
          type: string
          nullable: true
        lod:
          type: number
          nullable: true
        loq:
          type: number
          nullable: true
        provenance:
          type: string
          enum: [MEASURED, PREDICTED, DERIVED, IMPORTED]
          example: "MEASURED"
        basis:
          type: string
          example: "AIR_DRY"
        censoring:
          type: string
          example: "NONE"
        replicateNo:
          type: integer
          example: 1
        isValid:
          type: boolean
          example: true
        method:
          type: object
          properties:
            id:
              type: string
              nullable: true
            code:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            standard:
              type: string
              nullable: true
            procedureUri:
              type: string
              nullable: true
            citation:
              type: string
              nullable: true
        glosis:
          type: object
          nullable: true
        analysedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SpecimenListResponse:
      type: object
      properties:
