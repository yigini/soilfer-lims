          type: string
          example: 2026-09-issue140-v2
        sourceSystemId:
          type: string
          example: soilfer-lims-core
        receipt:
          type: object
          properties:
            receiptId:
              type: string
            connectionId:
              type: string
            receivedAt:
              type: string
              format: date-time
            status:
              type: string
              example: ACKNOWLEDGED

    ExchangeConnection:
      type: object
      properties:
        id:
          type: string
          example: conn_8b2c4e1a
        name:
