          example: National NSIS Integration Gateway
        clientCode:
          type: string
          example: OPENNSIS_GHANA
        organization:
          type: string
          example: Ministry of Agriculture
        contactEmail:
          type: string
          example: ops@nsis.gov
        capabilities:
          type: array
          items:
            type: string
            enum: [SPATIAL, SPECTRAL, SNAPSHOT, RECEIPT]
          default: [SPATIAL, SNAPSHOT, RECEIPT]
        countries:
          type: array
          items:
            type: string
          default: ['*']
        projects:
          type: array
          items:
            type: string
          default: ['*']
        labs:
          type: array
          items:
            type: string
          default: []

    ConnectionUpdateRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED, SUSPENDED]
        capabilities:
          type: array
          items:
            type: string
            enum: [SPATIAL, SPECTRAL, SNAPSHOT, RECEIPT]
        countries:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            type: string
        labs:
          type: array
          items:
            type: string
        contactEmail:
          type: string
