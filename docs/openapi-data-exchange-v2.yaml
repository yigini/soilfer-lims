          type: string

    KeyRotateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: API Key rotated successfully.
        apiKey:
          type: string
          description: Newly issued plaintext API key token (returned only once)
          example: slims_live_9f83...
        keyInfo:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            connectionId:
              type: string
            keyPrefix:
              type: string
            role:
              type: string
            capabilities:
              type: array
              items:
                type: string
            expiresAt:
              type: string
              format: date-time
              nullable: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string

  responses:
    UnauthorizedError:
      description: Authentication failed or missing key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Scoping violation (lab or country not permitted)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
