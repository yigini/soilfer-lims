services:
  lims:
    build: .
    image: soilfer-lims:${LIMS_IMAGE_TAG:-latest}
    container_name: soilfer-lims
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - DISABLE_BACKGROUND_JOBS=${DISABLE_BACKGROUND_JOBS:-}
      - BASE_URL=${BASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      - HEALTH_SHOW_VERSION=${HEALTH_SHOW_VERSION:-false}
      - API_RATE_LIMIT_USER_MAX=${API_RATE_LIMIT_USER_MAX:-3000}
      - API_RATE_LIMIT_ANON_MAX=${API_RATE_LIMIT_ANON_MAX:-300}
      - API_RATE_LIMIT_EXCHANGE_MAX=${API_RATE_LIMIT_EXCHANGE_MAX:-1000}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Persistent database storage (only the prisma dir for DB file)
      - lims-data:/app/server/prisma
      # Persistent uploaded assets  
      - lims-assets:/app/server/uploads
      # Persistent automated database backups
      - lims-backups:/app/server/backups
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  lims-data:
    driver: local
  lims-assets:
    driver: local
  lims-backups:
    driver: local
