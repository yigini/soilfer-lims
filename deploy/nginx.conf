map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name lims.example.org;
    return 301 https://lims.example.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lims.example.org;

    ssl_certificate /etc/letsencrypt/live/lims.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lims.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        proxy_pass http://lims:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the public edge proxy: discard client-supplied forwarding claims.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
