<script type="application/json" id="hc-data">{"schemaVersion":1,"sourceLocale":"en","status":"EDITORIAL_DRAFT","publicationNote":"Starter wording for implementation and lab review. No article is approved or published by this package. Verify actual controls, permissions and enabled capabilities on the release being documented.","categories":[{"id":"start","title":"Getting started","description":"Find your way and prepare for a shift.","icon":"compass"},{"id":"intake","title":"Receiving samples","description":"Identity, condition, field context and labels.","icon":"package-check"},{"id":"bench","title":"Working at the bench","description":"Preparation, method runs and result entry.","icon":"flask-conical"},{"id":"review","title":"Review & reports","description":"Check evidence, return work and release reports.","icon":"clipboard-check"},{"id":"assets","title":"Equipment & stock","description":"Use eligible instruments and traceable materials.","icon":"microscope"},{"id":"offline","title":"Mobile & offline","description":"Device saves, synchronization and recovery.","icon":"cloud-download"},{"id":"connect","title":"Projects & connections","description":"KoBo field records, projects and SIS exchange.","icon":"network"},{"id":"manage","title":"Managing the laboratory","description":"Assignments, configuration and language.","icon":"settings-2"}],"articles":[{"id":"start-shift","category":"start","kind":"guide","title":"Start your shift with the right work","summary":"Check your account, laboratory and assignments before recording anything.","roles":["all"],"keywords":["login","dashboard","role","start","queue"],"minutes":2,"steps":["Confirm the displayed account and laboratory. Use your own account so the record identifies the person who performed the work.","Open the task area available to your role. Read the priority and any blocked-work messages before choosing a sample.","Confirm the sample label, requested method and instrument context. Similar field or laboratory identifiers must not be treated as interchangeable.","If using supported offline work, check the downloaded work pack and authorization before leaving the connection."],"success":"The correct sample and method are open under your account, with any blockers clearly understood.","caution":"If an assignment or laboratory looks wrong, stop and ask the lab manager to check it.","related":["bench-blocked","offline-prepare"],"feature":"core","reviewOwner":"Lab operations lead"},{"id":"intake-project","category":"intake","kind":"guide","title":"Receive a project sample","summary":"Match the physical material to the existing project record before accepting it.","roles":["reception","manager"],"keywords":["receive","kobo","gtm","intake","consignment"],"minutes":3,"steps":["Open Reception and select the appropriate project or consignment. Find or scan the sample's field identifier.","Compare the displayed project, identifier and field context with the physical label. Do not create another record merely because the expected one is hard to find.","Record the actual arrival condition, required quantity information and observations using your lab's intake procedure.","Review the requested analyses and required details. Complete the receipt action shown by the current form and check its confirmation."],"success":"An accepted receipt is visible, or an explicit provisional device receipt is retained when supported offline intake is being used.","caution":"A field submission or an expected sample record does not prove that material has physically arrived.","related":["intake-location","intake-identity"],"feature":"reception","reviewOwner":"Reception lead"},{"id":"intake-location","category":"intake","kind":"faq","title":"Why is the location missing from an intake draft?","summary":"Check the source project record and preserve its field information. Do not guess a location.","roles":["reception","manager"],"keywords":["location","draft","gps","coordinates","no location","reopen"],"minutes":2,"steps":["Confirm that the draft is linked to the intended project sample, rather than a new independent intake.","Open the available field data and check whether a location or coordinates exist in the source record.","If the source contains the information but the reopened draft does not, preserve the draft and report the discrepancy with the sample identifier through the approved support route.","Wait for reconciliation rather than overwriting source coordinates with a guessed location or creating a duplicate intake."],"success":"The source field context is correctly linked, or the discrepancy is recorded for correction without inventing data.","caution":"A missing display value and missing source data are different problems.","related":["intake-project","connect-kobo"],"feature":"reception","reviewOwner":"Reception lead"},{"id":"intake-identity","category":"intake","kind":"faq","title":"Which sample identifier should I use?","summary":"Use the laboratory identifier for bench work and retain the field identifier for provenance.","roles":["all"],"keywords":["id","uuid","barcode","label","field id","sample number"],"minutes":1,"steps":["Read the laboratory sample identifier displayed by the application and compare it with the container label.","Use the associated field identifier to confirm the collection record and project. A software UUID is an internal reference, not a substitute for an unclear label.","If using a provisional offline intake, follow the displayed temporary-label policy until the server assigns or confirms the official identifier."],"success":"The container, task and sample record refer to the same specimen.","caution":"Do not relabel a sample or merge records without the authorized identity-correction procedure.","related":["intake-project","offline-sync"],"feature":"core","reviewOwner":"Reception lead"},{"id":"bench-blocked","category":"bench","kind":"faq","title":"Why can't I start this analysis?","summary":"Read the current blocker. Receipt, preparation, assignment or equipment may still need attention.","roles":["technician","manager"],"keywords":["blocked","start","ready","prerequisite","pending","cannot"],"minutes":2,"steps":["Open the work item's readiness details and read the reason shown for this sample and method.","Check whether physical receipt is accepted, required operational steps are complete and the work is assigned to you.","If an instrument is required, confirm that an eligible instrument is selected and its status is current.","Complete only actions permitted to you. Ask the manager or reception team to resolve requirements they own."],"success":"The work item becomes ready under the current workflow rules, or the responsible colleague has the exact blocker to resolve.","caution":"Do not enter a substitute value, alter an unrelated status or repeatedly submit to bypass a blocker.","related":["bench-preparation","assets-instrument","review-returned"],"feature":"workbench","reviewOwner":"Lab operations lead"},{"id":"bench-drying","category":"bench","kind":"guide","title":"Record sample drying","summary":"Record the physical step using the assigned operational checklist and required evidence.","roles":["technician","manager"],"keywords":["drying","dry","temperature","checklist","numerical"],"minutes":2,"steps":["Open the drying task for the correct sample or permitted batch in the workbench.","Read the assigned drying procedure. Record the conditions, times and evidence required by that procedure.","Confirm each checklist item only after performing and checking the physical work.","Use the available confirmation action and inspect the resulting receipt or pending synchronization status."],"success":"The drying confirmation and its evidence are visible with the correct local or server status.","caution":"A generic numeric value does not represent completion of a drying checklist. Use the approved SOP for temperatures and endpoints.","related":["bench-preparation","bench-save-submit"],"feature":"workbench","reviewOwner":"Lab operations lead"},{"id":"bench-preparation","category":"bench","kind":"faq","title":"Why does preparation still need attention after I confirm it?","summary":"A local save, an operational confirmation and any required verification are separate events.","roles":["technician","manager"],"keywords":["prep","preparation","submit","incomplete","drying","verification"],"minutes":2,"steps":["Read the latest confirmation or synchronization receipt. Check whether the work is saved on the device or accepted by the server.","Check the assigned preparation procedure for required evidence or independent verification.","If the work is waiting for another authorized person's verification, ask that person to review the existing record.","If pages disagree after a confirmed server receipt, report the contradiction. Do not redo the physical work or create another confirmation just to change a badge."],"success":"You know whether synchronization, verification or a software correction is needed.","caution":"Do not assume confirmation alone satisfies every method's release conditions.","related":["bench-drying","bench-save-submit","offline-sync"],"feature":"workbench","reviewOwner":"Lab operations lead"},{"id":"bench-run","category":"bench","kind":"guide","title":"Record a run of samples for one method","summary":"Keep the sample order, method context and quality controls together while working through a batch.","roles":["technician","manager"],"keywords":["40","batch","ph","worksheet","run","paste","results"],"minutes":3,"steps":["Choose the intended method and the eligible assigned samples. Check the run order, units, method revision and instrument.","Keep quality-control and replicate records distinguishable from routine specimens according to the approved method.","For each sample, confirm identity, enter the observation in the correct field and check the save status before moving on.","Review the completed entries, unresolved validation messages and QC evidence. Submit only the records that are ready using the application's submission review."],"success":"Each observation remains linked to its sample and method, with a clear submission outcome for every included item.","caution":"For bulk paste, review sample matching and column/unit mapping before accepting the preview. Never rely only on spreadsheet row position.","related":["bench-save-submit","bench-texture","bench-blocked"],"feature":"workbench","reviewOwner":"Lab operations lead"},{"id":"bench-save-submit","category":"bench","kind":"faq","title":"Was my result saved or submitted?","summary":"Saving keeps an entry. Submission sends ready work for review. Verification and report release are later decisions.","roles":["all"],"keywords":["draft","saved","submitted","accepted","verified","released","complete"],"minutes":2,"steps":["Read the status beside the exact work item, not only a page-wide notification.","If it says saved on this device, the server may not yet have the entry. Check synchronization before another colleague expects to see it.","If it is a draft, review the required values and evidence, then use the authorized submission action when ready.","Check the submission receipt. Submitted work may still need verification and inclusion in an authorized released report."],"success":"You can distinguish captured data, submitted work and a released result.","caution":"A green save indicator is not proof of managerial approval or report release.","related":["offline-sync","review-results","review-report"],"feature":"core","reviewOwner":"Lab operations lead"},{"id":"bench-texture","category":"bench","kind":"faq","title":"Why are sand, silt and clay entered together?","summary":"They form one particle-size result panel and must be checked together before submission.","roles":["technician","manager"],"keywords":["texture","sand","silt","clay","100","particle size","class"],"minutes":2,"steps":["Select the assigned texture method and enter each fraction in its labelled field on the same panel.","Check the basis, units and the total against the method's configured tolerance. Investigate a mismatch rather than forcing the total by changing a fraction.","Review the class calculated by the configured classification rules when that feature is enabled.","Submit the panel with its required evidence. Reports should preserve the same validated values and classification."],"success":"All fractions belong to one checked result, with a traceable classification where applicable.","caution":"Do not silently normalize fractions or select a different texture classification system to obtain a preferred class.","related":["bench-run","review-report"],"feature":"texture_panel","reviewOwner":"Particle-size method specialist"},{"id":"bench-spectra","category":"bench","kind":"faq","title":"What should I upload for MIR or NIR analysis?","summary":"Use the original spectrum export and the supported import profile for your instrument and method.","roles":["technician","manager"],"keywords":["mir","nir","reflectance","spectrum","spectra","opus","csv","upload"],"minutes":3,"steps":["Export the spectrum using the laboratory's approved instrument/software procedure and retain the original file.","Choose a supported import profile shown by the application. Follow that profile's required axes, units and metadata; a filename extension alone does not prove compatibility.","Match the spectrum to the correct sample, acquisition and replicate, then inspect parser and quality-control messages.","Check the evidence upload/processing status before submitting the analytical work."],"success":"The original spectrum, metadata and sample link are retained with a clear QC and processing outcome.","caution":"Do not replace a spectrum with one reflectance number. A spectral prediction is not automatically a reference laboratory measurement.","related":["connect-library","assets-instrument","offline-files"],"feature":"spectral_intake","reviewOwner":"Spectroscopy method specialist"},{"id":"review-results","category":"review","kind":"guide","title":"Review submitted work before approval","summary":"Check the submitted version, prerequisites, QC and evidence before making an authorized decision.","roles":["manager","quality"],"keywords":["approval","manager","verify","qc","submitted","review"],"minutes":3,"steps":["Open the review queue and confirm that the work has actually been submitted and is within your review scope.","Inspect the method, values, units, prerequisites, required equipment and quality-control evidence.","Return the item with a clear reason when correction is needed. Use the approved amendment route for already released records.","Before approval, confirm the current version and requirements. Check the decision receipt and resulting state."],"success":"The decision is attached to the reviewed version and is visible to the next responsible person.","caution":"An expected or freshly received sample is not ready for scientific approval merely because a button appears.","related":["review-returned","review-amend","review-report"],"feature":"review","reviewOwner":"Quality lead"},{"id":"review-returned","category":"review","kind":"faq","title":"What should I do when work is returned?","summary":"Read the reviewer's reason and correct the identified issue in the authorized work item.","roles":["technician","manager"],"keywords":["returned","rejected","correction","resubmit","review"],"minutes":2,"steps":["Open the returned item and read the review comments and version history.","Confirm that the task has been reopened or assigned appropriately before editing.","Correct the required entry or evidence, preserving the original observation and any required explanation.","Review and resubmit through the workbench, then check the new receipt."],"success":"The correction is traceable and the reviewer receives the intended revised work.","caution":"Do not repeat a physical measurement solely because a software state is unclear; follow the method and review decision.","related":["bench-save-submit","review-amend"],"feature":"review","reviewOwner":"Quality lead"},{"id":"review-amend","category":"review","kind":"faq","title":"Can I change an approved result?","summary":"Use the authorized correction or amendment process so the original result and decision remain traceable.","roles":["all"],"keywords":["edit","approved","amend","correction","locked","released"],"minutes":2,"steps":["Identify the exact result and report version that needs correction and record why.","Ask the authorized reviewer or manager to initiate the permitted correction route if you cannot do so yourself.","Make changes only in the resulting authorized revision and retain supporting evidence.","Complete the required review and, where needed, issue a new report version under the lab's procedure."],"success":"The correction links to the previous version with an explanation and appropriate review.","caution":"Do not overwrite or delete the approved record to hide an error.","related":["review-results","review-report"],"feature":"review","reviewOwner":"Quality lead"},{"id":"review-report","category":"review","kind":"guide","title":"Find and share the correct report","summary":"Check the report's release state, version and intended recipient before sharing it.","roles":["all"],"keywords":["report","pdf","certificate","download","print","release"],"minutes":2,"steps":["Open the reports area available to your role and locate the correct sample or project.","Check whether the document is a draft, a released report or a superseded version.","Inspect identifiers, methods, units, qualifiers and included result panels before using the permitted download or print action.","Share through the approved laboratory process. Use a replacement report when an authorized amendment has superseded an earlier release."],"success":"The intended recipient receives the correct authorized version.","caution":"A downloaded PDF can remain on a device after a newer version is released. Check its version before reuse.","related":["review-amend","connect-sis"],"feature":"reports","reviewOwner":"Quality lead"},{"id":"assets-instrument","category":"assets","kind":"faq","title":"Why can't I select this instrument?","summary":"The instrument must be eligible for the method and meet the required service and calibration conditions.","roles":["technician","manager"],"keywords":["equipment","instrument","calibration","overdue","unavailable"],"minutes":2,"steps":["Check the method's instrument requirements and the equipment record.","Read the specific eligibility, service or calibration message. Confirm that the record is current if working from downloaded information.","Choose another eligible instrument if the procedure permits it, or ask the responsible manager to resolve the equipment issue."],"success":"The selected instrument is eligible, or the task remains visibly blocked while the issue is resolved.","caution":"Do not change calibration dates or service status merely to unlock a task.","related":["bench-blocked","assets-stock"],"feature":"equipment","reviewOwner":"Equipment lead"},{"id":"assets-stock","category":"assets","kind":"guide","title":"Record materials used at the bench","summary":"Keep the reagent or consumable lot linked to the work when required by the method.","roles":["technician","manager"],"keywords":["inventory","stock","lot","reagent","consumption","expiry"],"minutes":2,"steps":["Confirm the material and lot required for the method, including expiry and any hold.","Record the quantity and unit using the authorized stock transaction or work-record control.","Check the resulting stock transaction or pending offline receipt. Report a balance discrepancy rather than adjusting unrelated entries."],"success":"Use is traceable to the correct material and lot.","caution":"A cached balance may be older than another technician's transaction.","related":["assets-instrument","offline-sync"],"feature":"inventory","reviewOwner":"Inventory lead"},{"id":"offline-prepare","category":"offline","kind":"guide","title":"Prepare for a supported offline shift","summary":"Download the work and guidance your authorized device will need before losing connectivity.","roles":["technician","reception","manager"],"keywords":["offline","download","pack","mobile","phone","shift"],"minutes":3,"steps":["Confirm that offline capture is enabled and supported for this device and the planned task in your deployed version.","While connected, download the scoped work pack and check its completion, freshness, storage readiness and offline authorization.","Open the required methods and help while preparing the pack. Verify that essential evidence and guidance are actually available offline.","At the end of the shift, reconnect and inspect accepted, pending and conflicting items before handing over the work."],"success":"The supported task and its necessary guidance are available to the authorized user on the device.","caution":"An installed icon or cached page alone does not establish durable offline result capture.","related":["offline-sync","offline-files"],"feature":"offline_capture_verified","reviewOwner":"Mobile/offline product owner"},{"id":"offline-sync","category":"offline","kind":"faq","title":"What does saved on this device mean?","summary":"The device holds the entry, but the server may not yet have accepted it.","roles":["all"],"keywords":["offline","sync","saved","device","waiting","upload","conflict"],"minutes":2,"steps":["Open Sync Centre and check the exact item: waiting, sending, accepted or needing attention.","Reconnect and sign in as required, then allow synchronization or use the available retry action.","If there is a conflict, compare the local proposal with the server record and follow the authorized resolution path.","Before clearing storage, reinstalling or retiring the device, resolve pending work through the lab's approved recovery procedure."],"success":"Each entry has a confirmed server outcome or a visible, recoverable next action.","caution":"Do not clear browser or app storage to fix a pending synchronization problem.","related":["bench-save-submit","offline-prepare","offline-files"],"feature":"offline_capture_verified","reviewOwner":"Mobile/offline product owner"},{"id":"offline-files","category":"offline","kind":"faq","title":"Has my photo or spectrum really been saved?","summary":"Check that the original file was captured and that the required upload or processing has finished.","roles":["technician","reception","manager"],"keywords":["file","attachment","photo","spectra","upload","interrupted"],"minutes":2,"steps":["Check the attachment state for the exact sample and work item. A filename or thumbnail is not proof that the original bytes were saved.","For supported offline capture, confirm the device-save receipt before removing access to the source file.","After reconnecting, inspect upload and processing results. Retain the original export and use the supported retry/recovery controls when a transfer fails."],"success":"The required evidence is linked and its storage or processing state is explicit.","caution":"Do not resubmit a changed file under the identity of an earlier original.","related":["bench-spectra","offline-sync"],"feature":"attachments","reviewOwner":"Lab operations lead"},{"id":"connect-kobo","category":"connect","kind":"faq","title":"Does a KoBo submission mean the sample was received?","summary":"No. Field information and physical laboratory receipt describe different events.","roles":["all"],"keywords":["kobo","field","received","expected","project","sync"],"minutes":2,"steps":["Check the project's field record and integration status to establish what data arrived.","Match the physical specimen at Reception when it reaches the lab.","If expected records are missing or duplicated, ask the integration owner to inspect the connection and import outcome before recreating them."],"success":"Field provenance is retained and physical receipt is recorded separately.","caution":"Do not assume a fixed automatic synchronization interval unless your deployment's configuration confirms it.","related":["intake-project","intake-location"],"feature":"kobo","reviewOwner":"Project/integration lead"},{"id":"connect-library","category":"connect","kind":"faq","title":"How is the spectral library related to sample results?","summary":"The library holds linked spectra and their context; a file, a prediction and an approved report are distinct records.","roles":["technician","manager","project"],"keywords":["spectral library","model","prediction","reference","mir","nir"],"minutes":2,"steps":["Open the spectrum's sample link and acquisition metadata to establish its origin.","Check the processing/QC state and any model version associated with a prediction.","Use the sample result and report views to establish which reviewed results were actually released."],"success":"You can trace spectrum → processing/model → reviewed result without treating them as the same state.","caution":"Library inclusion alone does not certify a model prediction or authorize report release.","related":["bench-spectra","review-report"],"feature":"spectral_intake","reviewOwner":"Spectroscopy method specialist"},{"id":"connect-sis","category":"connect","kind":"faq","title":"Has the result reached the Soil Information System?","summary":"Check the authorized delivery record. A released report and a successful external transfer are separate outcomes.","roles":["manager","project","admin"],"keywords":["sis","glosis","export","connection","delivery","integration"],"minutes":2,"steps":["Identify the released result/report version intended for the receiving system.","Inspect the available integration or export record for delivery status and any validation failure.","Ask the configured integration owner to resolve rejected or uncertain deliveries. Preserve the original delivery identity when retrying through the approved process."],"success":"There is a confirmed delivery outcome for the correct version, or an assigned recovery action.","caution":"Do not expose API credentials in help requests or assume opening an export screen transmitted data.","related":["review-report","manage-support"],"feature":"sis","reviewOwner":"Integration owner"},{"id":"manage-catalogue","category":"manage","kind":"guide","title":"Change an analysis definition responsibly","summary":"A catalogue definition is connected to selection, worksheets, validation and reporting.","roles":["manager","admin"],"keywords":["catalogue","analysis","method","parameter","configuration","unit"],"minutes":3,"steps":["Identify whether the request changes display wording, a method assignment or a scientific definition.","Inspect the affected selection, task schema, prerequisites, units, panels and report mappings before editing.","Use the authorized revision/review process and test the affected laboratory journey with representative records.","Preserve historical result meaning and released reports when publishing a new definition."],"success":"The intended definition is consistent across selection, work and reports without reinterpreting previous results.","caution":"Changing a translated label must not alter a stable scientific code or calculation.","related":["manage-language","bench-texture"],"feature":"catalogue","reviewOwner":"Scientific catalogue owner"},{"id":"manage-language","category":"manage","kind":"faq","title":"How do I change the language or report a translation?","summary":"Use the interface language control. Report scientific wording with its context so it can be reviewed accurately.","roles":["all"],"keywords":["language","translation","english","spanish","french","portuguese","terminology"],"minutes":2,"steps":["Choose your language through the current interface language control or profile preference.","For incorrect wording, record the page, parameter/method and the phrase that is unclear, without sharing unnecessary sample data.","Ask an authorized language editor or lab manager to review the relevant terminology group. Scientific terms need review in their method context."],"success":"The chosen language is applied, or a precise wording correction reaches the appropriate reviewer.","caution":"A translation correction must not change stored values, units or scientific identifiers.","related":["manage-catalogue","manage-support"],"feature":"core","reviewOwner":"Localization owner"},{"id":"manage-load-error","category":"manage","kind":"faq","title":"What should I do if a page fails to load?","summary":"Preserve unsaved work first. A failed page module may need a safe retry or an application update.","roles":["all"],"keywords":["error","refresh","loading","module","blank","something went wrong"],"minutes":2,"steps":["Check connectivity and any application update message. Record the page and approximate time of the error.","Before refreshing or leaving, check whether any entered work is unsaved or waiting for synchronization.","Use the application's safe retry/update control when available. If no work can be lost, a normal refresh may load the current version.","If the issue repeats, report it to the configured support contact with the displayed error reference and build version where available."],"success":"The page loads without losing work, or support has enough non-sensitive information to investigate.","caution":"Do not clear browser storage or repeatedly refresh while unsynchronized laboratory work is at risk.","related":["offline-sync","manage-support"],"feature":"core","reviewOwner":"Application support owner"},{"id":"manage-support","category":"manage","kind":"guide","title":"Ask for help with the right information","summary":"Send a clear description through your laboratory's configured support channel.","roles":["all"],"keywords":["support","help","contact","manager","issue","bug"],"minutes":2,"steps":["State what you were trying to do, what happened and what you expected.","Include the page, approximate time and relevant application version or error reference, if shown.","Use a sample or task identifier only when needed and permitted. Review any screenshot for personal information, results or credentials before sharing.","Choose the configured lab manager, method specialist or application support contact for the issue. Submit only after reviewing the message and attachments."],"success":"The appropriate person receives a clear, appropriately scoped support request.","caution":"Never include passwords, access tokens or unrestricted database exports.","related":["manage-load-error","bench-blocked"],"feature":"core","reviewOwner":"Application support owner"}]}</script>

<script>
(()=>{
const root=document.getElementById('soilfer-help-study'),data=JSON.parse(document.getElementById('hc-data').textContent),copies=JSON.parse(document.getElementById('hc-copy').textContent);
const opts={scene:'home',theme:'light',locale:'en',role:'technician'};
const state={view:'home',topic:'all',query:'',kind:'all',article:'bench-blocked',back:'home',panel:true,input:'6.42',message:'',feedback:{},editorTitle:'Why can’t I start this analysis?',editorBody:'Read the current blocker. Receipt, preparation, assignment or equipment may still need attention.',editorStage:'Draft',scope:'lab',supportMessage:'',link:false};
const $=s=>root.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,t=k=>copies[opts.locale][k]||copies.en[k],cat=id=>copies[opts.locale].categories[id]||id,A=id=>data.articles.find(a=>a.id===id),tag=(s,w=false)=>`<span class="hc-tag${w?' hc-amber':''}">${esc(s)}</span>`;
const allowed=a=>opts.role==='admin'||a.roles.includes('all')||a.roles.includes(opts.role);
const norm=s=>s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function matches(){let q=norm(state.query.trim());return data.articles.filter(a=>allowed(a)&&(state.topic==='all'||a.category===state.topic)&&(state.kind==='all'||a.kind===state.kind)&&(!q||norm([a.title,a.summary,...a.keywords,cat(a.category)].join(' ')).includes(q)));}
function button(text,act,primary=false,disabled=false){return `<button class="hc-button${primary?' hc-primary':''}" data-act="${act}" ${disabled?'disabled':''}>${text}</button>`;}
function linkArticle(id,label){return `<button class="hc-link" data-article="${id}">${esc(label||A(id).title)} ${I('arrow-right')}</button>`;}
function articleRow(a){return `<button class="hc-row" data-article="${a.id}"><span><strong>${esc(a.title)}</strong><small>${esc(a.summary)}</small><small>${cat(a.category)} · ${a.minutes} min · English draft</small></span>${I('chevron-right')}</button>`;}
function search(){return `<form id="hc-search-form"><div class="hc-searchbox">${I('search')}<input id="hc-query" type="search" aria-label="${t('search')}" placeholder="${t('placeholder')}" value="${esc(state.query)}"><button type="submit" aria-label="${t('search')}">${I('arrow-right')}</button></div></form>`;}
function toolbar(){return `<nav class="hc-toolbar" aria-label="Help sections"><button data-view="home" aria-pressed="${state.view==='home'}">${t('centre')}</button><button data-view="faq" aria-pressed="${state.view==='faq'}">${t('faq')}</button><button data-view="guides" aria-pressed="${state.view==='guides'}">${t('guides')}</button></nav>`;}
function faqItem(a){return `<details><summary>${esc(a.title)}${I('chevron-down')}</summary><div class="hc-answer"><p>${esc(a.summary)}</p>${linkArticle(a.id,t('read'))}</div></details>`;}
function contact(){return `<div class="hc-contactstrip"><div><h3>Still need a hand?</h3><p>Ask the right person at your laboratory.</p></div><button class="hc-button" data-view="support">${I('messages-square')}${t('support')}</button></div>`;}
function home(){let pop=['bench-save-submit','bench-blocked','bench-spectra','offline-sync'].map(A).filter(allowed);return `<div class="hc-eyebrow">SoilFER / ${t('centre')}</div><h1>${t('hero')}</h1><p class="hc-intro">${t('intro')}</p>${search()}<div class="hc-searchhint">pH · preparation · spectra · reports · synchronization</div>${toolbar()}<div class="hc-categorygrid">${data.categories.map(c=>{let n=data.articles.filter(a=>a.category===c.id&&allowed(a)).length;return n?`<button class="hc-category" data-topic="${c.id}"><div class="hc-topicicon">${I(c.icon)}</div><span><h3>${cat(c.id)}</h3><small>${esc(c.description)}</small><small>${n} ${n===1?'article':'articles'}</small></span>${I('chevron-right')}</button>`:''}).join('')}</div><div class="hc-sectionline"><h2>Questions from the bench</h2><button class="hc-link" data-view="faq">${t('faq')} ${I('arrow-right')}</button></div><div class="hc-questions">${pop.map(faqItem).join('')}</div>${contact()}`;}
function listing(){let items=matches();let title=state.view==='search'?t('search'):state.view==='faq'?t('faq'):state.view==='guides'?t('guides'):cat(state.topic);return `<div class="hc-eyebrow">${t('centre')}</div><h1>${title}</h1><p class="hc-intro">${state.view==='faq'?'Straight answers to everyday laboratory questions.':'Find the next step and know what success looks like.'}</p>${search()}${toolbar()}<div class="hc-sectionline"><label class="hc-form">Topic <select id="hc-topic-select" aria-label="Topic"><option value="all">${t('all')}</option>${data.categories.map(c=>`<option value="${c.id}" ${state.topic===c.id?'selected':''}>${cat(c.id)}</option>`).join('')}</select></label><small>${items.length} ${items.length===1?'result':'results'} · English draft content</small></div>${items.length?(state.view==='faq'?`<div class="hc-questions">${items.map(faqItem).join('')}</div>`:items.map(articleRow).join('')):`<div class="hc-empty"><h2>${t('zero')}</h2><p>${t('zeroHint')}</p><button class="hc-link" data-view="home">${t('centre')}</button></div>`}${contact()}`;}
function reader(){const a=A(state.article);if(!a||!allowed(a))return `<h1>${t('centre')}</h1><div class="hc-notice">${t('permission')}</div>`;return `<button class="hc-link" data-act="article-back">${I('arrow-left')}${t('back')}</button><article class="hc-article"><div class="hc-eyebrow">${cat(a.category)} / ${a.kind==='faq'?t('faq'):t('guides')}</div><h1>${esc(a.title)}</h1><p class="hc-lead">${esc(a.summary)}</p><div class="hc-meta">${tag('Editorial draft',true)}<span>${a.minutes} min read</span><span>English · Revision 1 proposed</span></div>${opts.locale!=='en'?`<div class="hc-notice">${t('sourceFallback')}</div>`:''}<h2>What to do</h2><ol>${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="hc-panel"><h3>What success looks like</h3><p>${esc(a.success)}</p></div><div class="hc-notice"><strong>Keep in mind</strong><br>${esc(a.caution)}</div><small>Review owner to assign: ${esc(a.reviewOwner)}<br>Application controls and SOP references must be verified before publication.</small><h2>Related guidance</h2>${a.related.map(A).filter(allowed).map(a=>`<div>${linkArticle(a.id)}</div>`).join('')}<div class="hc-feedback"><strong>${t('useful')}</strong>${button(t('yes'),'feedback-yes')}${button(t('no'),'feedback-no')}${button('Article link','article-link')}</div>${state.link?`<label class="hc-form">Article link<input aria-label="Article link" readonly value="https://lims.yigini.net/help/articles/${a.id}"></label>`:''}</article>`;}
function context(){return `<div class="hc-sectionline"><div><div class="hc-eyebrow">Technician workspace</div><h1>Soil pH (water)</h1></div>${!state.panel?button(I('circle-help')+' '+t('context'),'open-panel'):''}</div><p class="hc-intro">Run PH-08 · 40 samples · Demonstration worksheet</p><div class="${state.panel?'hc-layout':''}" style="margin-top:24px"><section class="hc-bench"><div class="hc-sectionline"><h2>Record your results</h2>${tag('Method context preserved')}</div><div class="hc-sheetrow"><strong>Sample</strong><strong>pH value</strong><small>Readiness</small></div><div class="hc-sheetrow"><strong>S001</strong><input id="hc-bench-value" inputmode="decimal" aria-label="pH draft for S001" value="${esc(state.input)}">${tag('Ready')}</div><div class="hc-sheetrow"><strong>S002</strong><span>Not recorded</span>${tag('Ready')}</div><div class="hc-sheetrow"><strong>S004</strong><button class="hc-link" data-act="open-panel">Explain blocker</button>${tag('Blocked',true)}</div><small style="margin-top:14px">Open and close help to keep your place in this worksheet.</small></section>${state.panel?`<aside class="hc-context" aria-label="Contextual workbench help"><div class="hc-sectionline"><h2>${t('context')}</h2><button class="hc-button" aria-label="${t('close')}" data-act="close-panel">${I('x')}</button></div><small>Workbench · Current task context</small><div class="hc-notice"><strong>S004 · Preparation incomplete</strong><br>Complete the required preparation workflow before recording this sample's analysis.</div>${['bench-blocked','bench-preparation','bench-run','bench-save-submit'].map(id=>`<div>${linkArticle(id)}</div>`).join('')}<div class="hc-panel"><h3>Your laboratory's guidance</h3><small>Approved local SOP links appear here when configured.</small></div><button class="hc-link" data-view="home">${t('searchAll')} ${I('arrow-right')}</button></aside>`:''}</div>`;}
function editor(){if(opts.role!=='admin'&&opts.role!=='manager')return `<h1>Manage help</h1><div class="hc-notice">Content editing is reserved for authorized editors. Use the preview role control to inspect this design.</div>`;return `<div class="hc-eyebrow">Administration / Help content</div><div class="hc-sectionline"><h1>Keep guidance current</h1>${tag(state.editorStage,true)}</div><p class="hc-intro">One source, reviewed guidance in five languages.</p><div class="hc-editorgrid"><section class="hc-form"><label>Scope<select id="hc-editor-scope"><option value="lab" ${state.scope==='lab'?'selected':''}>Your laboratory · local note</option>${opts.role==='admin'?`<option value="global" ${state.scope==='global'?'selected':''}>Global · core article</option>`:''}</select></label><label>Article title<input id="hc-edit-title" value="${esc(state.editorTitle)}"></label><label>${state.scope==='lab'?'Local guidance note':'Short answer'}<textarea id="hc-edit-body">${esc(state.editorBody)}</textarea></label><small>Changes create a draft. Published guidance remains unchanged.</small><div class="hc-actions">${button(t('saveDraft'),'editor-save')}${button(t('requestReview'),'editor-review',true,state.editorStage==='In review')}</div><div class="hc-panel"><h3>Publication checks</h3><ul class="hc-plainlist"><li>Behavior and method/SOP reference verified</li><li>Authorized editorial and scientific review</li><li>All launch languages reviewed against this source</li></ul>${button(t('publish'),'editor-publish',false,true)}<small style="margin-top:9px">Publication is unavailable until the required reviews are complete.</small></div></section><aside class="hc-panel"><h3>Language review</h3>${[['English','Draft ready'],['Español','Translation needed'],['Español · Latinoamérica','Translation needed'],['Français','Translation needed'],['Português','Translation needed']].map(([l,s])=>`<div class="hc-def"><span>${l}</span><strong>${s}</strong></div>`).join('')}<div style="margin-top:18px"><h3>Review context</h3><small>Owner: lab operations lead<br>Source revision: draft 1<br>Publication: not yet approved</small></div><button class="hc-link" data-article="bench-blocked">Preview source article ${I('arrow-right')}</button></aside></div>`;}
function support(){return `<button class="hc-link" data-view="home">${I('arrow-left')}${t('centre')}</button><div class="hc-eyebrow">${t('support')}</div><h1>Make the next step clear.</h1><p class="hc-intro">A short description helps the right colleague investigate.</p><section class="hc-panel hc-form"><div class="hc-def"><span>Destination</span><strong>Lab support contact not configured in this preview</strong></div><label>What were you trying to do?<textarea id="hc-support-text" placeholder="Describe the task and what happened…">${esc(state.supportMessage)}</textarea></label><small>Do not include passwords, access tokens or unnecessary sample results.</small><div class="hc-actions">${button('Preview request','support-preview',true)}</div></section><div class="hc-notice">The real application uses your lab's configured contact and shows the message and attachments for review before sending.</div>`;}
function render(){root.dataset.theme=opts.theme;$('#hc-avatar').textContent=opts.role==='admin'?'A':opts.role==='manager'?'E':'M';$('#hc-crumb').textContent='SoilFER / '+(state.view==='context'?'Workbench':state.view==='editor'?'Help administration':t('centre'));$('#hc-sidehelp').setAttribute('aria-current',['home','faq','guides','topic','search','article'].includes(state.view)?'page':'false');$('#hc-sideeditor').setAttribute('aria-current',state.view==='editor'?'page':'false');$('#hc-sideeditor').hidden=!['admin','manager'].includes(opts.role);$('#hc-content').innerHTML=state.view==='home'?home():['faq','guides','topic','search'].includes(state.view)?listing():state.view==='article'?reader():state.view==='context'?context():state.view==='editor'?editor():support();$('#hc-status').textContent=state.message;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function navigate(view){state.view=view;state.message='';state.link=false;if(view==='home'){state.topic='all';state.query='';state.kind='all';}if(view==='faq'){state.kind='faq';state.topic='all';}if(view==='guides'){state.kind='guide';state.topic='all';}render();}
root.addEventListener('submit',e=>{if(e.target.id==='hc-search-form'){e.preventDefault();state.kind='all';state.view='search';render();}});
root.addEventListener('input',e=>{const q=e.target;const map={'hc-query':'query','hc-bench-value':'input','hc-edit-title':'editorTitle','hc-edit-body':'editorBody','hc-support-text':'supportMessage'};if(map[q.id])state[map[q.id]]=q.value;if(q.id==='hc-edit-title'||q.id==='hc-edit-body'){state.editorStage='Draft';const badge=root.querySelector('.hc-sectionline .hc-tag');if(badge)badge.textContent='Draft';const review=root.querySelector('[data-act=editor-review]');if(review)review.disabled=false;}});
root.addEventListener('change',e=>{if(e.target.id==='hc-topic-select'){state.topic=e.target.value;render();}if(e.target.id==='hc-editor-scope'){state.scope=e.target.value;state.editorStage='Draft';render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.topic){state.topic=b.dataset.topic;state.query='';state.kind='all';navigate('topic');return;}if(b.dataset.article){if(state.view!=='article')state.back=state.view;state.article=b.dataset.article;state.link=false;navigate('article');return;}const a=b.dataset.act;if(!a)return;state.message='';if(a==='page-help'){if(state.view==='context'){state.panel=true;render();}else navigate('home');return;}if(a==='open-panel')state.panel=true;if(a==='close-panel')state.panel=false;if(a==='article-back'){navigate(state.back==='article'?'home':state.back);return;}if(a==='article-link')state.link=!state.link;if(a==='feedback-yes'||a==='feedback-no'){state.feedback[state.article]=a==='feedback-yes';state.message='Thank you. This design preview does not send feedback.';}if(a==='editor-save'){state.editorStage='Draft saved';state.message='Draft retained in the preview. No published article was changed.';}if(a==='editor-review'){if(!state.editorTitle.trim()||!state.editorBody.trim())state.message='Add a title and guidance before requesting review.';else{state.editorStage='In review';state.message='Review requested in this simulation. Publication remains locked.';}}if(a==='support-preview'){state.message=state.supportMessage.trim()?'Request preview ready; configure the authorized destination before sending. Nothing has been sent.':'Add a description first.';}render();if(a==='close-panel')$('#hc-help-button').focus();});
render();if(globalThis.Tweak){let prior=opts.scene;const tweak=new Tweak({container:root,onChange:()=>{if(opts.scene!==prior){state.view=opts.scene;state.query='';state.topic='all';state.kind=opts.scene==='faq'?'faq':opts.scene==='guides'?'guide':'all';state.article='bench-blocked';state.panel=true;state.message='';prior=opts.scene;}if(opts.role!=='admin')state.scope='lab';render();}});tweak.addSelect(opts,'scene',{label:'Screen',options:[{label:'Help Centre',value:'home'},{label:'FAQs',value:'faq'},{label:'Article',value:'article'},{label:'Workbench help',value:'context'},{label:'Content editor',value:'editor'}]});tweak.addSelect(opts,'role',{label:'Preview role',options:[{label:'Technician',value:'technician'},{label:'Reception',value:'reception'},{label:'Lab manager',value:'manager'},{label:'Administrator',value:'admin'}]});tweak.addSelect(opts,'theme',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Graphite',value:'graphite'}]});tweak.addSelect(opts,'locale',{label:'Interface language',options:[{label:'English',value:'en'},{label:'Español',value:'es'},{label:'Español · Latinoamérica',value:'es-419'},{label:'Français',value:'fr'},{label:'Português',value:'pt'}]});}
})();
</script>
</div>
