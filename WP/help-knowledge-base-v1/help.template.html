<div class="hc-caption">Design preview · article drafts for laboratory review</div>
<div class="hc-app"><aside class="hc-sidebar"><img class="hc-logo" src="__SOILFER_LOGO__" alt="SoilFER LIMS"><div class="hc-sidelabel">LABORATORY</div><button class="hc-navitem" data-view="context"><i data-lucide="flask-conical" aria-hidden="true"></i>Workbench</button><div class="hc-navitem hc-quiet"><i data-lucide="test-tubes" aria-hidden="true"></i>Samples</div><div class="hc-navitem hc-quiet"><i data-lucide="microscope" aria-hidden="true"></i>Equipment</div><div class="hc-navitem hc-quiet"><i data-lucide="files" aria-hidden="true"></i>Reports</div><div class="hc-sidelabel">GUIDANCE</div><button class="hc-navitem" data-view="home" id="hc-sidehelp"><i data-lucide="book-open" aria-hidden="true"></i>Help Centre</button><button class="hc-navitem" data-view="editor" id="hc-sideeditor"><i data-lucide="file-pen-line" aria-hidden="true"></i>Manage help</button><div class="hc-sidefoot">SoilFER laboratory workspace<div class="hc-soilband" aria-hidden="true"></div></div></aside><div class="hc-main"><header class="hc-header"><span class="hc-breadcrumb" id="hc-crumb">SoilFER / Help Centre</span><div class="hc-headcontrols"><button class="hc-headhelp" data-act="page-help" id="hc-help-button"><i data-lucide="circle-help" aria-hidden="true"></i>Help</button><span class="hc-avatar" id="hc-avatar">M</span></div></header><main class="hc-body" id="hc-content"></main><div class="hc-status" id="hc-status" role="status" aria-live="polite"></div></div></div>
<script type="application/json" id="hc-data">__HELP_DATA__</script>
<script type="application/json" id="hc-copy">__HELP_COPY__</script>
<script>
(()=>{
const root=document.getElementById('soilfer-help-study'),data=JSON.parse(document.getElementById('hc-data').textContent),copies=JSON.parse(document.getElementById('hc-copy').textContent);
const opts={scene:'home',theme:'light',locale:'en',role:'technician'};
const state={view:'home',topic:'all',query:'',kind:'all',article:'bench-blocked',back:'home',panel:true,input:'6.42',message:'',feedback:{},editorTitle:'Why can’t I start this analysis?',editorBody:'Read the current blocker. Receipt, preparation, assignment or equipment may still need attention.',editorStage:'Draft',scope:'lab',supportMessage:'',link:false};
const $=s=>root.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,t=k=>copies[opts.locale][k]||copies.en[k],cat=id=>copies[opts.locale].categories[id]||id,A=id=>data.articles.find(a=>a.id===id),tag=(s,w=false)=>`<span class="hc-tag${w?' hc-amber':''}">${esc(s)}</span>`;
const allowed=a=>opts.role==='admin'||a.roles.includes('all')||a.roles.includes(opts.role);
const norm=s=>s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function matches(){let q=norm(state.query.trim());return data.articles.filter(a=>allowed(a)&&(state.topic==='all'||a.category===state.topic)&&(state.kind==='all'||a.kind===state.kind)&&(!q||norm([a.title,a.summary,...a.keywords,cat(a.category)].join(' ')).includes(q)));}
function button(text,act,primary=false,disabled=false){return `<button class="hc-button${primary?' hc-primary':''}" data-act="${act}" ${disabled?'disabled':''}>${text}</button>`;}
function linkArticle(id,label){return `<button class="hc-link" data-article="${id}">${esc(label||A(id).title)} ${I('arrow-right')}</button>`;}
function articleRow(a){return `<button class="hc-row" data-article="${a.id}"><span><strong>${esc(a.title)}</strong><small>${esc(a.summary)}</small><small>${cat(a.category)} · ${a.minutes} min · English draft</small></span>${I('chevron-right')}</button>`;}
function search(){return `<form id="hc-search-form"><div class="hc-searchbox">${I('search')}<input id="hc-query" type="search" aria-label="${t('search')}" placeholder="${t('placeholder')}" value="${esc(state.query)}"><button type="submit" aria-label="${t('search')}">${I('arrow-right')}</button></div></form>`;}
function toolbar(){return `<nav class="hc-toolbar" aria-label="Help sections"><button data-view="home" aria-pressed="${state.view==='home'}">${t('centre')}</button><button data-view="faq" aria-pressed="${state.view==='faq'}">${t('faq')}</button><button data-view="guides" aria-pressed="${state.view==='guides'}">${t('guides')}</button></nav>`;}
function faqItem(a){return `<details><summary>${esc(a.title)}${I('chevron-down')}</summary><div class="hc-answer"><p>${esc(a.summary)}</p>${linkArticle(a.id,t('read'))}</div></details>`;}
function contact(){return `<div class="hc-contactstrip"><div><h3>Still need a hand?</h3><p>Ask the right person at your laboratory.</p></div><button class="hc-button" data-view="support">${I('messages-square')}${t('support')}</button></div>`;}
function home(){let pop=['bench-save-submit','bench-blocked','bench-spectra','offline-sync'].map(A).filter(allowed);return `<div class="hc-eyebrow">SoilFER / ${t('centre')}</div><h1>${t('hero')}</h1><p class="hc-intro">${t('intro')}</p>${search()}<div class="hc-searchhint">pH · preparation · spectra · reports · synchronization</div>${toolbar()}<div class="hc-categorygrid">${data.categories.map(c=>{let n=data.articles.filter(a=>a.category===c.id&&allowed(a)).length;return n?`<button class="hc-category" data-topic="${c.id}"><div class="hc-topicicon">${I(c.icon)}</div><span><h3>${cat(c.id)}</h3><small>${esc(c.description)}</small><small>${n} ${n===1?'article':'articles'}</small></span>${I('chevron-right')}</button>`:''}).join('')}</div><div class="hc-sectionline"><h2>Questions from the bench</h2><button class="hc-link" data-view="faq">${t('faq')} ${I('arrow-right')}</button></div><div class="hc-questions">${pop.map(faqItem).join('')}</div>${contact()}`;}
function listing(){let items=matches();let title=state.view==='search'?t('search'):state.view==='faq'?t('faq'):state.view==='guides'?t('guides'):cat(state.topic);return `<div class="hc-eyebrow">${t('centre')}</div><h1>${title}</h1><p class="hc-intro">${state.view==='faq'?'Straight answers to everyday laboratory questions.':'Find the next step and know what success looks like.'}</p>${search()}${toolbar()}<div class="hc-sectionline"><label class="hc-form">Topic <select id="hc-topic-select" aria-label="Topic"><option value="all">${t('all')}</option>${data.categories.map(c=>`<option value="${c.id}" ${state.topic===c.id?'selected':''}>${cat(c.id)}</option>`).join('')}</select></label><small>${items.length} ${items.length===1?'result':'results'} · English draft content</small></div>${items.length?(state.view==='faq'?`<div class="hc-questions">${items.map(faqItem).join('')}</div>`:items.map(articleRow).join('')):`<div class="hc-empty"><h2>${t('zero')}</h2><p>${t('zeroHint')}</p><button class="hc-link" data-view="home">${t('centre')}</button></div>`}${contact()}`;}
function reader(){const a=A(state.article);if(!a||!allowed(a))return `<h1>${t('centre')}</h1><div class="hc-notice">${t('permission')}</div>`;return `<button class="hc-link" data-act="article-back">${I('arrow-left')}${t('back')}</button><article class="hc-article"><div class="hc-eyebrow">${cat(a.category)} / ${a.kind==='faq'?t('faq'):t('guides')}</div><h1>${esc(a.title)}</h1><p class="hc-lead">${esc(a.summary)}</p><div class="hc-meta">${tag('Editorial draft',true)}<span>${a.minutes} min read</span><span>English · Revision 1 proposed</span></div>${opts.locale!=='en'?`<div class="hc-notice">${t('sourceFallback')}</div>`:''}<h2>What to do</h2><ol>${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="hc-panel"><h3>What success looks like</h3><p>${esc(a.success)}</p></div><div class="hc-notice"><strong>Keep in mind</strong><br>${esc(a.caution)}</div><small>Review owner to assign: ${esc(a.reviewOwner)}<br>Application controls and SOP references must be verified before publication.</small><h2>Related guidance</h2>${a.related.map(A).filter(allowed).map(a=>`<div>${linkArticle(a.id)}</div>`).join('')}<div class="hc-feedback"><strong>${t('useful')}</strong>${button(t('yes'),'feedback-yes')}${button(t('no'),'feedback-no')}${button('Article link','article-link')}</div>${state.link?`<label class="hc-form">Article link<input aria-label="Article link" readonly value="https://lims.yigini.net/help/articles/${a.id}"></label>`:''}</article>`;}
function context(){return `<div class="hc-sectionline"><div><div class="hc-eyebrow">Technician workspace</div><h1>Soil pH (water)</h1></div>${!state.panel?button(I('circle-help')+' '+t('context'),'open-panel'):''}</div><p class="hc-intro">Run PH-08 · 40 samples · Demonstration worksheet</p><div class="${state.panel?'hc-layout':''}" style="margin-top:24px"><section class="hc-bench"><div class="hc-sectionline"><h2>Record your results</h2>${tag('Method context preserved')}</div><div class="hc-sheetrow"><strong>Sample</strong><strong>pH value</strong><small>Readiness</small></div><div class="hc-sheetrow"><strong>S001</strong><input id="hc-bench-value" inputmode="decimal" aria-label="pH draft for S001" value="${esc(state.input)}">${tag('Ready')}</div><div class="hc-sheetrow"><strong>S002</strong><span>Not recorded</span>${tag('Ready')}</div><div class="hc-sheetrow"><strong>S004</strong><button class="hc-link" data-act="open-panel">Explain blocker</button>${tag('Blocked',true)}</div><small style="margin-top:14px">Open and close help to keep your place in this worksheet.</small></section>${state.panel?`<aside class="hc-context" aria-label="Contextual workbench help"><div class="hc-sectionline"><h2>${t('context')}</h2><button class="hc-button" aria-label="${t('close')}" data-act="close-panel">${I('x')}</button></div><small>Workbench · Current task context</small><div class="hc-notice"><strong>S004 · Preparation incomplete</strong><br>Complete the required preparation workflow before recording this sample's analysis.</div>${['bench-blocked','bench-preparation','bench-run','bench-save-submit'].map(id=>`<div>${linkArticle(id)}</div>`).join('')}<div class="hc-panel"><h3>Your laboratory's guidance</h3><small>Approved local SOP links appear here when configured.</small></div><button class="hc-link" data-view="home">${t('searchAll')} ${I('arrow-right')}</button></aside>`:''}</div>`;}
function editor(){if(opts.role!=='admin'&&opts.role!=='manager')return `<h1>Manage help</h1><div class="hc-notice">Content editing is reserved for authorized editors. Use the preview role control to inspect this design.</div>`;return `<div class="hc-eyebrow">Administration / Help content</div><div class="hc-sectionline"><h1>Keep guidance current</h1>${tag(state.editorStage,true)}</div><p class="hc-intro">One source, reviewed guidance in five languages.</p><div class="hc-editorgrid"><section class="hc-form"><label>Scope<select id="hc-editor-scope"><option value="lab" ${state.scope==='lab'?'selected':''}>Your laboratory · local note</option>${opts.role==='admin'?`<option value="global" ${state.scope==='global'?'selected':''}>Global · core article</option>`:''}</select></label><label>Article title<input id="hc-edit-title" value="${esc(state.editorTitle)}"></label><label>${state.scope==='lab'?'Local guidance note':'Short answer'}<textarea id="hc-edit-body">${esc(state.editorBody)}</textarea></label><small>Changes create a draft. Published guidance remains unchanged.</small><div class="hc-actions">${button(t('saveDraft'),'editor-save')}${button(t('requestReview'),'editor-review',true,state.editorStage==='In review')}</div><div class="hc-panel"><h3>Publication checks</h3><ul class="hc-plainlist"><li>Behavior and method/SOP reference verified</li><li>Authorized editorial and scientific review</li><li>All launch languages reviewed against this source</li></ul>${button(t('publish'),'editor-publish',false,true)}<small style="margin-top:9px">Publication is unavailable until the required reviews are complete.</small></div></section><aside class="hc-panel"><h3>Language review</h3>${[['English','Draft ready'],['Español','Translation needed'],['Español · Latinoamérica','Translation needed'],['Français','Translation needed'],['Português','Translation needed']].map(([l,s])=>`<div class="hc-def"><span>${l}</span><strong>${s}</strong></div>`).join('')}<div style="margin-top:18px"><h3>Review context</h3><small>Owner: lab operations lead<br>Source revision: draft 1<br>Publication: not yet approved</small></div><button class="hc-link" data-article="bench-blocked">Preview source article ${I('arrow-right')}</button></aside></div>`;}
function support(){return `<button class="hc-link" data-view="home">${I('arrow-left')}${t('centre')}</button><div class="hc-eyebrow">${t('support')}</div><h1>Make the next step clear.</h1><p class="hc-intro">A short description helps the right colleague investigate.</p><section class="hc-panel hc-form"><div class="hc-def"><span>Destination</span><strong>Lab support contact not configured in this preview</strong></div><label>What were you trying to do?<textarea id="hc-support-text" placeholder="Describe the task and what happened…">${esc(state.supportMessage)}</textarea></label><small>Do not include passwords, access tokens or unnecessary sample results.</small><div class="hc-actions">${button('Preview request','support-preview',true)}</div></section><div class="hc-notice">The real application uses your lab's configured contact and shows the message and attachments for review before sending.</div>`;}
function render(){root.dataset.theme=opts.theme;$('#hc-avatar').textContent=opts.role==='admin'?'A':opts.role==='manager'?'E':'M';$('#hc-crumb').textContent='SoilFER / '+(state.view==='context'?'Workbench':state.view==='editor'?'Help administration':t('centre'));$('#hc-sidehelp').setAttribute('aria-current',['home','faq','guides','topic','search','article'].includes(state.view)?'page':'false');$('#hc-sideeditor').setAttribute('aria-current',state.view==='editor'?'page':'false');$('#hc-sideeditor').hidden=!['admin','manager'].includes(opts.role);$('#hc-content').innerHTML=state.view==='home'?home():['faq','guides','topic','search'].includes(state.view)?listing():state.view==='article'?reader():state.view==='context'?context():state.view==='editor'?editor():support();$('#hc-status').textContent=state.message;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function navigate(view){state.view=view;state.message='';state.link=false;if(view==='home'){state.topic='all';state.query='';state.kind='all';}if(view==='faq'){state.kind='faq';state.topic='all';}if(view==='guides'){state.kind='guide';state.topic='all';}render();}
root.addEventListener('submit',e=>{if(e.target.id==='hc-search-form'){e.preventDefault();state.kind='all';state.view='search';render();}});
root.addEventListener('input',e=>{const q=e.target;const map={'hc-query':'query','hc-bench-value':'input','hc-edit-title':'editorTitle','hc-edit-body':'editorBody','hc-support-text':'supportMessage'};if(map[q.id])state[map[q.id]]=q.value;if(q.id==='hc-edit-title'||q.id==='hc-edit-body'){state.editorStage='Draft';const badge=root.querySelector('.hc-sectionline .hc-tag');if(badge)badge.textContent='Draft';const review=root.querySelector('[data-act=editor-review]');if(review)review.disabled=false;}});
root.addEventListener('change',e=>{if(e.target.id==='hc-topic-select'){state.topic=e.target.value;render();}if(e.target.id==='hc-editor-scope'){state.scope=e.target.value;state.editorStage='Draft';render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.topic){state.topic=b.dataset.topic;state.query='';state.kind='all';navigate('topic');return;}if(b.dataset.article){if(state.view!=='article')state.back=state.view;state.article=b.dataset.article;state.link=false;navigate('article');return;}const a=b.dataset.act;if(!a)return;state.message='';if(a==='page-help'){if(state.view==='context'){state.panel=true;render();}else navigate('home');return;}if(a==='open-panel')state.panel=true;if(a==='close-panel')state.panel=false;if(a==='article-back'){navigate(state.back==='article'?'home':state.back);return;}if(a==='article-link')state.link=!state.link;if(a==='feedback-yes'||a==='feedback-no'){state.feedback[state.article]=a==='feedback-yes';state.message='Thank you. This design preview does not send feedback.';}if(a==='editor-save'){state.editorStage='Draft saved';state.message='Draft retained in the preview. No published article was changed.';}if(a==='editor-review'){if(!state.editorTitle.trim()||!state.editorBody.trim())state.message='Add a title and guidance before requesting review.';else{state.editorStage='In review';state.message='Review requested in this simulation. Publication remains locked.';}}if(a==='support-preview'){state.message=state.supportMessage.trim()?'Request preview ready; configure the authorized destination before sending. Nothing has been sent.':'Add a description first.';}render();if(a==='close-panel')$('#hc-help-button').focus();});
render();if(globalThis.Tweak){let prior=opts.scene;const tweak=new Tweak({container:root,onChange:()=>{if(opts.scene!==prior){state.view=opts.scene;state.query='';state.topic='all';state.kind=opts.scene==='faq'?'faq':opts.scene==='guides'?'guide':'all';state.article='bench-blocked';state.panel=true;state.message='';prior=opts.scene;}if(opts.role!=='admin')state.scope='lab';render();}});tweak.addSelect(opts,'scene',{label:'Screen',options:[{label:'Help Centre',value:'home'},{label:'FAQs',value:'faq'},{label:'Article',value:'article'},{label:'Workbench help',value:'context'},{label:'Content editor',value:'editor'}]});tweak.addSelect(opts,'role',{label:'Preview role',options:[{label:'Technician',value:'technician'},{label:'Reception',value:'reception'},{label:'Lab manager',value:'manager'},{label:'Administrator',value:'admin'}]});tweak.addSelect(opts,'theme',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Graphite',value:'graphite'}]});tweak.addSelect(opts,'locale',{label:'Interface language',options:[{label:'English',value:'en'},{label:'Español',value:'es'},{label:'Español · Latinoamérica',value:'es-419'},{label:'Français',value:'fr'},{label:'Português',value:'pt'}]});}
})();
</script>
</div>
