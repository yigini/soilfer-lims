<script>
(()=>{
const root=document.getElementById('soilfer-director-tour');if(!root)return;
const story={"id":"director-3m-en-v1","status":"PROPOSAL_AWAITING_USER_PREVIEW_APPROVAL","language":"en","durationSeconds":180,"title":"Five samples. One traceable laboratory journey.","entryUrl":"https://lims.yigini.net/login?tutorialmode=true&tour=director-3m&lang=en","project":"SOILFER-US","dataMode":"isolated-demonstration-records","steps":[{"id":"welcome","seconds":14,"chapter":"Access","role":"Visitor","route":"/login","anchor":"login.form","title":"One platform, several working languages","caption":"Role-specific access, with English, Spanish, French and Portuguese interface options.","action":"Enter demonstration","checkpoint":"login","say":"This is SoilFER LIMS. Staff use role-specific workspaces with multilingual interface options. In three minutes, we will follow five demonstration samples from field collection to reviewed laboratory information."},{"id":"home","seconds":6,"chapter":"Access","role":"Reception","route":"/","anchor":"dashboard.primary-queue","title":"Start with the work that matters","caption":"Each role opens on its own work and exceptions.","action":"See the five samples","checkpoint":"expected","say":"Each person opens on the work that needs their attention: reception, analysis or review."},{"id":"field","seconds":16,"chapter":"Field to lab","role":"Reception","route":"/samples/{firstSampleId}?tab=request","anchor":"sample.field-provenance","title":"The field record travels with the sample","caption":"Kobo supplies sample identity, collection details and field context. Expected is not received.","action":"Follow to reception","checkpoint":"expected","say":"These five samples belong to SOILFER-US. Kobo brings their field identity, collection details and location into the laboratory record. They remain expected samples until staff record their physical arrival."},{"id":"receive","seconds":20,"chapter":"Field to lab","role":"Reception","route":"/reception?sampleId={firstSampleId}","anchor":"reception.acceptance-summary","title":"Check the material, then accept it","caption":"Match the label, inspect condition and quantity, and confirm the requested analyses.","action":"View five accepted intakes","checkpoint":"received","say":"Reception matches each container to its field record, checks condition and quantity, and confirms the requested analyses. Here are all five intake receipts. Each sample now has a laboratory identity and a recorded handover."},{"id":"assign","seconds":16,"chapter":"Laboratory work","role":"Manager","route":"/manager-queue","anchor":"manager.assignment-summary","title":"People, instruments and supplies, connected","caption":"Assign the work; check equipment readiness and laboratory stock.","action":"Follow the technician","checkpoint":"assigned","say":"The manager assigns the work to staff using the selected methods. Equipment records show instrument readiness and maintenance. Inventory provides visibility of laboratory supplies, helping the team prepare for the work ahead."},{"id":"prepare","seconds":14,"chapter":"Laboratory work","role":"Technician","route":"/workbench?runId={prepRunId}","anchor":"workbench.operation-evidence","title":"Prepare the material before analysis","caption":"Recorded drying and preparation checks make the next work available.","action":"View prepared batch","checkpoint":"prepared","say":"Drying and preparation follow the laboratory procedure and leave a recorded checklist. They take real time. This presentation moves to a prepared demonstration checkpoint; it does not perform those physical operations instantly."},{"id":"worksheet","seconds":19,"chapter":"Laboratory work","role":"Technician","route":"/workbench?runId={phRunId}","anchor":"workbench.worksheet","title":"One analysis bench for the whole batch","caption":"Five pH readings in one worksheet. Sand, silt and clay stay together as texture.","action":"Record demonstration results","checkpoint":"measured","say":"At the analysis bench, the technician works by method across the batch. Five pH readings share one worksheet. Texture keeps sand, silt and clay together. Drafts, recorded results and submissions remain distinct."},{"id":"spectra","seconds":14,"chapter":"Laboratory work","role":"Technician","route":"/workbench?runId={spectralRunId}","anchor":"workbench.spectral-evidence","title":"Keep the spectrum, not just a number","caption":"MIR and NIR use instrument files, with their sample identity and quality checks.","action":"Inspect the linked spectrum","checkpoint":"spectra","say":"MIR and NIR analysis use spectra exported from instruments. The file, sample identity and quality information remain linked. The spectral library lets staff inspect this evidence rather than retype a single number."},{"id":"review","seconds":16,"chapter":"Review and release","role":"Manager","route":"/manager-queue?queue=manager.review","anchor":"manager.submission-review","title":"Review the evidence before release","caption":"Submitted work is reviewed with its quality checks. Problems can be returned with a reason.","action":"View reviewed batch","checkpoint":"reviewed","say":"The manager reviews submitted results and quality checks, then accepts or returns the work with a reason. A newly received sample cannot qualify for approval simply because it is in the system."},{"id":"report","seconds":17,"chapter":"Review and release","role":"Manager","route":"/samples/{firstSampleId}/map","secondaryRoute":"/samples/{firstSampleId}?tab=reports","anchor":"workflow-map.path","title":"See the whole journey, then the report","caption":"The workflow map explains dependencies. Reports preserve the reviewed evidence and its history.","action":"See the data connection","checkpoint":"reported","say":"The workflow map shows each stage and its dependencies. The sample record connects that journey to reviewed results and versioned reports. A value can be traced back to its method, operator and supporting evidence."},{"id":"exchange","seconds":15,"chapter":"Connected information","role":"Data administrator","route":"/admin?tab=api-keys","anchor":"exchange.preview","title":"Connect laboratory work to national information","caption":"SIS means Soil Information System. This is an exchange preview, not a claimed live delivery.","action":"Conclude the walkthrough","checkpoint":"exchange-preview","say":"The exchange interface connects laboratory information with national Soil Information Systems. Here we preview sample identity, location and results together. The receiving national team will validate its connection during the pilot."},{"id":"pilot","seconds":13,"chapter":"Next step","role":"Presenter","route":"/tutorial/summary","anchor":"tutorial.pilot-next-step","title":"Next: controlled testing in a real laboratory","caption":"Agree the pilot laboratory, operators and acceptance checks.","action":"Finish walkthrough","checkpoint":"complete","say":"Our next step is controlled real-laboratory testing. We will agree the operators, sign off the workflow checks and collect feedback on traceability, reliable daily work and reviewed results."}]};
const fixture={"scenarioId":"director-3m-soilfer-us-v1","provenance":"SYNTHETIC_DEMONSTRATION_ONLY","liveSampleIds":[],"productionWritesPermitted":false,"projectCode":"SOILFER-US","laboratoryLabel":"Guatemala laboratory — demonstration","databaseNamespace":"unique-per-rehearsal-session","orderGroups":["pH in water","Soil texture","MIR spectroscopy"],"gateTasksPerSample":["Sample drying","Sample preparation"],"counts":{"samples":5,"analyticalOrderGroups":15,"operationalTasks":10,"pHResults":5,"textureGroups":5,"spectralAcquisitions":5},"samples":[{"displayId":"DEMO-US-001","fieldId":"DEMO-FIELD-001","matrix":"SOIL","collectionLabel":"Demonstration site A","pH":6.2,"texture":{"sand":40,"silt":40,"clay":20,"unit":"%","illustrativeClass":"Loam"},"spectrum":"DEMO-US-001-MIR.csv"},{"displayId":"DEMO-US-002","fieldId":"DEMO-FIELD-002","matrix":"SOIL","collectionLabel":"Demonstration site B","pH":6.6,"texture":{"sand":40,"silt":40,"clay":20,"unit":"%","illustrativeClass":"Loam"},"spectrum":"DEMO-US-002-MIR.csv"},{"displayId":"DEMO-US-003","fieldId":"DEMO-FIELD-003","matrix":"SOIL","collectionLabel":"Demonstration site C","pH":5.9,"texture":{"sand":40,"silt":40,"clay":20,"unit":"%","illustrativeClass":"Loam"},"spectrum":"DEMO-US-003-MIR.csv"},{"displayId":"DEMO-US-004","fieldId":"DEMO-FIELD-004","matrix":"SOIL","collectionLabel":"Demonstration site D","pH":7.1,"texture":{"sand":40,"silt":40,"clay":20,"unit":"%","illustrativeClass":"Loam"},"spectrum":"DEMO-US-004-MIR.csv"},{"displayId":"DEMO-US-005","fieldId":"DEMO-FIELD-005","matrix":"SOIL","collectionLabel":"Demonstration site E","pH":6.4,"texture":{"sand":40,"silt":40,"clay":20,"unit":"%","illustrativeClass":"Loam"},"spectrum":"DEMO-US-005-MIR.csv"}],"notes":["These identifiers are labels. Generate fresh immutable IDs in the isolated rehearsal database; do not reuse W001 or existing samples.","No actual Kobo records, personal details or precise locations were copied. Field provenance in the mockup is illustrative.","Resolve real applicable methods, procedure revisions, units, instruments and qualification on the rehearsal build. Do not invent a scientific SOP to match this manifest.","Spectrum filenames are planned fixture names, not measured instrument exports. The preview curve is illustrative. Antigravity must generate labelled synthetic import fixtures or use authorized anonymized exports and verify the real parser before the live rehearsal.","The illustrative texture class must be recomputed by the actual validated classifier in rehearsal. This file does not replace method-specific mass balance tolerances or scientific validation.","All five samples reach every demonstrated checkpoint. Extra physical replicates and QC controls have separate identifiers and do not inflate the five-sample story."]};
const find=s=>root.querySelector(s),steps=story.steps;
let at=0,elapsed=0,playing=false,ended=false,noteOpen=false,moreOpen=false;
const design={layout:'spotlight'};
const tag=(s,w=false)=>`<span class="sd-tag${w?' sd-amber':''}">${s}</span>`;
const samples=fixture.samples;
const rows=(headers,fn)=>`<div class="sd-table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${samples.map(fn).join('')}</tbody></table></div>`;
const panel=(title,body,badge='')=>`<section class="sd-panel sd-highlight" data-tour-target="${steps[at].anchor}"><div class="sd-panel-head"><h3>${title}</h3>${badge}</div>${body}</section>`;
const features=[
 ['Multilingual working','English, Español, Français and Português are interface options. The meeting narration is English. The implementation plan also requires translated tour captions, validation messages and accessibility labels, with a safe fallback for incomplete translations.'],
 ['Projects and Kobo','Projects connect field identifiers and collection records to laboratory work. Kobo credentials and raw tokens must stay hidden during the meeting.'],
 ['Sample identity and workflow map','A sample retains its field identity, laboratory identity, preparation and results. The workflow map shows dependencies and the next eligible work.'],
 ['Analysis configuration','Readable analysis names, methods, groups and applicable preparation determine the work. This catalogue must agree with the actual active order.'],
 ['Equipment and inventory','Instrument qualification, maintenance and supplies support daily laboratory operations. Show the existing pages when asked; this tour does not claim automatic instrument control.'],
 ['Quality assurance and audit','QC, review decisions, returned work and audit history make checks and responsibility visible. Approved evidence must remain traceable when corrected.'],
 ['Spectral library','Inspect a linked MIR or NIR spectrum and its source metadata. Uploading a spectrum does not by itself validate a prediction model.'],
 ['Reports, data tables and national SIS','Reviewed results can be inspected in reports and data views. The SIS interface supports an agreed exchange; this preview does not assert that a national system has received the data.'],
 ['People, languages and material custody','Role-specific workspaces, supported interface languages, labels, storage and controlled archiving/disposal support real lab routines. Staff and permissions remain enforced during the show.']
];
function content(){switch(steps[at].id){
case 'home':return panel('Reception · work needing attention',rows(['Project samples','Arrival','Next action'],s=>`<tr><td>${s.displayId}</td><td>${tag('Expected')}</td><td>Match on arrival</td></tr>`),tag('5 expected')); 
case 'field':return panel('SOILFER-US · field provenance',rows(['Field identity','Collection context','Laboratory state'],s=>`<tr><td>${s.fieldId}</td><td>${s.collectionLabel}</td><td>Expected</td></tr>`),tag('Illustrative Kobo records'))+`<div class="sd-flow"><span>Kobo field collection</span>→<span>Sample manifest</span>→<span>Physical reception</span></div>`;
case 'receive':return panel('Five accepted intake receipts',rows(['Laboratory sample','Condition / quantity','Receipt'],s=>`<tr><td>${s.displayId}</td><td>Checked against request</td><td>${tag('Accepted · demo')}</td></tr>`),tag('5 of 5 received'));
case 'assign':return panel('Assignment · SOILFER-US',rows(['Sample','Ordered analyses','Assigned to'],s=>`<tr><td>${s.displayId}</td><td>pH · texture · MIR</td><td>Demonstration technician</td></tr>`)+`<div class="sd-panel-body"><div class="sd-mini-grid"><div><strong>People</strong>Assignment and responsibility</div><div><strong>Equipment</strong>Readiness and maintenance</div><div><strong>Inventory</strong>Stock and expiry visibility</div></div></div>`,tag('15 analysis groups'));
case 'prepare':return panel('Recorded preparation · all five samples',rows(['Sample','Drying','Preparation'],s=>`<tr><td>${s.displayId}</td><td>${tag('Recorded')}</td><td>${tag('Recorded')}</td></tr>`),tag('Prepared checkpoint'))+`<div class="sd-flow"><span>Applicable procedure</span>→<span>Saved checklist evidence</span>→<span>Analysis available</span></div>`;
case 'worksheet':return panel('pH in water · method worksheet',rows(['Sample','pH reading','Record state'],s=>`<tr><td>${s.displayId}</td><td>${s.pH.toFixed(2)}</td><td>${tag('Demonstration reading')}</td></tr>`)+`<div class="sd-panel-body"><h3>Texture is one analysis group</h3><span>Sand 40% · silt 40% · clay 20% = 100% · illustrative class: Loam</span></div>`,tag('5 samples'));
case 'spectra':return panel('MIR spectrum · DEMO-US-001',`<div class="sd-panel-body"><div class="sd-spectrum-title">Illustrative spectrum — not an instrument measurement</div><svg class="sd-spectrum" viewBox="0 0 610 135" role="img" aria-label="Illustrative MIR spectrum: synthetic absorbance against wavenumber"><line x1="35" y1="105" x2="588" y2="105"/><line x1="35" y1="12" x2="35" y2="105"/><path d="M35 91 C80 90 100 85 128 51 S160 43 183 68 S207 88 235 89 S264 62 288 78 S324 77 348 26 S369 77 391 83 S418 59 442 71 S478 35 499 79 S550 82 588 88"/><text x="35" y="124">4000</text><text x="556" y="124">600 cm⁻¹</text><text x="40" y="16">Synthetic absorbance</text></svg><div class="sd-mini-grid"><div><strong>Original file</strong>DEMO-US-001-MIR.csv</div><div><strong>Sample link</strong>DEMO-US-001</div><div><strong>Batch evidence</strong>5 planned acquisitions</div></div></div>`,tag('Demonstration evidence'));
case 'review':return panel('Submitted work · manager review',rows(['Sample','Evidence coverage','Review action'],s=>`<tr><td>${s.displayId}</td><td>pH · texture · MIR</td><td>${tag('Inspect / accept / return')}</td></tr>`),tag('5 review packages'));
case 'report':return panel('Workflow map · DEMO-US-001',`<div class="sd-panel-body"><div class="sd-flow" aria-label="Sample workflow dependencies"><span>Intake ✓</span>→<span>Drying ✓</span>→<span>Preparation ✓</span>→<span>Analysis ✓</span>→<span>Review ✓</span></div><div class="sd-mini-grid"><div><strong>Versioned report</strong>pH 6.20 · texture Loam</div><div><strong>Spectrum</strong>Linked MIR evidence</div><div><strong>History</strong>Method · operator · decision</div></div><p class="sd-muted">Demonstration report · not for analytical use</p></div>`,tag('Reviewed checkpoint'));
case 'exchange':return panel('National SIS · exchange preview',rows(['Sample identity','Project','Exchange content'],s=>`<tr><td>${s.displayId}</td><td>SOILFER-US</td><td>Provenance + reviewed results</td></tr>`),tag('Preview · not sent',true))+`<div class="sd-flow"><span>Laboratory</span>→<span>Authorized exchange</span>→<span>National Soil Information System</span></div>`;
case 'pilot':return panel('A controlled real-laboratory pilot',`<div class="sd-panel-body"><h2>Five samples. One traceable journey.</h2><ul class="sd-list"><li>Agree the pilot laboratory and operators.</li><li>Sign off workflow and integration checks.</li><li>Test daily work, capture feedback and improve.</li></ul><p class="sd-muted">Scope demonstrated: field → intake → preparation → results → review → exchange preview.</p></div>`,tag('Next step'));
default:return '';}}
function app(){if(at===0)return `<div class="sd-login"><div class="sd-login-art"><div class="sd-wordmark">SoilFER <span>LIMS</span></div><h1>From field sample to trusted information.</h1><p>Laboratory work, connected and traceable.</p><p>SOILFER-US · five demonstration samples</p></div><div class="sd-login-form"><section class="sd-panel sd-highlight" data-tour-target="login.form"><div class="sd-panel-body"><h2>Welcome to SoilFER LIMS</h2><p class="sd-muted">Sign in to your workspace</p><label>Account</label><input aria-label="Demonstration account" value="Reception · demonstration" readonly><label>Password</label><input aria-label="Password hidden in presentation" type="password" value="preview-only" readonly><button class="sd-primary" data-scene-next>Enter demonstration →</button><p class="sd-muted" style="font-size:11px;margin:12px 0 0">Preview only · no real credentials</p></div></section></div></div>`;
const names={home:'Reception console',field:'Sample & field record',receive:'Reception',assign:'Manager queue',prepare:'Workbench',worksheet:'Workbench',spectra:'Workbench · spectroscopy',review:'Manager queue',report:'Sample record',exchange:'National SIS & data exchange',pilot:'Project meeting'};
let active=['prepare','worksheet','spectra'].includes(steps[at].id)?'Workbench':steps[at].id==='exchange'?'Data exchange':['assign','review'].includes(steps[at].id)?'Manager queue':steps[at].id==='receive'?'Reception':['field','report'].includes(steps[at].id)?'Samples':'Dashboard';
return `<div class="sd-app-header"><span>SOILFER-US <span class="sd-tag">Demonstration workspace</span></span><div class="sd-account"><span class="sd-avatar">${steps[at].role.charAt(0)}</span><span>${steps[at].role}</span></div></div><div class="sd-shell"><aside class="sd-sidebar" aria-label="Application context">${['Dashboard','Samples','Reception','Workbench','Manager queue','Spectral library','Reports','Data exchange'].map(n=>`<div class="${n===active?'sd-active':''}">${n}</div>`).join('')}</aside><div class="sd-content"><div class="sd-eyebrow">${steps[at].chapter}</div><h1>${names[steps[at].id]}</h1><span class="sd-muted">${steps[at].id==='pilot'?'Controlled pilot proposal':'Five demonstration samples · Guatemala laboratory'}</span>${content()}</div></div>`;}
function clock(){const used=steps.slice(0,at).reduce((s,v)=>s+v.seconds,0)+elapsed;const left=Math.max(0,180-used);find('#sd-clock').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;find('#sd-duration').textContent=`${steps[at].seconds}s scene`;find('#sd-play').textContent=ended?'Restart preview':playing?'Pause':'Play 3-minute tour';}
function fitGuide(){const stage=find('#sd-stage');if(root.clientWidth<=560||design.layout==='docked'||ended){stage.style.minHeight='';return;}const focus=find('.sd-highlight');if(!focus)return;const height=Math.ceil(Math.max(730,focus.getBoundingClientRect().bottom-stage.getBoundingClientRect().top+find('#sd-coach').getBoundingClientRect().height+50));if(stage.style.minHeight!==height+'px')stage.style.minHeight=height+'px';}
function render(){
 root.classList.toggle('sd-docked',design.layout==='docked');find('#sd-app').innerHTML=app();
 find('#sd-scene').value=String(at);find('#sd-step-label').textContent=`${String(at+1).padStart(2,'0')} / 12 · ${steps[at].chapter}`;
 find('#sd-title').textContent=steps[at].title;find('#sd-caption').textContent=steps[at].caption;find('#sd-next').textContent=steps[at].action+' →';find('#sd-prev').disabled=at===0;
 find('#sd-notes').textContent=steps[at].say;find('#sd-notes').hidden=!noteOpen;find('#sd-note-toggle').textContent=noteOpen?'Hide notes':'Presenter notes';find('#sd-more').hidden=!moreOpen;
 find('#sd-track').innerHTML=steps.map((s,i)=>`<span class="sd-tick ${i<=at?'sd-done':''}"></span>`).join('');find('#sd-coach').hidden=ended;find('#sd-veil').hidden=ended;
 find('#sd-status').textContent=ended?'Preview ended · no laboratory records changed':playing?'Timed rehearsal · demonstration checkpoints':'Five demonstration samples · English';
 root.querySelectorAll('[data-scene-next]').forEach(b=>b.onclick=()=>move(1));
 const languageHost=at===0?find('.sd-login-form .sd-panel-body'):find('.sd-app-header');
 if(languageHost){const languageButton=document.createElement('button');languageButton.className='sd-link';languageButton.textContent=at===0?'English · Español · Français · Português':'Languages';languageButton.style.fontSize='11px';languageButton.onclick=()=>{playing=false;moreOpen=true;render();find('#sd-feature-list details').open=true;find('#sd-more').scrollIntoView({block:'nearest',behavior:'auto'});};languageHost.append(languageButton);}
 clock();requestAnimationFrame(fitGuide);
}
function move(delta){playing=false;if(at===steps.length-1&&delta===1){ended=true;elapsed=steps[at].seconds;}else{at=Math.max(0,Math.min(steps.length-1,at+delta));elapsed=0;}noteOpen=false;render();}
function tick(){if(!playing||ended||!root.isConnected)return;elapsed++;if(elapsed>=steps[at].seconds){if(at===steps.length-1){playing=false;ended=true;}else{at++;elapsed=0;}render();}else clock();}
find('#sd-scene').innerHTML=steps.map((s,i)=>`<option value="${i}">${i+1}. ${s.chapter} — ${s.title}</option>`).join('');
find('#sd-feature-list').innerHTML=features.map(([title,text])=>`<details><summary>${title}</summary><p>${text}</p></details>`).join('');
find('#sd-scene').onchange=e=>{at=+e.target.value;elapsed=0;playing=false;ended=false;noteOpen=false;render();};
find('#sd-prev').onclick=()=>move(-1);find('#sd-next').onclick=()=>move(1);
find('#sd-play').onclick=()=>{if(ended){at=0;elapsed=0;ended=false;}playing=!playing;noteOpen=false;moreOpen=false;render();};
find('#sd-note-toggle').onclick=()=>{playing=false;noteOpen=!noteOpen;render();};find('#sd-more-toggle').onclick=()=>{playing=false;moreOpen=true;render();find('#sd-more').scrollIntoView({block:'nearest',behavior:'auto'});};find('#sd-close-more').onclick=()=>{moreOpen=false;render();};find('#sd-exit').onclick=()=>{ended=true;playing=false;render();};
root.addEventListener('keydown',e=>{if(e.key==='Escape'){playing=false;moreOpen=false;noteOpen=false;render();}if(e.target.matches('input,select,textarea,button,summary'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
const observer=typeof ResizeObserver==='undefined'?null:new ResizeObserver(fitGuide);if(observer)observer.observe(root);
const timer=setInterval(()=>{if(!root.isConnected){clearInterval(timer);if(observer)observer.disconnect();return;}tick();},1000);
root.tourPreview={getState:()=>({at,elapsed,playing,ended,noteOpen,moreOpen,checkpoint:steps[at].checkpoint,seconds:steps.reduce((s,v)=>s+v.seconds,0),sampleCount:samples.length}),advanceSeconds:n=>{for(let i=0;i<n;i++)tick();},setLayout:value=>{design.layout=value;render();}};
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'layout',{label:'Guide placement',options:[{label:'Spotlight overlay',value:'spotlight'},{label:'Docked guide',value:'docked'}]});}
})();
</script>
</div>
</body></html>
