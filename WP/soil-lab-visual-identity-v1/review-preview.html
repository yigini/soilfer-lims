  <script>
    (()=>{
      const root=document.getElementById('soilfer-identity');
      const main=root.querySelector('#si-page-content');
      const design={treatment:'signature',appearance:'light'};
      const state={page:'dashboard',queue:'ready',worktab:'Worksheet',sampletab:'Work & results',selected:'S004',drafts:['6.42','6.18','6.75','',''],checked:new Set(),search:''};
      const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
      const badge=(label,tone='')=>`<span class="si-badge ${tone}">${tone==='si-good'?icon('circle-check'):''}${label}</span>`;
      const btn=(label,attr='',primary=false)=>`<button type="button" class="si-button ${primary?'si-primary':''}" ${attr}>${label}</button>`;
      const link=(label,attr='')=>`<button type="button" class="si-link" ${attr}>${label}${icon('arrow-up-right')}</button>`;
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const queues=[['returned','Returned',0,'determinations'],['continue','Continue',1,'run'],['ready','Ready work',60,'tasks'],['submit','To submit',3,'determinations'],['waiting','Waiting',5,'tasks']];
      const sampleIds=['S004','S005','S006','S007','S008'];
      function refreshIcons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}})}
      function applyDesign(){root.dataset.treatment=design.treatment;root.dataset.appearance=design.appearance;root.querySelector('[data-concept-label]').textContent=(design.treatment==='signature'?'SoilFER signature':'Quiet soil')+' · '+(design.appearance==='light'?'Light':'Graphite');const b=root.querySelector('[data-theme-toggle]');b.setAttribute('aria-label','Preview '+(design.appearance==='light'?'dark':'light')+' appearance');b.innerHTML=icon(design.appearance==='light'?'moon':'sun');const review=main.querySelector('[data-preview="Review Completion"]');if(review)review.disabled=state.checked.size===0;refreshIcons()}
      function toast(label){let t=main.querySelector('.si-toast');if(!t){t=document.createElement('div');t.className='si-toast';t.setAttribute('role','status');main.appendChild(t)}t.textContent=label}
      function scope(){return `<div class="si-scope"><div class="si-scope-left">${icon('building-2')}<strong>GTM-LAB1</strong><label><select aria-label="Project scope" data-preview-select><option>All projects</option><option>SOILFER-US</option></select></label></div><div class="si-scope-right"><span class="si-note">08 Sep 2026 · Guatemala time</span><span class="si-fresh">Updated just now</span><button class="si-iconbutton" type="button" aria-label="Refresh preview" data-preview="Refresh">${icon('refresh-cw')}</button></div></div>`}
      function dashboardRows(){
        if(state.queue==='returned')return `<tr><td colspan="4"><div class="si-empty"><strong>Queue is clear</strong>No returned work in this demonstration.</div></td></tr>`;
        const ready=[['pH in water','SOP revision 1','Ready to record',40,'determinations','flask-conical','','Open worksheet'],['Electrical conductivity','SOP revision 1','Ready to record',12,'determinations','droplets','si-water','Open worksheet'],['Sample preparation','Operational checklist','Ready to record',8,'checklists','layers','si-prep','Open checklist']];
        const rows=state.queue==='ready'?ready:state.queue==='continue'?[['pH in water','SOILFER-US · Current work','In progress',1,'run','flask-conical','','Continue']]:state.queue==='submit'?[['pH in water','S004 · S005 · S006','Draft saved',3,'determinations','flask-conical','','Review work']]:[['pH in water','Preparation not complete','Waiting for preparation',5,'tasks','flask-conical','','View tasks']];
        return rows.map(r=>`<tr data-filter-row="${esc(r[0].toLowerCase())}"><td><div class="si-item"><span class="si-mark ${r[6]}">${icon(r[5])}</span><div><strong>${r[0]}</strong><small>${r[1]}</small></div></div></td><td>${badge(r[2],state.queue==='ready'?'si-good':state.queue==='waiting'?'si-wait':'')}</td><td class="si-count"><strong>${r[3]}</strong><small>${r[4]}</small></td><td>${link(r[7],'data-page="workbench"')}</td></tr>`).join('')
      }
      function dashboard(){return `<div class="si-titlebar"><div><div class="si-kicker">Analytical bench</div><h1>Analytical workbench</h1><p>Method queues, batch runs, calibration verification, and instrument measurement entry.</p></div>${btn('Open analytical workbench '+icon('arrow-right'),'data-page="workbench"',true)}</div>${scope()}<section class="si-metrics" aria-label="Work summaries">${queues.map(q=>`<button type="button" class="si-metric" data-queue="${q[0]}" aria-pressed="${state.queue===q[0]}"><strong>${q[2]}</strong><span>${q[1]}</span><small>${q[3]}</small></button>`).join('')}</section><div class="si-dashboard-grid"><section class="si-panel"><div class="si-panel-head"><div><h2>Current Work Queue</h2><p>Work assigned to you, grouped by method</p></div><label class="si-search">${icon('search')}<input type="search" aria-label="Filter this queue" placeholder="Filter this queue…" data-queue-search></label></div><div class="si-pills" aria-label="Work queues">${queues.map(q=>`<button type="button" data-queue="${q[0]}" aria-pressed="${state.queue===q[0]}">${q[1]} · ${q[2]}</button>`).join('')}</div><div class="si-tablewrap"><table class="si-dashboard-table"><thead><tr><th>Work / Item</th><th>State</th><th class="si-count">Count</th><th>Action</th></tr></thead><tbody>${dashboardRows()}</tbody></table></div><div class="si-panel-foot"><span>GTM-LAB1 · Your assigned work</span><span>Page 1 of 1</span></div></section><aside class="si-rail"><section class="si-instructions"><h3>${icon('clipboard-list')}Bench Work Instructions</h3><ol><li>Check instrument qualification and calibration before runs.</li><li>Batch up to 40 samples with QC.</li><li>Complete drying and preparation before wet chemistry.</li></ol></section><section class="si-panel si-shortcuts"><h3>Shortcuts</h3><button type="button" data-page="workbench">${icon('flask-conical')}Bench measurement workbench</button><button type="button" data-preview="My Work">${icon('clipboard-check')}Assigned tasks (My Work)</button><button type="button" data-preview="Equipment">${icon('microscope')}Laboratory equipment</button><button type="button" data-preview="Inventory">${icon('package')}Chemicals & Reagents</button></section></aside></div>`}
      function inspector(){const i=sampleIds.indexOf(state.selected);return `<aside class="si-panel si-inspector"><div><div class="si-kicker">Selected sample</div><div class="si-sample-id">${state.selected}</div><p class="si-note">Field ID: GTM000${i+7}-3-1C-T</p><p class="si-note">SOILFER-US</p>${link('View sample','data-page="sample"')}</div><div class="si-section-rule"><h3>Execution readiness</h3>${badge(i===4?'Waiting for preparation':'Ready to record',i===4?'si-wait':'si-good')}<div class="si-trail" style="margin-top:17px"><div>${icon('circle-check')}Reception <small>Complete</small></div><div>${icon('circle-check')}Drying <small>Complete</small></div><div>${icon(i===4?'clock-3':'circle-check')}Preparation <small>${i===4?'Pending':'Complete'}</small></div></div></div><div class="si-section-rule"><h3>Assignment</h3><p class="si-note">Marco · GTM-LAB1</p><p class="si-note">pH in water</p></div></aside>`}
      function worksheetRows(){return sampleIds.map((id,i)=>`<tr data-sample-row="${id}" data-selected="${state.selected===id}"><td><input type="checkbox" data-check="${i}" aria-label="Select ${id}" ${state.checked.has(i)?'checked':''} ${i===4?'disabled':''}></td><td><button type="button" class="si-sample-id" data-inspect="${id}">${id}</button><small>GTM000${i+7}-3-1C-T</small></td><td><input class="si-value" inputmode="decimal" aria-label="pH result for ${id}" data-value="${i}" value="${esc(state.drafts[i])}" placeholder="—" ${i===4?'disabled':''}><small>${i===4?'Entry unavailable':'pH'}</small></td><td>${badge(i===4?'Prep pending':'Ready',i===4?'si-wait':'si-good')}<small data-draft-label="${i}">${i===4?'Blocked':state.drafts[i]?'Draft saved':'Awaiting input'}</small></td><td>${link('Inspect',`data-inspect="${id}"`)}</td></tr>`).join('')}
      function worksheet(){return `<div class="si-toolbar"><label>Work type: <select aria-label="Work type" data-preview-select><option>pH in water (5)</option><option>Soil texture</option><option>Mid-infrared spectroscopy</option><option>Sample preparation</option></select></label>${btn(icon('clipboard')+'Paste Values','data-preview="Paste Values"')}${btn(icon('layers')+'Batch & QC Runs','data-preview="Batch & QC Runs"')}<label class="si-search">${icon('search')}<input type="search" aria-label="Find sample ID" placeholder="Find sample ID…" data-sample-search></label></div><div class="si-method"><div><h2>${icon('flask-conical')}pH in water</h2><p>Chemical properties · Target unit: pH</p></div><div class="si-row"><span class="si-badge">Unit: pH</span><span class="si-badge">5 assigned samples</span></div></div><div class="si-worksheet"><section class="si-panel"><div class="si-tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="Select all available samples" data-select-all ${state.checked.size===4?'checked':''}></th><th>Sample</th><th>Determination</th><th>Readiness & State</th><th>Details</th></tr></thead><tbody>${worksheetRows()}</tbody></table></div><div class="si-panel-foot"><span><span data-selection-count>${state.checked.size}</span> selected · Enter advances to next row</span>${btn('Review Completion (<span data-review-count>'+state.checked.size+'</span>) '+icon('arrow-right'),'data-preview="Review Completion"',true)}</div></section><div data-inspector>${inspector()}</div></div>`}
      function workbench(){const tabs=[['My Work',15],['Worksheet',5],['Ready to Submit',3],['Sent & Completed',8],['Activity Receipts',8]];return `<div class="si-titlebar"><div><div class="si-kicker">SoilFER LIMS / Technician Workspace</div><h1>Technician Workbench</h1><p>Unified determination queue, method-aware worksheets, and reviewer handoff.</p></div><div class="si-receipt">${icon('circle-check')}Drafts saved</div></div><div class="si-tabs" aria-label="Workbench sections">${tabs.map(t=>`<button type="button" data-worktab="${t[0]}" aria-pressed="${state.worktab===t[0]}">${t[0]} <small>${t[1]}</small></button>`).join('')}</div>${state.worktab==='Worksheet'?worksheet():`<section class="si-panel"><div class="si-panel-head"><h2>${state.worktab}</h2></div><div class="si-empty"><strong>Worksheet appearance is shown in this concept.</strong>The other sections keep their existing behavior.${'<br>'+btn('View worksheet','data-worktab="Worksheet"')}</div></section>`}`}
      function sampleTable(){const rows=[['Operational gates (2)'],['Sample drying','Operational checklist','Accepted','si-good','3/3 checks confirmed'],['Sample preparation','Operational checklist','Accepted','si-good','4/4 checks confirmed'],['Chemical properties (4)'],['pH in water','Water suspension','Draft','','6.42 pH'],['Electrical conductivity','Conductivity measurement','Verified','si-good','0.38 dS/m'],['Organic carbon','Configured laboratory method','Verified','si-good','1.82 %'],['Total nitrogen','Configured laboratory method','Pending','','—'],['Physical properties (1)'],['Soil texture','Sand · Silt · Clay','Pending','','—'],['Spectrometry (1)'],['Mid-infrared spectroscopy','MIR DRIFTS','Submitted','si-info','Spectrum attached']];return `<section class="si-panel"><div class="si-panel-head"><div><h2>Ordered analyses (6)</h2><p>Showing all analyses (assigned highlighted)</p></div>${link('Open in Workbench','data-page="workbench"')}</div><div class="si-tablewrap"><table class="si-sample-table"><thead><tr><th>Analysis / Method</th><th>Assigned to</th><th>Status</th><th>Result</th><th>Action</th></tr></thead><tbody>${rows.map(r=>r.length===1?`<tr class="si-group"><td colspan="5">${r[0]}</td></tr>`:`<tr><td><strong>${r[0]}</strong><small>${r[1]}</small></td><td>Marco</td><td>${badge(r[2],r[3])}</td><td>${r[4]}</td><td>${link('View','data-preview="Analysis details"')}</td></tr>`).join('')}</tbody></table></div></section>`}
      function sample(){const tabs=['Work & results','Review','Sample & request','Reports','History'];return `<div class="si-record"><div class="si-record-top"><div class="si-record-identity"><div class="si-kicker">Laboratory sample</div><div class="si-row" style="margin-top:7px"><h1>${state.selected}</h1>${badge('GTM-LAB1')}${badge('Processing','si-info')}</div><p>Field ID: <strong class="si-mono">GTM000${sampleIds.indexOf(state.selected)+7}-3-1C-T</strong></p></div><div class="si-record-actions">${btn(icon('printer')+'Print label','data-preview="Print label"')}${btn(icon('git-branch')+'Workflow map','data-preview="Workflow map"')}${btn('Open in Workbench '+icon('arrow-right'),'data-page="workbench"')}<button type="button" class="si-button" aria-label="More sample actions" data-preview="More sample actions">${icon('ellipsis')}</button></div></div><div class="si-record-grid"><div><small>Project</small><strong>SOILFER-US</strong></div><div><small>Matrix</small><strong>Soil</strong></div><div><small>Received mass</small><strong>500 g</strong></div><div><small>Storage location</small><strong>GTM-LAB1 · Shelf A2</strong></div></div><div class="si-record-status">${badge('Processing','si-info')}<span><strong>6</strong> ordered analyses</span><span><strong>2</strong> verified results</span><span><strong>1</strong> submitted for review</span></div></div><div class="si-next"><div><h3>Recommended next action</h3><p>Manager · Inspect submitted evidence and QC before accepting.</p></div>${btn('Review submission '+icon('arrow-right'),'data-sampletab="Review"',true)}</div><div class="si-tabs" aria-label="Sample sections">${tabs.map(t=>`<button type="button" data-sampletab="${t}" aria-pressed="${state.sampletab===t}">${t}${t==='Work & results'?'<small>6</small>':''}</button>`).join('')}</div>${state.sampletab==='Work & results'?sampleTable():`<section class="si-panel"><div class="si-panel-head"><h2>${state.sampletab}</h2></div><div class="si-empty"><strong>This concept shows the Work & results view.</strong>Existing ${state.sampletab.toLowerCase()} controls are outside this visual study.<br>${btn('Back to Work & results','data-sampletab="Work & results"')}</div></section>`}`}
      function render(){main.innerHTML=state.page==='dashboard'?dashboard():state.page==='workbench'?workbench():sample();root.querySelector('[data-breadcrumb]').textContent=state.page==='sample'?'Samples / '+state.selected:state.page==='workbench'?'Workbench':'Dashboard';root.querySelectorAll('.si-nav [data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const review=main.querySelector('[data-preview="Review Completion"]');if(review)review.disabled=state.checked.size===0;refreshIcons()}
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b||!root.contains(b))return;
        if(b.hasAttribute('data-theme-toggle')){design.appearance=design.appearance==='light'?'dark':'light';applyDesign();return}
        if(b.dataset.page){state.page=b.dataset.page;state.search='';if(state.page==='workbench')state.worktab='Worksheet';render();return}
        if(b.dataset.queue){state.queue=b.dataset.queue;render();return}
        if(b.dataset.worktab){state.worktab=b.dataset.worktab;render();return}
        if(b.dataset.sampletab){state.sampletab=b.dataset.sampletab;render();return}
        if(b.dataset.inspect){state.selected=b.dataset.inspect;main.querySelectorAll('[data-sample-row]').forEach(r=>r.dataset.selected=r.dataset.sampleRow===state.selected);main.querySelector('[data-inspector]').innerHTML=inspector();refreshIcons();return}
        if(b.dataset.preview)toast(b.dataset.preview+' — visual preview only. No platform action was performed.');
      });
      root.addEventListener('input',e=>{
        const el=e.target;
        if(el.hasAttribute('data-value')){const i=Number(el.dataset.value);state.drafts[i]=el.value;main.querySelector('[data-draft-label="'+i+'"]').textContent=el.value?'Draft saved':'Awaiting input';return}
        if(el.hasAttribute('data-queue-search')){main.querySelectorAll('[data-filter-row]').forEach(r=>r.hidden=!r.dataset.filterRow.includes(el.value.toLowerCase()));return}
        if(el.hasAttribute('data-sample-search'))main.querySelectorAll('[data-sample-row]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(el.value.toLowerCase()));
      });
      root.addEventListener('change',e=>{
        const el=e.target;
        if(el.hasAttribute('data-check')){const i=Number(el.dataset.check);el.checked?state.checked.add(i):state.checked.delete(i)}
        if(el.hasAttribute('data-select-all')){state.checked=el.checked?new Set([0,1,2,3]):new Set();main.querySelectorAll('[data-check]').forEach(c=>c.checked=state.checked.has(Number(c.dataset.check)))}
        main.querySelectorAll('[data-selection-count],[data-review-count]').forEach(s=>s.textContent=state.checked.size);
        const review=main.querySelector('[data-preview="Review Completion"]');if(review)review.disabled=state.checked.size===0;
        const all=main.querySelector('[data-select-all]');if(all){all.checked=state.checked.size===4;all.indeterminate=state.checked.size>0&&state.checked.size<4}if(el.hasAttribute('data-preview-select')){el.selectedIndex=0;toast('The mockup uses one example. Your existing selection options and behavior would stay unchanged.')}
      });
      root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.hasAttribute('data-value')){const next=main.querySelector('[data-value="'+(Number(e.target.dataset.value)+1)+'"]');if(next&&!next.disabled){e.preventDefault();next.focus();next.select()}}});
      render();applyDesign();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'treatment',{label:'Visual direction',options:[{label:'SoilFER signature · richer colour',value:'signature'},{label:'Quiet soil · subtle refresh',value:'quiet'}]});tweak.addSelect(design,'appearance',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Graphite',value:'dark'}]})}
    })();
  </script>
</div>
