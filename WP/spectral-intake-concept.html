<div id="spectral-intake-concept" aria-label="Interactive spectral intake concept">
<style>
#spectral-intake-concept{--si-bg:light-dark(#f5f7f8,#101923);--si-panel:light-dark(#fff,#192530);--si-soft:light-dark(#edf3f5,#21313f);--si-text:light-dark(#19333d,#e8eef3);--si-muted:light-dark(#506976,#b5c4ce);--si-line:light-dark(#d5e1e6,#354957);--si-blue:light-dark(#2658ae,#a2c2ff);--si-bluebg:light-dark(#edf2ff,#233b59);--si-green:light-dark(#176e55,#82d9b8);--si-greenbg:light-dark(#e6f4ed,#193d34);--si-amber:light-dark(#855800,#f0cc7d);--si-amberbg:light-dark(#fff4d9,#433a24);--si-red:light-dark(#a0323a,#ffb4b8);--si-redbg:light-dark(#fff0f0,#442830);font:14px/1.5 Inter,"Segoe UI",sans-serif;color:var(--si-text);background:var(--si-bg);border:1px solid var(--si-line);border-radius:14px;overflow:hidden;color-scheme:light dark}
#spectral-intake-concept *{box-sizing:border-box}#spectral-intake-concept button,#spectral-intake-concept input,#spectral-intake-concept select{font:inherit;color:inherit}#spectral-intake-concept button{cursor:pointer}#spectral-intake-concept button:disabled{cursor:not-allowed;opacity:.55}#spectral-intake-concept h2,#spectral-intake-concept h3,#spectral-intake-concept p{margin:0}#spectral-intake-concept h2{font-size:24px;font-weight:500;letter-spacing:-.7px}#spectral-intake-concept h3{font-size:17px;font-weight:500}#spectral-intake-concept .si-shell{display:grid;grid-template-columns:48px minmax(0,1fr)}#spectral-intake-concept .si-rail{background:var(--si-panel);border-right:1px solid var(--si-line);display:flex;align-items:center;flex-direction:column;gap:26px;padding:16px 8px;color:var(--si-muted)}#spectral-intake-concept .si-logo{font-size:22px;color:var(--si-green)}#spectral-intake-concept .si-rail i{width:18px;height:18px}#spectral-intake-concept .si-ribbon{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 20px;background:var(--si-panel);border-bottom:1px solid var(--si-line);font-size:11px;color:var(--si-muted)}#spectral-intake-concept .si-header{padding:21px 20px 16px;background:var(--si-panel)}#spectral-intake-concept .si-sub{font-size:12px;color:var(--si-muted);margin-top:5px}#spectral-intake-concept .si-steps{display:flex;gap:18px;flex-wrap:wrap;padding:0 20px 17px;background:var(--si-panel);border-bottom:1px solid var(--si-line);font-size:12px;color:var(--si-muted)}#spectral-intake-concept .si-steps span{display:flex;align-items:center;gap:7px}#spectral-intake-concept .si-steps b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:500;border:1px solid var(--si-line)}#spectral-intake-concept .si-steps .current{color:var(--si-green)}#spectral-intake-concept .si-steps .current b{color:var(--si-green);background:var(--si-greenbg);border-color:var(--si-green)}#spectral-intake-concept .si-body{padding:18px 20px 20px}#spectral-intake-concept .si-button{padding:8px 11px;border:1px solid var(--si-line);border-radius:7px;background:var(--si-panel);font-size:12px;display:inline-flex;gap:7px;align-items:center;justify-content:center}#spectral-intake-concept .si-primary{background:var(--si-green);color:light-dark(#fff,#0b261d);border-color:var(--si-green)}#spectral-intake-concept .si-toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}#spectral-intake-concept .si-pill{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--si-soft);color:var(--si-muted);font-size:11px}#spectral-intake-concept .si-pill.good{background:var(--si-greenbg);color:var(--si-green)}#spectral-intake-concept .si-pill.warn{background:var(--si-amberbg);color:var(--si-amber)}#spectral-intake-concept .si-pill.bad{background:var(--si-redbg);color:var(--si-red)}#spectral-intake-concept .si-notice{padding:12px 14px;background:var(--si-bluebg);color:var(--si-blue);font-size:12px;border-radius:8px;margin-bottom:15px}#spectral-intake-concept .si-layout{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:17px;align-items:start}#spectral-intake-concept .si-panel{border:1px solid var(--si-line);border-radius:9px;background:var(--si-panel);padding:17px;min-width:0}#spectral-intake-concept .si-file{padding:24px;border:1px dashed var(--si-line);border-radius:10px;background:var(--si-panel);display:flex;gap:20px;align-items:center;flex-wrap:wrap}#spectral-intake-concept .si-file i{color:var(--si-blue);width:28px;height:28px}#spectral-intake-concept .si-context{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}#spectral-intake-concept .si-small{font-size:11px;color:var(--si-muted)}#spectral-intake-concept .si-label{font-size:11px;color:var(--si-muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}#spectral-intake-concept .si-table{width:100%;border-collapse:collapse;background:var(--si-panel);font-size:12px}#spectral-intake-concept .si-table th{padding:11px 9px;font-size:11px;text-align:left;font-weight:500;color:var(--si-muted);background:var(--si-soft)}#spectral-intake-concept .si-table td{padding:15px 9px;vertical-align:top;border-bottom:1px solid var(--si-line)}#spectral-intake-concept .si-table tr[data-selected=true]{background:var(--si-bluebg)}#spectral-intake-concept .si-field{max-width:100%;min-width:0;background:var(--si-panel);border:1px solid var(--si-line);border-radius:6px;padding:7px;font-size:12px}#spectral-intake-concept .si-inline-btn{background:transparent;border:0;color:var(--si-blue);padding:6px 0;font-size:12px;text-align:left}#spectral-intake-concept .si-check{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-top:12px}#spectral-intake-concept .si-check input{accent-color:var(--si-green);margin-top:4px}#spectral-intake-concept .si-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--si-panel);border:1px solid var(--si-line);border-top:0;border-radius:0 0 8px 8px;padding:14px}#spectral-intake-concept .si-divider{border-top:1px solid var(--si-line);margin-top:16px;padding-top:14px}#spectral-intake-concept .si-inspector p{font-size:12px;color:var(--si-muted);line-height:1.6;margin-top:9px}#spectral-intake-concept .si-plot{width:100%;height:157px;display:block;margin-top:14px}#spectral-intake-concept .si-row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;padding:15px 0;border-bottom:1px solid var(--si-line);font-size:13px}#spectral-intake-concept .si-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}#spectral-intake-concept [hidden]{display:none!important}#spectral-intake-concept .si-status{font-size:12px;color:var(--si-green);margin-top:13px;min-height:18px}
@media(max-width:850px){#spectral-intake-concept .si-layout{grid-template-columns:1fr}#spectral-intake-concept .si-inspector{display:grid;grid-template-columns:1fr 1fr;gap:18px}#spectral-intake-concept .si-divider{margin-top:0}}
@media(max-width:540px){#spectral-intake-concept .si-shell{grid-template-columns:1fr}#spectral-intake-concept .si-rail{display:none}#spectral-intake-concept .si-ribbon,#spectral-intake-concept .si-header,#spectral-intake-concept .si-body{padding:14px}#spectral-intake-concept .si-steps{padding:0 14px 14px;gap:11px}#spectral-intake-concept .si-context{grid-template-columns:1fr;gap:13px}#spectral-intake-concept .si-file{padding:18px}#spectral-intake-concept .si-table,#spectral-intake-concept .si-table tbody{display:block}#spectral-intake-concept .si-table thead{display:none}#spectral-intake-concept .si-table tr{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid var(--si-line)}#spectral-intake-concept .si-table td{display:block;border:0;padding:5px;max-width:100%}#spectral-intake-concept .si-table td:first-child{width:100%}#spectral-intake-concept .si-inspector{display:block}#spectral-intake-concept .si-divider{margin-top:15px}#spectral-intake-concept .si-field{font-size:16px}#spectral-intake-concept .si-panel{padding:14px}}
@media(pointer:coarse){#spectral-intake-concept button,#spectral-intake-concept select{min-height:44px}}
</style>
<div class="si-shell"><aside class="si-rail" aria-label="Application navigation sketch"><span class="si-logo">S</span><i data-lucide="flask-conical" aria-hidden="true"></i><i data-lucide="activity" aria-hidden="true"></i><i data-lucide="files" aria-hidden="true"></i></aside><main><div class="si-ribbon"><span>SoilFER LIMS / My workbench / Spectra</span><span>Interactive concept · example run · no real uploads</span></div><div class="si-header"><h2>Import spectra with confidence</h2><p class="si-sub">Keep file identity, sample identity and reviewer status visible at every step.</p></div><div class="si-steps" data-steps></div><div class="si-body"><div data-screen></div><div class="si-status" role="status" data-status></div><p class="si-small" style="margin-top:12px">Illustrative data and signal curves. This demonstration does not read files or contact LIMS.</p></div></main></div>
<script>
(()=>{
const root=document.getElementById('spectral-intake-concept'),screen=root.querySelector('[data-screen]');
const state={step:1,selected:0,confirmed:false,warningAck:false,showSignal:true};
const scans=[{source:'D-401',file:'demo_401.dx',match:'D-401',qc:'PASS',rep:1,action:'new',verified:true,imported:false},{source:'D-402',file:'demo_402.dx',match:'D-402',qc:'WARN',rep:1,action:'unresolved',duplicate:true,verified:true,imported:false},{source:'D-4O3',file:'demo_4O3.dx',match:'',qc:'PASS',rep:1,action:'new',verified:false,imported:false}];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){if(s.imported)return {tone:'good',text:'Already imported',reason:'Receipt retained; not imported again',ok:false};if(s.action==='skip')return {tone:'',text:'Excluded by choice',reason:'Existing replicate retained',ok:false};if(!s.match||!s.verified)return {tone:'bad',text:'Identity unresolved',reason:'Exact ID or verified correction required',ok:false};if(s.action==='unresolved')return {tone:'warn',text:'Duplicate needs decision',reason:'Replicate 1 already exists',ok:false};return {tone:s.qc==='WARN'?'warn':'good',text:s.qc==='WARN'?'Ready with QC warning':'Ready to import',reason:s.action==='rep2'?'New replicate 2; R1 preserved':'Exact sample match',ok:true};}
function pill(t,tone){return '<span class="si-pill '+tone+'">'+esc(t)+'</span>';}
function candidates(){return scans.filter(s=>status(s).ok);}
function say(t){root.querySelector('[data-status]').textContent=t;}
function fileView(){return '<div class="si-file"><i data-lucide="file-up" aria-hidden="true"></i><div><h3>Example MIR instrument run</h3><p class="si-sub">3 example scans · 3 source IDs · no file selection required</p></div><button type="button" class="si-button si-primary" data-load>Load example run →</button></div><div class="si-context"><div><div class="si-label">Assignment</div><p>MIR DRIFTS</p><p class="si-small">DEMO-MIR-01 · revision 2</p></div><div><div class="si-label">Instrument</div><p>IR-04</p><p class="si-small">✓ Ready in this scenario</p></div><div><div class="si-label">Axis & identity</div><p>Wavenumber · cm⁻¹</p><p class="si-small">Match to assigned sample IDs</p></div></div><div class="si-notice">Previewing a run does not record a spectrum, complete a task or approve a result.</div>';}
function mappingView(){return '<div class="si-toolbar"><h3>Match & inspect</h3><span class="si-small">'+candidates().length+' eligible · '+scans.filter(s=>!status(s).ok).length+' excluded or unresolved</span></div><div class="si-notice">No silent remapping. An existing replicate is preserved unless an explicit permitted action is selected.</div><div class="si-layout"><div><table class="si-table"><thead><tr><th>Source file / ID</th><th>Assigned sample</th><th>Identity & QC</th></tr></thead><tbody>'+scans.map((s,i)=>'<tr data-selected="'+(state.selected===i)+'"><td><strong>'+esc(s.file)+'</strong><p class="si-small">Source: '+esc(s.source)+'</p><button type="button" class="si-inline-btn" data-inspect="'+i+'">Inspect scan →</button></td><td>'+(i===2&&!s.imported?'<select class="si-field" aria-label="Resolve sample identity" data-match><option value="">Unresolved</option><option value="D-403" '+(s.match==='D-403'?'selected':'')+'>D-403 · assigned sample</option></select>'+(s.match?'<label class="si-check"><input type="checkbox" data-verify '+(s.verified?'checked':'')+'>Label verified as D-403</label>':''):'<span>'+esc(s.match||'Unresolved')+'</span>')+'<p class="si-small">MIR · R'+(s.action==='rep2'?2:1)+'</p>'+(s.duplicate&&!s.imported?'<select class="si-field" aria-label="Duplicate replicate decision" data-duplicate style="margin-top:8px"><option value="unresolved" '+(s.action==='unresolved'?'selected':'')+'>Resolve duplicate…</option><option value="skip" '+(s.action==='skip'?'selected':'')+'>Keep existing; skip file</option><option value="rep2" '+(s.action==='rep2'?'selected':'')+'>Add permitted replicate 2</option></select>':'')+'</td><td>'+pill(status(s).text,status(s).tone)+'<p class="si-small" style="margin-top:7px">'+esc(status(s).reason)+'</p><p style="margin-top:8px">'+pill('QC '+s.qc,s.qc==='PASS'?'good':'warn')+'</p></td></tr>').join('')+'</tbody></table><div class="si-foot"><span class="si-small">Existing records remain unchanged</span><button type="button" class="si-button si-primary" data-review>Review import →</button></div></div><aside class="si-panel si-inspector" aria-label="Selected spectrum details" data-inspector></aside></div>';}
function inspector(){const s=scans[state.selected],el=screen.querySelector('[data-inspector]');if(!el)return;el.innerHTML='<div><div class="si-label">Selected spectrum</div><h3>'+esc(s.source)+'</h3><p>'+esc(s.file)+'<br>MIR · signal in arbitrary units</p><svg class="si-plot" role="img" aria-label="Illustrative MIR signal curve" data-plot></svg><p class="si-small">Illustrative curve only</p></div><div class="si-divider"><div class="si-label">Identity trail</div><p>File ID: '+esc(s.source)+'<br>Sample: '+esc(s.match||'Unresolved')+'<br>Replicate: '+(s.action==='rep2'?2:1)+'</p><div class="si-divider"><div class="si-label">Quality result</div>'+pill('QC '+s.qc,s.qc==='PASS'?'good':'warn')+'<p>'+(s.qc==='WARN'?'A signal warning remains attached. Importing does not grant reviewer acceptance.':'Scan checks pass in this example. Reviewer acceptance is still separate.')+'</p></div></div>';drawPlot();}
function drawPlot(){const svg=screen.querySelector('[data-plot]');if(!svg)return;const w=Math.max(svg.clientWidth,210),h=157,l=29,r=w-10,t=15,b=117;svg.setAttribute('viewBox','0 0 '+w+' '+h);const vals=[[.22,.3,.27,.46,.81,.52,.25,.44,.61,.41,.28,.31],[.28,.45,.4,.62,.94,.57,.34,.43,.7,.55,.43,.49],[.16,.22,.27,.38,.72,.44,.2,.32,.54,.38,.21,.26]][state.selected];const points=vals.map((y,i)=>(l+i*(r-l)/(vals.length-1))+','+(b-y*(b-t))).join(' ');svg.innerHTML='<title>Illustrative MIR scan</title><path d="M '+l+' '+t+' V '+b+' H '+r+'" fill="none" stroke="var(--si-line)"/><polyline points="'+points+'" fill="none" stroke="var(--si-blue)" stroke-width="2"/><g fill="var(--si-muted)" font-size="11"><text x="'+l+'" y="135">4000</text><text x="'+r+'" y="135" text-anchor="end">600</text><text x="'+((l+r)/2)+'" y="151" text-anchor="middle">Wavenumber (cm⁻¹)</text><text x="6" y="21">1</text><text x="6" y="119">0</text></g>';}
function reviewView(){const n=candidates().length,warn=candidates().some(s=>s.qc==='WARN');return '<div class="si-toolbar"><h3>Review exactly what will be imported</h3><button type="button" class="si-button" data-back>Back to matching</button></div><div class="si-notice">'+n+' eligible scans are included. '+(scans.length-n)+' scans are excluded or already imported. No result will be approved by this action.</div><div class="si-panel">'+scans.map(s=>'<div class="si-row"><div><strong>'+esc(s.file)+'</strong><p class="si-small">'+esc(s.source)+' → '+esc(s.match||'Unresolved')+' · MIR · R'+(s.action==='rep2'?2:1)+'</p></div>'+pill(status(s).ok?'Included':status(s).text,status(s).ok?'good':status(s).tone)+'</div>').join('')+'<label class="si-check"><input type="checkbox" data-confirm>I checked sample identity, method, instrument and replicate for the included scans.</label>'+(warn?'<label class="si-check"><input type="checkbox" data-warning>I reviewed the displayed QC warning. It will remain attached for the reviewer.</label>':'')+'<div class="si-actions"><button type="button" class="si-button si-primary" data-import disabled>Import '+n+' eligible scan'+(n===1?'':'s')+'</button></div></div>';}
function receiptView(){const imported=scans.filter(s=>s.imported),remaining=scans.filter(s=>!s.imported);return '<div class="si-notice">✓ '+imported.length+' scans imported in this demonstration · 0 approved · '+remaining.length+' not imported</div><div class="si-panel"><h3>Import receipt</h3><p class="si-sub">The original identity and replicate decisions are retained.</p>'+imported.map(s=>'<div class="si-row"><div><strong>'+esc(s.match)+' · MIR · R'+(s.action==='rep2'?2:1)+'</strong><p class="si-small">'+esc(s.file)+' · DEMO-SCAN-'+(scans.indexOf(s)+1)+'</p></div>'+pill(s.qc==='WARN'?'Imported · QC warning':'Imported · awaiting review',s.qc==='WARN'?'warn':'good')+'</div>').join('')+'<div class="si-divider"><p class="si-sub">Eligible upload may complete the corresponding spectral task. Sample submission and reviewer acceptance remain separate.</p></div><div class="si-actions"><button type="button" class="si-button" data-back>'+ (remaining.length?'Resolve remaining scans':'Inspect imported records')+'</button></div></div>';}
function render(){root.querySelector('[data-steps]').innerHTML=['Identify run','Match & inspect','Confirm import','Receipt'].map((t,i)=>'<span class="'+(state.step===i+1?'current':'')+'"><b>'+(i+1)+'</b>'+t+'</span>').join('');screen.innerHTML=state.step===1?fileView():state.step===2?mappingView():state.step===3?reviewView():receiptView();wire();if(state.step===2)inspector();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function wire(){const load=screen.querySelector('[data-load]');if(load)load.onclick=()=>{state.step=2;render();};screen.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.inspect);screen.querySelectorAll('tr[data-selected]').forEach((r,i)=>r.dataset.selected=String(i===state.selected));inspector();});const match=screen.querySelector('[data-match]');if(match)match.onchange=()=>{scans[2].match=match.value;scans[2].verified=false;state.selected=2;render();};const verify=screen.querySelector('[data-verify]');if(verify)verify.onchange=()=>{scans[2].verified=verify.checked;render();};const dup=screen.querySelector('[data-duplicate]');if(dup)dup.onchange=()=>{scans[1].action=dup.value;state.selected=1;render();};const review=screen.querySelector('[data-review]');if(review)review.onclick=()=>{state.step=3;state.confirmed=false;state.warningAck=false;render();};const back=screen.querySelector('[data-back]');if(back)back.onclick=()=>{state.step=2;render();};const confirm=screen.querySelector('[data-confirm]'),warning=screen.querySelector('[data-warning]'),go=screen.querySelector('[data-import]');const enabled=()=>{if(go)go.disabled=!state.confirmed||(!!warning&&!state.warningAck)||!candidates().length;};if(confirm)confirm.onchange=()=>{state.confirmed=confirm.checked;enabled();};if(warning)warning.onchange=()=>{state.warningAck=warning.checked;enabled();};if(go)go.onclick=()=>{if(go.disabled)return;const valid=candidates();valid.forEach(s=>s.imported=true);state.step=4;render();say('Demo receipt created. No files or records were sent to LIMS.');};}
render();new ResizeObserver(drawPlot).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{const plot=screen.querySelector('[data-plot]');if(plot)plot.style.display=state.showSignal?'block':'none';}});tweak.addToggle(state,'showSignal',{label:'Show illustrative scan curve'});}
})();
</script>
</div>
