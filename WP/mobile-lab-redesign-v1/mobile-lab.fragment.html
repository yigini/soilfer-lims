<div id="soilfer-mobile-study" aria-label="SoilFER mobile laboratory design preview">
<style>
#soilfer-mobile-study{--ml-bg:light-dark(#f5f5ef,#242827);--ml-surface:light-dark(#fff,#303635);--ml-ink:light-dark(#253b35,#eff3ec);--ml-muted:light-dark(#60716b,#b4c4ba);--ml-line:light-dark(#dbe3dc,#46514b);--ml-green:light-dark(#276b52,#8fd6af);--ml-wash:light-dark(#e8f1e8,#33483c);--ml-clay:light-dark(#89502f,#edb18c);--ml-claywash:light-dark(#f5ece3,#473a30);--ml-alert:light-dark(#904319,#f1bf8e);--ml-alertbg:light-dark(#fff0df,#483725);--ml-red:light-dark(#ae3232,#ffa4a4);color:var(--ml-ink);font:400 15px/1.45 'Segoe UI',system-ui,sans-serif;max-width:780px;margin:0 auto;color-scheme:light dark}
#soilfer-mobile-study[data-theme="light"]{color-scheme:light}#soilfer-mobile-study[data-theme="graphite"]{color-scheme:dark}
#soilfer-mobile-study *{box-sizing:border-box}#soilfer-mobile-study button,#soilfer-mobile-study input,#soilfer-mobile-study select,#soilfer-mobile-study textarea{font:inherit;color:inherit}#soilfer-mobile-study button{cursor:pointer}#soilfer-mobile-study button:disabled{cursor:default;opacity:.55}#soilfer-mobile-study button:focus-visible,#soilfer-mobile-study input:focus-visible,#soilfer-mobile-study select:focus-visible,#soilfer-mobile-study textarea:focus-visible{outline:3px solid var(--ml-green);outline-offset:3px}
#soilfer-mobile-study .ml-caption{text-align:center;color:var(--ml-muted);font-size:12px;padding:8px}#soilfer-mobile-study .ml-device{max-width:410px;margin:auto;background:var(--ml-bg);border:1px solid var(--ml-line);border-radius:24px;overflow:hidden}#soilfer-mobile-study[data-format="tablet"] .ml-device{max-width:780px;border-radius:18px}
#soilfer-mobile-study .ml-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;background:var(--ml-surface)}#soilfer-mobile-study .ml-brand{display:flex;gap:8px;align-items:center;flex:1;min-width:0}#soilfer-mobile-study .ml-mark{width:32px;height:36px;border-radius:14px 14px 5px 5px;background:linear-gradient(to bottom,#387858 0 33%,#c39a49 33% 60%,#92563b 60% 80%,#5e4634 80%);flex-shrink:0}#soilfer-mobile-study .ml-brand strong{font-size:19px;font-weight:650;letter-spacing:-.6px}#soilfer-mobile-study small{display:block;color:var(--ml-muted);font-size:12px}#soilfer-mobile-study .ml-icon{width:44px;min-height:44px;border:1px solid var(--ml-line);border-radius:50%;background:var(--ml-wash);display:grid;place-items:center;font-weight:600}#soilfer-mobile-study svg{flex-shrink:0}
#soilfer-mobile-study .ml-sync{display:flex;gap:8px;align-items:center;width:100%;padding:10px 18px;min-height:44px;border:0;border-block:1px solid var(--ml-line);background:var(--ml-claywash);color:var(--ml-clay);text-align:left;font-size:12px}#soilfer-mobile-study .ml-sync span{flex:1}#soilfer-mobile-study .ml-body{padding:20px 18px 24px;min-height:500px}#soilfer-mobile-study h1{font-size:27px;letter-spacing:-.8px;line-height:1.2;font-weight:650;margin:4px 0 8px}#soilfer-mobile-study h2{font-size:18px;letter-spacing:-.2px;font-weight:600;margin:0 0 8px}#soilfer-mobile-study h3{font-size:15px;font-weight:600;margin:0 0 4px}#soilfer-mobile-study p{margin:6px 0 16px}#soilfer-mobile-study .ml-muted{color:var(--ml-muted)}#soilfer-mobile-study .ml-eyebrow{color:var(--ml-muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
#soilfer-mobile-study .ml-panel{background:var(--ml-surface);border:1px solid var(--ml-line);padding:16px;border-radius:16px;margin-top:14px}#soilfer-mobile-study .ml-run{border-top:4px solid var(--ml-green)}#soilfer-mobile-study .ml-topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}#soilfer-mobile-study .ml-tag{display:inline-flex;align-items:center;gap:5px;background:var(--ml-wash);color:var(--ml-green);border-radius:7px;font-size:12px;padding:4px 7px}#soilfer-mobile-study .ml-tag.ml-warn{background:var(--ml-alertbg);color:var(--ml-alert)}#soilfer-mobile-study .ml-row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid var(--ml-line);background:transparent;padding:14px 0;min-height:64px}#soilfer-mobile-study .ml-row>span{flex:1;min-width:0}#soilfer-mobile-study .ml-row strong{font-weight:600}#soilfer-mobile-study .ml-miniicon{width:38px;height:38px;border-radius:11px;background:var(--ml-claywash);color:var(--ml-clay);display:grid;place-items:center;flex-shrink:0}#soilfer-mobile-study .ml-primary,#soilfer-mobile-study .ml-secondary{min-height:48px;padding:11px 14px;border-radius:11px;border:1px solid var(--ml-line);background:var(--ml-surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;width:100%;text-align:center}#soilfer-mobile-study .ml-primary{background:var(--ml-green);color:light-dark(#fff,#163324);border-color:transparent}#soilfer-mobile-study .ml-actions{display:flex;gap:9px;margin-top:18px}#soilfer-mobile-study .ml-actions>*{flex:1;min-width:0}#soilfer-mobile-study .ml-link{border:0;background:transparent;padding:0;min-height:44px;color:var(--ml-green);font-weight:600;display:flex;align-items:center;gap:6px}#soilfer-mobile-study .ml-rule{height:5px;background:var(--ml-line);border-radius:5px;overflow:hidden;margin:16px 0 8px}#soilfer-mobile-study .ml-rule span{display:block;height:100%;background:var(--ml-green)}
#soilfer-mobile-study .ml-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--ml-surface);border-top:1px solid var(--ml-line);padding:8px 4px max(10px,env(safe-area-inset-bottom));gap:2px}#soilfer-mobile-study .ml-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:52px;padding:5px 1px;background:transparent;border:0;border-radius:10px;color:var(--ml-muted);font-size:11px}#soilfer-mobile-study .ml-nav button[aria-current="page"]{background:var(--ml-wash);color:var(--ml-green);font-weight:650}#soilfer-mobile-study .ml-nav svg{width:21px;height:21px}
#soilfer-mobile-study label.ml-field{display:block;margin-top:14px;font-size:13px;font-weight:600}#soilfer-mobile-study label.ml-field input,#soilfer-mobile-study label.ml-field select,#soilfer-mobile-study label.ml-field textarea{display:block;width:100%;font-size:16px;border:1px solid var(--ml-line);background:var(--ml-surface);border-radius:10px;min-height:48px;padding:11px 12px;margin-top:6px;font-weight:400}#soilfer-mobile-study label.ml-field textarea{min-height:86px;resize:vertical}#soilfer-mobile-study .ml-value input{font-size:28px!important;font-variant-numeric:tabular-nums}#soilfer-mobile-study .ml-check{display:flex;align-items:flex-start;gap:10px;min-height:52px;padding:12px 0;border-bottom:1px solid var(--ml-line)}#soilfer-mobile-study .ml-check input{width:23px;height:23px;accent-color:var(--ml-green);flex-shrink:0;margin:1px 0}#soilfer-mobile-study .ml-alert{background:var(--ml-alertbg);color:var(--ml-alert);border-radius:10px;padding:12px;margin:14px 0;font-size:13px}#soilfer-mobile-study .ml-error{color:var(--ml-red);font-size:13px;min-height:20px;margin-top:8px}#soilfer-mobile-study .ml-note{font-size:12px;color:var(--ml-muted);margin:10px 0 0}#soilfer-mobile-study .ml-sample{font-size:24px;font-weight:650;letter-spacing:-.5px}#soilfer-mobile-study .ml-steps{list-style:none;padding:0;margin:16px 0}#soilfer-mobile-study .ml-steps li{display:flex;gap:11px;align-items:flex-start;border-left:2px solid var(--ml-line);padding:0 0 20px 16px;margin-left:8px}#soilfer-mobile-study .ml-steps li:last-child{border-color:transparent;padding-bottom:0}#soilfer-mobile-study .ml-stepdot{height:12px;width:12px;margin-left:-23px;margin-top:5px;border-radius:50%;background:var(--ml-green);border:2px solid var(--ml-bg);flex-shrink:0}#soilfer-mobile-study .ml-stepdot.ml-future{background:var(--ml-line)}#soilfer-mobile-study .ml-steps span:last-child{flex:1}
#soilfer-mobile-study .ml-twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}#soilfer-mobile-study .ml-triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#soilfer-mobile-study .ml-definition{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--ml-line);font-size:13px}#soilfer-mobile-study .ml-definition strong{text-align:right;font-weight:600;overflow-wrap:anywhere}#soilfer-mobile-study .ml-tablet-list{display:none}#soilfer-mobile-study .ml-toast{padding:9px 18px;background:var(--ml-wash);color:var(--ml-green);font-size:12px}#soilfer-mobile-study .ml-toast:empty{display:none}#soilfer-mobile-study .ml-camera{border:2px dashed var(--ml-line);border-radius:16px;padding:28px 16px;text-align:center;background:var(--ml-surface);margin-top:16px}#soilfer-mobile-study .ml-camera svg{width:42px;height:42px;color:var(--ml-green)}#soilfer-mobile-study .ml-queueitem{padding:13px 0;border-bottom:1px solid var(--ml-line)}#soilfer-mobile-study .ml-queueitem .ml-tag{margin-top:6px}#soilfer-mobile-study .ml-empty{padding:24px 0;text-align:center;color:var(--ml-muted)}
@media(min-width:620px){#soilfer-mobile-study[data-format="tablet"] .ml-body{padding:24px;min-height:520px}#soilfer-mobile-study[data-format="tablet"] .ml-benchgrid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px}#soilfer-mobile-study[data-format="tablet"] .ml-tablet-list{display:block;border-right:1px solid var(--ml-line);padding-right:18px}#soilfer-mobile-study[data-format="tablet"] .ml-tablet-list .ml-row{min-height:58px}#soilfer-mobile-study[data-format="tablet"] .ml-homegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#soilfer-mobile-study[data-format="tablet"] .ml-nav{padding-inline:100px}}
@media(max-width:359px){#soilfer-mobile-study .ml-body{padding-inline:13px}#soilfer-mobile-study .ml-head{padding-inline:13px}#soilfer-mobile-study .ml-panel{padding:13px}#soilfer-mobile-study .ml-actions{flex-wrap:wrap}#soilfer-mobile-study .ml-triple{gap:6px}#soilfer-mobile-study .ml-triple input{padding-inline:8px!important}}
</style>
<div class="ml-caption">Mobile design preview · demonstration data</div>
<div class="ml-device"><header class="ml-head"><div class="ml-brand"><div class="ml-mark" aria-hidden="true"></div><div><strong>SoilFER <span class="ml-muted">LIMS</span></strong><small id="ml-role"></small></div></div><button class="ml-icon" data-go="more" aria-label="Account and more options" id="ml-avatar">M</button></header><button class="ml-sync" data-go="sync"><span id="ml-connect-icon" style="flex:0;display:flex"></span><span id="ml-sync-label"></span><i data-lucide="chevron-right" aria-hidden="true"></i></button><main class="ml-body" id="ml-content"></main><div class="ml-toast" id="ml-toast" role="status" aria-live="polite"></div><nav class="ml-nav" id="ml-nav" aria-label="Main navigation"></nav></div>
<script>
(()=>{
const root=document.getElementById('soilfer-mobile-study');
const opts={role:'technician',theme:'light',format:'phone',online:false};
const state={screen:'home',index:0,values:{},saved:{},checks:[false,false,false],prepSaved:false,texture:['','',''],textureSaved:false,intakeStep:0,intakeChecks:[false,false],intakeMethods:{ph:true,texture:true},receiptSaved:false,reviewNote:'',conflictNote:'',dryChecks:[false,false,false],drySaved:false,reviewed:false,spectrumFile:'',scan:'',message:'',error:'',queue:[{owner:'technician',key:'prep-demo',sample:'S046',label:'Preparation checklist',state:'queued'},{owner:'technician',key:'conflict-demo',sample:'S041',label:'Soil pH (water)',state:'conflict'}]};
const $=s=>root.querySelector(s);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const id=i=>'S'+String(i+1).padStart(3,'0');
const ownQueue=()=>state.queue.filter(x=>x.owner===opts.role);const pending=()=>ownQueue().filter(x=>x.state==='queued'||x.state==='conflict').length;
const tag=(s,w=false)=>`<span class="ml-tag${w?' ml-warn':''}">${safe(s)}</span>`;
const action=(label,act,primary=true,disabled=false)=>`<button type="button" class="${primary?'ml-primary':'ml-secondary'}" data-act="${act}" ${disabled?'disabled':''}>${label}</button>`;
const row=(title,sub,ico,target)=>`<button class="ml-row" data-go="${target}"><div class="ml-miniicon">${icon(ico)}</div><span><strong>${title}</strong><small>${sub}</small></span>${icon('chevron-right')}</button>`;
const back=(target,label)=>`<button class="ml-link" data-go="${target}">${icon('arrow-left')}${label}</button>`;
function upsert(key,sample,label){const q=state.queue.find(x=>x.key===key&&x.owner===opts.role);if(q){q.state='queued';}else state.queue.push({owner:opts.role,key,sample,label,state:'queued'});}
function home(){
if(opts.role==='reception')return `<div class="ml-eyebrow">Lucia · Reception</div><h1>Receive with confidence</h1><p class="ml-muted">GTM-LAB1 · Today's deliveries</p><section class="ml-panel ml-run"><div class="ml-topline">${tag('Downloaded consignment')}<span class="ml-eyebrow">SOILFER-US</span></div><h2>5 expected soil samples</h2><p class="ml-muted">Check the bags, confirm condition and keep field identity together.</p>${action('Start reception '+icon('arrow-right'),'intake-start')}</section>${row('Intake drafts',state.receiptSaved?'1 receipt saved on this device':'No unfinished intake on this device','clipboard-list','intake')}${row('Find a sample','Scan a bag or enter its label','scan-line','scan')}${row('Device work pack','GTM consignment · Available offline','download','packs')}`;
if(opts.role==='manager')return `<div class="ml-eyebrow">Elena · Lab manager</div><h1>Decisions for today</h1><p class="ml-muted">GTM-LAB1 · Your laboratory</p><section class="ml-panel ml-run"><div class="ml-topline">${tag(state.reviewed?'Decision recorded':'Submitted for review')}${tag('Online approval',true)}</div><h2>S042 · Soil pH (water)</h2><p class="ml-muted">Result, QC and preparation evidence in one review.</p>${action('Review evidence '+icon('arrow-right'),'manager-review')}</section>${row('Preparation verification','1 checklist needs a manager decision','clipboard-check','prep-review')}${row('Equipment attention','pH meter PH-03 · calibration due','wrench','equipment')}${row('Sync and device work',pending()+' items need synchronization or attention','refresh-cw','sync')}`;
const done=Object.keys(state.saved).length;
return `<div class="ml-eyebrow">Marco · Technician</div><h1>Your bench, ready.</h1><p class="ml-muted">GTM-LAB1 · Morning shift</p><div class="ml-homegrid"><section class="ml-panel ml-run"><div class="ml-topline">${tag('Ready to record')}<span class="ml-eyebrow">Run PH-08</span></div><h2>Soil pH (water)</h2><p class="ml-muted">40 samples · 1:2.5 suspension<br>Meter PH-02 · QC accepted</p><div class="ml-rule"><span style="width:${done/40*100}%"></span></div><small>${done} of 40 saved on this device</small><div class="ml-actions">${action((done?'Continue run':'Start run')+' '+icon('arrow-right'),'run')}</div></section><section>${row('Sample preparation','8 samples · method checklists','layers','prep')}${row('Soil texture','Sand, silt and clay together','flask-conical','texture')}${row('MIR spectroscopy','Attach the original spectrum','activity','spectra')}</section></div><div class="ml-panel"><div class="ml-topline">${icon('download')}<strong>Morning bench pack</strong>${tag('Available offline')}</div><small>Methods, assignments and SOPs downloaded at 08:12.</small><button class="ml-link" data-go="packs">View device readiness ${icon('arrow-right')}</button></div>`;
}
function work(){return `<div class="ml-eyebrow">Method runs</div><h1>My work</h1><p class="ml-muted">Open a run and keep your place.</p>${row('Soil pH (water)',Object.keys(state.saved).length+' of 40 saved · PH-08','flask-conical','run')}${row('Sample drying',state.drySaved?'S047 drying confirmed on device':'3 checks · method-specific evidence','wind','drying')}${row('Sample preparation',state.prepSaved?'S045 confirmed locally · awaiting sync':'8 samples · checklist confirmation','layers','prep')}${row('Soil texture','6 panels · three fractions per sample','flask-conical','texture')}${row('MIR spectroscopy','2 spectra · original file and metadata','activity','spectra')}${row('Held work','See dependencies before recording','clock-3','sample')}`;}
function run(){const s=id(state.index);let status=state.saved[s]?(state.queue.find(q=>q.key==='ph-'+s)?.state==='synced'?'Draft saved to server':'Draft saved on device'):'Not recorded';return `${back('work','My work')}<div class="ml-eyebrow">Run PH-08 · ${state.index+1} of 40</div><h1>Soil pH (water)</h1><div class="ml-benchgrid"><aside class="ml-tablet-list"><h3>Run order</h3>${Array.from({length:8},(_,i)=>`<button class="ml-row" data-index="${i}" ${i===state.index?'aria-current="true"':''}><span><strong>${id(i)}</strong><small>${state.saved[id(i)]?'Saved on device':'Not recorded'}</small></span>${i===state.index?icon('chevron-right'):''}</button>`).join('')}<small>Showing 8 of 40 in this preview.</small></aside><div><section class="ml-panel"><div class="ml-topline"><span class="ml-sample">${s}</span>${tag('Prerequisites met')}</div><small>Field GTM0007-3-1C-T · SOILFER-US</small><label class="ml-field ml-value">pH value · unitless<input id="ml-ph" inputmode="decimal" autocomplete="off" value="${safe(state.values[s]||'')}" placeholder="e.g. 6.42" aria-describedby="ml-ph-help ml-error"></label><small id="ml-ph-help">Water · 1:2.5 · PH-02</small><div class="ml-error" id="ml-error" role="alert">${safe(state.error)}</div><div class="ml-topline">${tag(status)}<button class="ml-link" data-go="run-sample">Sample details</button></div></section><div class="ml-actions">${action(icon('arrow-left')+' Previous','prev',false,state.index===0)}${action('Save & next '+icon('arrow-right'),'save-next')}</div><button class="ml-link" data-go="run-review">Review run ${icon('chevron-right')}</button><div class="ml-note">A device save preserves a draft. Submission remains a separate reviewed action.</div></div></div>`;}
function prep(){return `${back('work','My work')}<div class="ml-eyebrow">Operational checklist</div><h1>Sample preparation</h1><div class="ml-panel"><div class="ml-topline"><span class="ml-sample">S045</span>${tag('Drying verified')}</div><small>SoilFER-US · Preparation SOP, revision 3</small>${['Prepared using the assigned grinding and sieving method','Container and aliquot labels match this sample','Equipment cleaned and preparation observations recorded'].map((s,i)=>`<label class="ml-check"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''} ${state.prepSaved?'disabled':''}><span>${s}</span></label>`).join('')}<div class="ml-error" role="alert">${safe(state.error)}</div>${state.prepSaved?tag('Confirmed on device · awaiting sync'):''}<div class="ml-actions">${action(state.prepSaved?'Confirmation saved':'Confirm preparation','confirm-prep',true,state.prepSaved)}</div></div><div class="ml-alert">This method requires manager verification. Analytical entry stays blocked until that verification is received.</div>${row('View the dependency trail','Receipt → Drying → Preparation → Analysis','git-branch','sample')}`;}
function texture(){return `${back('work','My work')}<div class="ml-eyebrow">Grouped analysis · S043</div><h1>Soil texture</h1><p class="ml-muted">One result panel, one submission.</p><section class="ml-panel"><div class="ml-triple">${['Sand','Silt','Clay'].map((s,i)=>`<label class="ml-field">${s} (%)<input inputmode="decimal" data-texture="${i}" value="${safe(state.texture[i])}" placeholder="0.0"></label>`).join('')}</div><div class="ml-definition"><span>Total</span><strong id="ml-total">${textureTotal()}</strong></div><div class="ml-definition"><span>Texture class</span><strong>Calculated after validation</strong></div><div class="ml-error" id="ml-error" role="alert">${safe(state.error)}</div>${state.textureSaved?tag('Panel saved on device'):''}<div class="ml-actions">${action('Save panel','save-texture')}</div></section><p class="ml-note">The illustration requires 100.0%. Production uses the configured SOP tolerance and validated classification rules.</p>`;}
function textureTotal(){return state.texture.every(v=>v.trim()!==''&&Number.isFinite(Number(v)))?(state.texture.reduce((n,v)=>n+Number(v),0).toFixed(1)+'%'):'Enter all three fractions';}
function spectra(){return `${back('work','My work')}<div class="ml-eyebrow">MIR DRIFTS · S044</div><h1>Capture a spectrum</h1><p class="ml-muted">Keep the instrument export with the result.</p><div class="ml-panel"><div class="ml-definition"><span>Instrument</span><strong>MIR-01</strong></div><div class="ml-definition"><span>Import profile</span><strong>Validated lab export</strong></div><label class="ml-field">Original spectrum<input id="ml-file" type="file" accept=".csv,.txt,.jdx,.dx,.spc"></label><p class="ml-note">Preview only: the file name is displayed. This study does not copy or upload the file.</p><div id="ml-file-name" class="ml-note">${safe(state.spectrumFile||'No file selected')}</div><label class="ml-field">Replicate<select><option>Replicate 1</option><option>Replicate 2</option></select></label></div><div class="ml-alert">The installed application must copy and verify the original bytes before saying “Saved on device”. Required parser and QC checks remain visible.</div>${action('View attachment and sync rules','spectra-info',false)}`;}
function sample(){return `${back('samples','Samples')}<div class="ml-eyebrow">SOILFER-US · GTM-LAB1</div><h1>S045</h1><p class="ml-muted">Field GTM0007-3-1C-T · Soil</p>${tag('Preparation in progress',true)}<div class="ml-panel"><h2>Where this sample stands</h2><ol class="ml-steps"><li><span class="ml-stepdot"></span><span><strong>Physically received</strong><small>Identity and condition checked</small></span></li><li><span class="ml-stepdot"></span><span><strong>Drying verified</strong><small>Checklist and evidence accepted</small></span></li><li><span class="ml-stepdot"></span><span><strong>${state.prepSaved?'Preparation captured locally':'Preparation assigned'}</strong><small>${state.prepSaved?'Awaiting sync and manager verification':'Marco · Ready for checklist'}</small></span></li><li><span class="ml-stepdot ml-future"></span><span><strong>Analytical work</strong><small>Blocked by preparation verification</small></span></li><li><span class="ml-stepdot ml-future"></span><span><strong>Review and release</strong><small>Requires submitted and accepted results</small></span></li></ol></div><div class="ml-actions">${action('Open preparation in workbench','open-prep')}</div>${row('Sample information','Field origin, receipt and requested analyses','clipboard-list','sample-info')}${row('Audit trail','Server events and pending device work','history','audit')}`;}
function samples(){return `<h1>Samples</h1><p class="ml-muted">Downloaded to your device</p>${row('S045 · Preparation','Awaiting checklist or verification','layers','sample')}${row('S001 · Soil pH (water)','Run PH-08 · ready to record','flask-conical','run')}${row('S042 · Submitted','Ready for manager review','clipboard-check','review')}${row('Find by label','Scan or enter an identifier','scan-line','scan')}`;}
function scan(){return `${back('home','Home')}<h1>Find a sample</h1><div class="ml-camera">${icon('scan-line')}<p>Scan the sample label</p><small>Camera preview placeholder</small></div><label class="ml-field">Or enter the label<input id="ml-scan" autocomplete="off" value="${safe(state.scan)}" placeholder="S045"></label><div class="ml-error" role="alert">${safe(state.error)}</div><div class="ml-actions">${action('Open sample','scan-open')}</div><button class="ml-link" data-act="scan-demo">Use demonstration label S045</button>`;}
function intake(){if(state.receiptSaved)return `${back('home','Home')}<h1>Receipt captured</h1><div class="ml-panel"><h2>GTM0007-3-1C-T</h2>${tag('Saved on device')}<p>Condition and requested analyses are preserved for synchronization.</p><div class="ml-definition"><span>Temporary intake</span><strong>DEVICE-017</strong></div><small>Official accession will be linked once the server accepts this receipt.</small></div><div class="ml-actions">${action('View synchronization','sync-open')}</div>`;
const steps=['Identify','Condition','Analyses','Review'];return `${back('home','Home')}<div class="ml-eyebrow">Receive soil · ${state.intakeStep+1} of 4</div><h1>${steps[state.intakeStep]}</h1><div class="ml-rule"><span style="width:${(state.intakeStep+1)*25}%"></span></div>${state.intakeStep===0?`<section class="ml-panel"><div class="ml-topline">${tag('Downloaded project sample')}<span class="ml-eyebrow">SOILFER-US</span></div><h2>GTM0007-3-1C-T</h2><div class="ml-definition"><span>Field location</span><strong>Recorded in project data</strong></div><div class="ml-definition"><span>Expected package</span><strong>Soil · 1 bag</strong></div><p class="ml-note">Identity and location travel with the downloaded record.</p></section>`:state.intakeStep===1?`<section class="ml-panel">${['Bag label matches the project sample','Packaging and condition are acceptable'].map((s,i)=>`<label class="ml-check"><input type="checkbox" data-intake-check="${i}" ${state.intakeChecks[i]?'checked':''}><span>${s}</span></label>`).join('')}<button class="ml-link" data-act="photo-info">${icon('camera')}Attach condition evidence</button></section>`:state.intakeStep===2?`<section class="ml-panel"><label class="ml-check"><input type="checkbox" data-method="ph" ${state.intakeMethods.ph?'checked':''}><span>Soil pH (water)<small>Assigned method and preparation requirements</small></span></label><label class="ml-check"><input type="checkbox" data-method="texture" ${state.intakeMethods.texture?'checked':''}><span>Soil texture<small>One panel: sand, silt and clay</small></span></label></section>`:`<section class="ml-panel"><h2>GTM0007-3-1C-T</h2><div class="ml-definition"><span>Condition</span><strong>Checked</strong></div><div class="ml-definition"><span>Requested analyses</span><strong>${[state.intakeMethods.ph?'Soil pH (water)':'',state.intakeMethods.texture?'Soil texture':''].filter(Boolean).join(', ')}</strong></div><p class="ml-note">This receipt is provisional until synchronization. It cannot inflate the server's received-sample count.</p></section>`}<div class="ml-error" role="alert">${safe(state.error)}</div><div class="ml-actions">${state.intakeStep?action('Back','intake-prev',false):''}${action(state.intakeStep===3?'Save receipt on device':'Continue '+icon('arrow-right'),'intake-next')}</div>`;}
function review(){if(opts.role!=='manager')return `${back('samples','Samples')}<h1>S042 · Submitted result</h1><div class="ml-panel"><h2>Soil pH (water)</h2><div class="ml-sample">6.42</div>${tag('Submitted')}<p>Awaiting manager review. This sample view displays the result and its recorded evidence.</p></div>`;return `${back('home','Home')}<div class="ml-eyebrow">Manager review · S042</div><h1>Soil pH (water)</h1><div class="ml-panel"><div class="ml-topline"><span class="ml-sample">6.42</span>${tag(state.reviewed?'Review recorded':'Submitted')}</div><div class="ml-definition"><span>Analyst</span><strong>Marco · 09:16</strong></div><div class="ml-definition"><span>Preparation</span><strong>Verified</strong></div><div class="ml-definition"><span>Quality controls</span><strong>Accepted</strong></div><div class="ml-definition"><span>Instrument</span><strong>PH-02 · Current</strong></div><label class="ml-field">Review note<textarea id="ml-review-note" placeholder="Add an observation">${safe(state.reviewNote)}</textarea></label></div>${!opts.online?'<div class="ml-alert">You are offline. Save a review note now; reconnect to check the current version before deciding.</div>':'<div class="ml-alert">Connected preview: current result and authorization rechecked. Confirming records a simulated review only.</div>'}<div class="ml-actions">${action('Save note','review-note',false)}${action(state.reviewed?'Recorded':'Confirm review','approve-review',true,!opts.online||state.reviewed)}</div>`;}
function sync(){return `${back('home','Home')}<div class="ml-eyebrow">This device</div><h1>Sync & recovery</h1><p class="ml-muted">${pending()} item${pending()===1?'':'s'} ${pending()?'waiting or needing attention':'remaining'} · ${opts.online?'Connected':'Offline'}</p><div class="ml-panel">${ownQueue().map(q=>`<div class="ml-queueitem"><div class="ml-topline"><strong>${q.sample}</strong>${tag(q.state==='referred'?'Retained for review':q.state==='synced'?'Saved to server':q.state==='conflict'?'Needs attention':'Saved on device',q.state==='conflict')}</div><small>${q.label}</small>${q.state==='conflict'?'<button class="ml-link" data-go="conflict">Compare versions '+icon('arrow-right')+'</button>':''}</div>`).join('')}</div><div class="ml-actions">${action('Sync now '+icon('refresh-cw'),'sync-now',true,!opts.online||!ownQueue().some(q=>q.state==='queued'))}</div><p class="ml-note">${opts.online?'Independent items can synchronize while a conflict is reviewed.':'Reconnection starts a checked synchronization. Work saved on this device remains visibly pending.'}</p>${row('Downloaded work packs','Scope, storage and offline authorization','download','packs')}`;}
function conflict(){return `${back('sync','Sync & recovery')}<div class="ml-eyebrow">S041 · Soil pH (water)</div><h1>Two versions need review</h1><p class="ml-muted">Your entry is preserved. Nothing was overwritten.</p><div class="ml-twocol"><section class="ml-panel"><small>On this device</small><div class="ml-sample">6.50</div><small>Marco · 09:05</small></section><section class="ml-panel"><small>On the server</small><div class="ml-sample">6.80</div><small>Elena · 09:10</small></section></div><label class="ml-field">Reason for requesting review<textarea id="ml-conflict-note" placeholder="Explain which record needs checking">${safe(state.conflictNote)}</textarea></label><div class="ml-error" role="alert">${safe(state.error)}</div><div class="ml-actions">${action('Send for review','conflict-review')}</div><p class="ml-note">The current server result stays in place. Both values remain available to the authorized reviewer.</p>`;}
function equipment(){return `${back('home','Home')}<div class="ml-eyebrow">Equipment · GTM-LAB1</div><h1>Before you use it</h1><div class="ml-panel"><div class="ml-topline"><h2>PH-02 · pH meter</h2>${tag('Available')}</div><p class="ml-muted">Last downloaded check: current calibration.</p><div class="ml-definition"><span>Assigned run</span><strong>PH-08</strong></div>${action('Open assigned run','run',false)}</div><div class="ml-panel"><div class="ml-topline"><h2>PH-03 · pH meter</h2>${tag('Do not use',true)}</div><p>Calibration due. It cannot be selected for a new run.</p>${action('View service record','equipment-info',false)}</div><p class="ml-note">Availability is revalidated during synchronization. Offline permission cannot override an instrument hold.</p>`;}
function packs(){return `${back('home','Home')}<div class="ml-eyebrow">Offline readiness</div><h1>Morning bench pack</h1>${tag('Downloaded at 08:12')}<div class="ml-panel"><div class="ml-definition"><span>Lab scope</span><strong>GTM-LAB1</strong></div><div class="ml-definition"><span>Methods and SOPs</span><strong>Available on device</strong></div><div class="ml-definition"><span>Attachments</span><strong>Included where selected</strong></div><div class="ml-definition"><span>Offline authorization</span><strong>Until end of authorized shift</strong></div><div class="ml-definition"><span>Storage</span><strong>Readiness checked</strong></div></div><div class="ml-alert">Work captured offline is provisional. Required independent verification and final release need current server authority.</div>${action('View pending work','sync-open',false)}`;}
function more(){return `<h1>More</h1><p class="ml-muted">${opts.role==='technician'?'Marco · Technician':opts.role==='reception'?'Lucia · Reception':'Elena · Lab manager'}</p>${row('Equipment','Availability, calibration and service','wrench','equipment')}${row('Samples & workflow','Identity, results and dependencies','git-branch','samples')}${row('Sync & downloaded work',pending()+' waiting or needing attention','refresh-cw','sync')}${row('Reports and inventory','Mobile catalogue and read views','files','other')}${row('Language and appearance','Five languages · Light / Graphite','globe-2','preferences')}`;}
const pages={home,work,run,prep,drying:()=>`${back('work','My work')}<div class="ml-eyebrow">Operational checklist · S047</div><h1>Sample drying</h1><div class="ml-panel"><div class="ml-topline">${tag('Receipt accepted')}<span class="ml-eyebrow">Air-drying SOP</span></div>${['Sample identity and tray position checked','Drying followed the assigned method conditions','Drying endpoint checked and observations recorded'].map((v,i)=>`<label class="ml-check"><input type="checkbox" data-dry-check="${i}" ${state.dryChecks[i]?'checked':''} ${state.drySaved?'disabled':''}><span>${v}</span></label>`).join('')}<div class="ml-error" role="alert">${safe(state.error)}</div>${state.drySaved?tag('Confirmed on device'):''}<div class="ml-actions">${action(state.drySaved?'Confirmation saved':'Confirm drying','confirm-drying',true,state.drySaved)}</div></div><p class="ml-note">The production checklist is defined by the assigned SOP; this is demonstration wording.</p>`,'run-sample':()=>`${back('run','Return to run')}<div class="ml-eyebrow">SOILFER-US · GTM-LAB1</div><h1>${id(state.index)}</h1><div class="ml-panel"><h2>Soil pH (water)</h2>${tag('Prerequisites met')}<div class="ml-definition"><span>Receipt</span><strong>Accepted</strong></div><div class="ml-definition"><span>Drying and preparation</span><strong>Verified</strong></div><div class="ml-definition"><span>Draft</span><strong>${safe(state.saved[id(state.index)]||'Not recorded')}</strong></div></div>${action('Return to this work item','run')}`,texture,spectra,sample,samples,scan,intake,review,sync,conflict,equipment,packs,more,'run-review':()=>`${back('run','Return to run')}<h1>Review this run</h1><p class="ml-muted">${Object.keys(state.saved).length} of 40 drafts captured on this device.</p><div class="ml-panel">${Object.keys(state.saved).length?Object.keys(state.saved).map(s=>`<div class="ml-definition"><span>${s}</span><strong>${safe(state.saved[s])} pH</strong></div>`).join(''):'No results saved yet.'}</div><div class="ml-alert">Production will show per-item validation, QC and an explicit submission preview. This study demonstrates draft capture only.</div>${action('Open synchronization','sync-open',false)}`,'sample-info':()=>`${back('sample','Sample')}<h1>Sample information</h1><div class="ml-panel"><div class="ml-definition"><span>Field ID</span><strong>GTM0007-3-1C-T</strong></div><div class="ml-definition"><span>Project</span><strong>SOILFER-US</strong></div><div class="ml-definition"><span>Matrix</span><strong>Soil</strong></div><div class="ml-definition"><span>Requested work</span><strong>Soil pH (water), texture</strong></div></div>`,'audit':()=>`${back('sample','Sample')}<h1>Activity</h1><div class="ml-panel"><h3>Server record</h3><p>Physical receipt and drying verification recorded.</p><h3>Device work</h3><p>${state.prepSaved?'Preparation checklist captured. Awaiting sync.':'No new preparation confirmation.'}</p></div>`,'prep-review':()=>`${back('home','Home')}<h1>Verify preparation</h1><div class="ml-panel"><h2>S046 · Submitted checklist</h2><p>Assigned method, label match and equipment cleaning are confirmed.</p>${tag('Awaiting independent verification',true)}</div><div class="ml-alert">The real review uses the existing operational verification service with current server state.</div>`,'other':()=>`${back('more','More')}<h1>Reports & inventory</h1>${row('Downloaded reports','Issued snapshots retain release version','files','report-info')}${row('Inventory availability','Cached balance is labelled with sync time','package','inventory-info')}`,'preferences':()=>`${back('more','More')}<h1>Your preferences</h1><div class="ml-panel"><div class="ml-definition"><span>Interface language</span><strong>English</strong></div><div class="ml-definition"><span>Available languages</span><strong>All five configured locales</strong></div><div class="ml-definition"><span>Appearance</span><strong>Light by default</strong></div></div><p class="ml-note">The implementation preserves session overrides and your profile's permanent preference.</p>`,'report-info':()=>`${back('other','Reports & inventory')}<h1>Issued reports</h1><p class="ml-muted">Downloaded reports are read-only, labelled with their release version and last synchronization time. Fresh release and SIS delivery use current online authority.</p>`,'inventory-info':()=>`${back('other','Reports & inventory')}<h1>Stock at the bench</h1><p class="ml-muted">Offline consumption records are queued against the downloaded lot. Server reconciliation checks current balances without silently allowing negative stock.</p>`};
function render(){root.dataset.theme=opts.theme;root.dataset.format=opts.format;$('#ml-role').textContent='GTM-LAB1 · '+({technician:'Technician',reception:'Reception',manager:'Lab manager'}[opts.role]);$('#ml-avatar').textContent={technician:'M',reception:'L',manager:'E'}[opts.role];$('#ml-connect-icon').innerHTML=icon(opts.online?'cloud-check':'cloud-off');$('#ml-sync-label').textContent=(opts.online?'Connected':'Offline')+' · '+pending()+' waiting / attention';$('#ml-content').innerHTML=(pages[state.screen]||home)();$('#ml-toast').textContent=state.message;let active=state.screen;if(['run','run-sample','run-review','drying','prep','texture','spectra'].includes(active))active='work';if(['sample','sample-info','audit'].includes(active))active='samples';if(['sync','conflict','equipment','packs','preferences','other','report-info','inventory-info'].includes(active))active='more';let nav=[['home','house','Home'],[opts.role==='reception'?'intake':opts.role==='manager'?'review':'work','clipboard-list',opts.role==='reception'?'Receive':opts.role==='manager'?'Review':'Work'],['scan','scan-line','Scan'],['samples','test-tubes','Samples'],['more','menu','More']];$('#ml-nav').innerHTML=nav.map(([s,i,l])=>`<button data-go="${s}" ${s===active?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('');if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function go(s){state.screen=s;state.error='';state.message='';render();}
root.addEventListener('input',e=>{let t=e.target;if(state.error){state.error='';root.querySelectorAll('.ml-error').forEach(el=>el.textContent='');}if(t.id==='ml-ph')state.values[id(state.index)]=t.value;if(t.hasAttribute('data-texture')){state.texture[+t.dataset.texture]=t.value;state.textureSaved=false;$('#ml-total').textContent=textureTotal();}if(t.id==='ml-scan')state.scan=t.value;if(t.id==='ml-review-note')state.reviewNote=t.value;if(t.id==='ml-conflict-note')state.conflictNote=t.value;});
root.addEventListener('change',e=>{let t=e.target;if(state.error){state.error='';root.querySelectorAll('.ml-error').forEach(el=>el.textContent='');}if(t.hasAttribute('data-dry-check'))state.dryChecks[+t.dataset.dryCheck]=t.checked;if(t.hasAttribute('data-check'))state.checks[+t.dataset.check]=t.checked;if(t.hasAttribute('data-intake-check'))state.intakeChecks[+t.dataset.intakeCheck]=t.checked;if(t.hasAttribute('data-method'))state.intakeMethods[t.dataset.method]=t.checked;if(t.id==='ml-file'){state.spectrumFile=t.files[0]?.name||'';$('#ml-file-name').textContent=state.spectrumFile||'No file selected';}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.hasAttribute('data-index')){state.index=+b.dataset.index;go('run');return;}const a=b.dataset.act;state.error='';if(a==='run'){go('run');return;}if(a==='prev'){state.index=Math.max(0,state.index-1);}if(a==='save-next'){const s=id(state.index),raw=(state.values[s]||'').trim(),n=Number(raw.replace(',','.'));if(!raw||!Number.isFinite(n)||n<0||n>14){state.error='Enter a pH value from 0 to 14 for this demonstration method.';}else{state.saved[s]=raw;upsert('ph-'+s,s,'Soil pH (water) draft');state.message=s+' · Draft saved on device (simulated)';state.index=Math.min(39,state.index+1);}}
if(a==='confirm-drying'){if(!state.dryChecks.every(Boolean))state.error='Confirm each method check first.';else{state.drySaved=true;upsert('dry-S047','S047','Drying checklist');state.message='Drying confirmed on device (simulated).';}}if(a==='confirm-prep'){if(!state.checks.every(Boolean))state.error='Confirm all three checks before completing preparation.';else{state.prepSaved=true;upsert('prep-S045','S045','Preparation checklist');state.message='Checklist saved locally. Manager verification is still required.';}}
if(a==='save-texture'){let nums=state.texture.map(Number);if(state.texture.some(s=>s.trim()==='')||nums.some(n=>!Number.isFinite(n)||n<0||n>100)||Math.abs(nums.reduce((a,b)=>a+b,0)-100)>0.00001)state.error='Enter all three fractions; the total must be 100% in this preview.';else{state.textureSaved=true;upsert('texture-S043','S043','Soil texture panel');state.message='All three fractions saved together (simulated).';}}
if(a==='open-prep'){go('prep');return;}if(a==='manager-review'){go('review');return;}if(a==='intake-start'){go('intake');return;}if(a==='intake-prev')state.intakeStep=Math.max(0,state.intakeStep-1);if(a==='intake-next'){if(state.intakeStep===1&&!state.intakeChecks.every(Boolean))state.error='Confirm identity and condition before continuing.';else if(state.intakeStep===2&&!Object.values(state.intakeMethods).some(Boolean))state.error='Choose at least one requested analysis.';else if(state.intakeStep<3)state.intakeStep++;else{state.receiptSaved=true;upsert('receipt-demo','DEVICE-017','Physical receipt · pending accession');state.message='Receipt saved on device (simulated).';}}
if(a==='sync-open'){go('sync');return;}if(a==='sync-now'&&opts.online){let n=0;ownQueue().forEach(q=>{if(q.state==='queued'){q.state='synced';n++;}});state.message=n+' item(s) accepted by simulated server. Conflicts are preserved.';}
if(a==='conflict-review'){const reason=($('#ml-conflict-note')?.value||'').trim();if(!reason)state.error='Add a reason so the reviewer knows what to check.';else{state.queue.find(q=>q.key==='conflict-demo').state='referred';upsert('review-request-demo','S041','Conflict review request');state.message='Review request saved locally. Both versions are preserved.';state.screen='sync';}}
if(a==='review-note'){const v=($('#ml-review-note')?.value||'').trim();if(!v){state.message='Enter a review note first.';}else{upsert('review-note-S042','S042','Manager review note');state.message='Review note saved locally (simulated).';}}
if(a==='approve-review'&&opts.online){state.reviewed=true;state.message='Simulated review recorded. No real result was approved.';}
if(a==='scan-demo'){state.scan='S045';}if(a==='scan-open'){if(state.scan.trim().toUpperCase()==='S045'){go('sample');return;}else state.error='This demonstration contains label S045. No external link is opened.';}
if(a==='photo-info')state.message='Production opens the camera or file picker and saves evidence bytes locally.';if(a==='spectra-info')state.message='Original bytes, checksum, profile, metadata and QC travel with the queued capture.';if(a==='equipment-info')state.message='Calibration is due. A maintenance record and authorized release are required.';render();});
render();if(globalThis.Tweak){let lastRole=opts.role;const t=new Tweak({container:root,onChange:()=>{if(opts.role!==lastRole){state.screen='home';state.message='';state.error='';lastRole=opts.role;}render();}});t.addSelect(opts,'role',{label:'Role',options:[{label:'Technician',value:'technician'},{label:'Reception',value:'reception'},{label:'Lab manager',value:'manager'}]});t.addSelect(opts,'theme',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Graphite',value:'graphite'}]});t.addSelect(opts,'format',{label:'Layout',options:[{label:'Phone',value:'phone'},{label:'Tablet',value:'tablet'}]});t.addToggle(opts,'online',{label:'Connected (simulation)'});}
})();
</script>
</div>
