utcome":"Prepare page/context, time, version and relevant receipt for the correct support role.","failureToExplain":"A screenshot exposes credentials or unnecessary sample data.","locales":["en","es","es-419","fr","pt"],"requiredBlocks":["Quick answer","Before you start: identity, permissions and prerequisites","Exact ordered controls and expected outcomes","Fields and synthetic worked example","Check it worked: persisted state and evidence","Recognizable failure and recovery branches","Next actor and next task","Source, release, local SOP and translation metadata"],"evidenceSources":[{"file":"client/src/pages/QADashboard.jsx","existsAtBuild":true,"status":"CANDIDATE_TO_TRACE_BEFORE_WRITING"},{"file":"client/src/pages/AuditLogs.jsx","existsAtBuild":true,"status":"CANDIDATE_TO_TRACE_BEFORE_WRITING"},{"file":"client/src/components/sample/EvidenceInspectionModal.jsx","existsAtBuild":true,"status":"CANDIDATE_TO_TRACE_BEFORE_WRITING"},{"file":"docs/book/src/usage/qc-management.md","existsAtBuild":true,"status":"CANDIDATE_TO_TRACE_BEFORE_WRITING"}],"acceptance":["Demonstrate the normal path with representative role fixtures.","Demonstrate the listed failure without inventing a workaround.","Check exact controls, labels, state transitions and all five locale blocks.","Capture synthetic screenshots only after the relevant UI is stable."],"scopeNote":"Enabled workflow coverage is mandatory. If a capability is not implemented or not enabled for a lab, document the actual limitation and owner; do not invent the feature."}]},"examples":[{"id":"bench-batch","title":"Record and submit a batch of results","topic":"Results at the bench","role":"Laboratory technician","route":"/workbench","minutes":6,"summary":"Keep one method's sample results together, check every match, then complete the separate recording and reviewer handoff steps.","quick":"In Workbench, select the method and enter or paste the matching sample results. Use Review Completion to record eligible determinations. Then open Ready to Submit and submit the selected samples for review. Applying pasted values only creates drafts.","before":["Use your own account and confirm the laboratory shown in the application.","Have the instrument output or bench record, the sample identifiers and the required method metadata available.","Confirm that the tasks are assigned to you and their preparation and equipment requirements are satisfied. A different pH method or measurement basis belongs in a different method group.","For this example, use the connected workflow. Check the separate offline guide for actions actually supported by your downloaded work pack."],"sections":[{"title":"1. Select the work and prepare the data","steps":[{"action":"Open Workbench and choose the required analysis method in Worksheet. Compare the displayed parameter and method with your bench record.","expected":"The worksheet contains the assigned tasks for that method. The same sample may legitimately have other analyses elsewhere."},{"action":"For a spreadsheet paste, prepare two columns: Sample ID and Result Value. Copy the data rows, without column headings. Keep identifiers as text so leading zeros are not lost.","expected":"Each result remains attached to its own identifier. Do not rely on the worksheet and spreadsheet having the same row order."}]},{"title":"2. Preview and apply drafts","steps":[{"action":"Select Paste Values, paste the two columns and select Preview Matches & Exclusions.","expected":"A preview identifies matched rows and explains duplicates, unassigned samples, sealed tasks, invalid numbers and prerequisite failures."},{"action":"Compare the included identifiers and values with the source record. Resolve errors at their cause. If 38 of 40 rows match, do not describe the import as 40 completed results.","expected":"You can account for every source row as included or excluded. A sample with an unresolved prerequisite remains blocked."},{"action":"Select Apply 38 Matched Drafts, or the actual displayed count. Check the worksheet values and required instrument, units or basis metadata.","expected":"Values appear as drafts. Applying them has not yet recorded the determinations or sent them to the manager."}]},{"title":"3. Record the determinations","steps":[{"action":"Select the intended worksheet rows and choose Review Completion. Inspect Included Determinations and Excluded / Incomplete.","expected":"The application explains which individual determinations can be recorded. An excluded item stays outside the operation."},{"action":"Read the confirmation, select it only after checking the entries, and choose Record N Determinations.","expected":"The eligible results are recorded. This is still a separate event from reviewer submission; preserve the confirmation if the response is uncertain."}]},{"title":"4. Send the correct samples for review","steps":[{"action":"Open Ready to Submit. Inspect each selected sample's included analyses and whether the submission is FULL or PARTIAL.","expected":"A partial submission contains the completed determinations shown; it does not mean all requested analyses are finished."},{"action":"Add useful reviewer notes if needed, read the confirmation, and select Submit N Samples for Review.","expected":"The server confirms the submission. Submitted work is no longer ordinary editable draft work."},{"action":"Open Sent & Completed and verify the submitted work or receipt. If the manager cannot find it, provide that receipt and check the laboratory and queue filters before repeating anything.","expected":"The manager can inspect the submitted version in the review queue. Approval and report release are later decisions."}]}],"fields":[["Sample ID","Use an identifier recognized for an assigned task in this method group.","DEMO-001"],["Result Value","Use the observed value and the configured unit/basis. Blank and zero have different meanings.","6.45 — demonstration value only"],["Method context","Match the configured variant to the bench record; do not merge different extraction bases.","The lab's configured pH method"]],"example":"DEMO-001\t6.45\nDEMO-002\t7.12\nDEMO-003\t5.88","success":"Every source row has an explained outcome; recorded determinations and submitted samples are reconciled; the review submission has a server confirmation.","nextActor":"Laboratory manager or assigned reviewer inspects the submitted results. The technician resolves only work returned through the permitted correction workflow.","problems":[{"symptom":"No matching assigned task","why":"The identifier, method group, assignment or laboratory does not match the current queue.","action":"Compare the sample label and selected method. Ask the manager to correct the assignment if appropriate; do not create a duplicate result."},{"symptom":"Some rows were excluded","why":"Preview validation found specific row problems.","action":"Use each exclusion reason. Apply only the intended valid rows, and retain a list of unresolved rows for correction."},{"symptom":"Saved, but the manager sees nothing","why":"A draft or recorded result has not necessarily been submitted.","action":"Check Ready to Submit and the actual submission receipt. Do not re-enter the same measurements on the sample page."}],"sources":["client/src/components/workbench/WorksheetArea.jsx","client/src/components/workbench/PastePreviewModal.jsx","client/src/components/workbench/ReviewCompletionView.jsx","client/src/components/workbench/ReviewSubmissionView.jsx","client/src/components/workbench/WorkbenchShell.jsx"]},{"id":"prep-drying","title":"Confirm sample drying and find its receipt","topic":"Drying and preparation","role":"Laboratory technician","route":"/workbench","minutes":4,"summary":"Record evidence that the drying operation was completed for the right sample. Checking boxes and confirming the operation are separate actions.","quick":"Open the drying task in Workbench. Perform and check each item in the displayed checklist, then select Confirm Complete. Look for Checklist Verified, a receipt identifier, the confirming user and the recorded time.","before":["Match the physical label to the laboratory and field identifiers shown for the task.","Use the drying procedure assigned by the laboratory. This guide does not prescribe a temperature, duration or endpoint.","Use a working connection for this confirmation workflow. Do not assume that checking items on screen has queued an offline confirmation.","If Legacy Completion — Evidence Gap is displayed, use the evidence-gap procedure; a new tick cannot establish missing historical evidence."],"sections":[{"title":"1. Check the sample and perform the work","steps":[{"action":"In Workbench, open the assigned Sample drying task. Compare its sample identifier with the container and bench log.","expected":"You are documenting the physical material actually handled, under the correct task and laboratory."},{"action":"Read every displayed checklist item. Perform and verify the drying work under the applicable lab procedure; record its required evidence in the designated records.","expected":"The checklist reflects work that has happened. A tutorial, task assignment or sample receipt is not evidence that drying is complete."},{"action":"Select each checklist item only after checking it. Confirm that the row shows Operational checklist complete.","expected":"All required checks are marked. The final confirmation action becomes available; the checks alone are not yet the durable receipt."}]},{"title":"2. Confirm and verify once","steps":[{"action":"Select Confirm Complete on that row. For a permitted bulk action, compare every selected sample first and use the displayed Confirm … Complete count.","expected":"The operation is sent for confirmation. Do not select unperformed samples merely because they share a batch."},{"action":"Look for Checklist Verified and read the receipt identifier, recorded user and time. Keep the receipt reference if another page seems inconsistent.","expected":"The saved receipt replaces the editable checklist. The application has evidence for this operational confirmation."},{"action":"Return to the relevant work queue and inspect the next task's readiness.","expected":"A drying requirement can be satisfied while preparation, assignment or instrument requirements still block an analysis. Drying does not automatically complete those separate requirements."}]}],"fields":[["Checklist items","Confirm the actions actually performed under the assigned procedure.","All required items checked"],["Receipt","Evidence returned for the confirmation, not a number to invent.","Receipt reference displayed by LIMS"],["Next-task readiness","Read the remaining blocker and responsible role.","Preparation still required"]],"success":"Checklist Verified shows the saved receipt and the next task reflects the appropriate prerequisite state. You have not created a fictitious numerical drying result.","nextActor":"The technician assigned to preparation, or the role identified by the remaining blocker, continues the physical workflow.","problems":[{"symptom":"All checks are ticked but no receipt appears","why":"The checklist may not have been confirmed, or the request did not complete.","action":"Inspect the confirmation state and connection. Check for an existing receipt before retrying; do not repeat the physical work only to change the screen."},{"symptom":"Sample page still looks incomplete","why":"The page may show a different task, attempt or aggregate sample state, or a display defect.","action":"Compare task/attempt and receipt. Preserve the reference and report the contradiction if it persists. Do not use a second completion control as a workaround."},{"symptom":"The analysis is still blocked","why":"Another prerequisite remains unmet.","action":"Open the specific blocker explanation. Finish only the work assigned and permitted to you."}],"sources":["client/src/components/workbench/OperationalTaskEditor.jsx","client/src/components/workbench/WorksheetArea.jsx","client/src/components/workbench/WorkbenchShell.jsx","server/services/workbenchReadinessService.js"]},{"id":"prep-receipt","title":"Preparation looks incomplete after confirmation","topic":"Solve a problem","role":"Technician and laboratory manager","route":"/workbench","minutes":4,"summary":"Establish which action succeeded before trying again. Use the operation receipt to distinguish an unfinished confirmation from a contradictory display.","quick":"Find the preparation receipt first. If there is no verified receipt, check the confirmation and connection. If a receipt exists, compare the task and attempt shown on both pages and read the remaining blocker. Do not enter a numerical result or complete preparation again from a different page.","before":["Keep the current worksheet and any unsaved input available.","Note the synthetic example distinction: a preparation task, an analytical determination and the sample's overall status are different records.","Do not clear browser storage or create a replacement sample to resolve a display disagreement."],"sections":[{"title":"1. Establish what the application confirmed","steps":[{"action":"Open the preparation row in Workbench and look for Checklist Verified, a receipt identifier and a recorded time.","expected":"You can say whether a durable confirmation is visible, rather than relying on a ticked checkbox or remembered toast."},{"action":"If no receipt is shown, check whether all required checklist items were completed and whether Confirm Complete was selected successfully.","expected":"An unconfirmed checklist remains an entry task. A connection or authorization error is not success."},{"action":"If the request outcome was uncertain, restore the connection and inspect the existing operation receipt before retrying.","expected":"You avoid submitting the same confirmation repeatedly because a response was lost."}]},{"title":"2. Compare the records and resolve the blocker","steps":[{"action":"With a receipt present, compare the sample identifier and preparation task/attempt with the sample page entry.","expected":"A different attempt or aggregate sample state is recognized as different context, not automatically a failed save."},{"action":"Read the exact readiness explanation for the analysis you want to perform next.","expected":"It identifies the unresolved prerequisite or capability. Another required preparation or instrument condition can remain after one task is complete."},{"action":"If the same task and attempt still contradict the receipt, send the manager or application support the page names, time, task and receipt references through the configured channel.","expected":"The discrepancy can be reproduced and corrected without losing the original operational evidence."}]}],"fields":[["Observed state","What the page says now.","Checklist Verified"],["Receipt and task","References needed to identify the confirmed operation.","Use the displayed references"],["Remaining blocker","Exact explanation, with no invented interpretation.","Instrument not eligible"]],"success":"The next action is tied to a known missing confirmation, a different requirement or an identified application defect. No duplicate physical or data-entry work is introduced.","nextActor":"The assigned technician handles unfinished work. A manager handles assignment/evidence issues. Application support handles a reproducible contradiction between views.","problems":[{"symptom":"Manager says the task must be submitted, but the technician has no Submit action","why":"The task's operational and analytical workflows may have been mixed, or the UI is inconsistent.","action":"Preserve the preparation receipt and report the exact state mismatch. Do not tell either user to fabricate an analytical value or bypass the server rule."}],"sources":["client/src/components/workbench/OperationalTaskEditor.jsx","client/src/components/workbench/WorkbenchShell.jsx","client/src/components/sample/WorkItemsTable.jsx"]},{"id":"intake-project","title":"Receive a project sample","topic":"Receiving samples","role":"Intake officer","route":"/reception","minutes":5,"summary":"Connect the material that actually arrived to the right project record, record its condition and requested work, then verify the receipt.","quick":"In Reception, complete ID & Field, Condition, Analyses and Handover for the matched project sample. Saving a draft preserves entry; it does not establish physical receipt. Verify the receipt confirmation before handing material to the laboratory.","before":["Have the physical material, label, delivery information and required intake measurements available.","Confirm your laboratory and project scope. Use the existing project record when one already represents the sample.","The exact final receipt control and any manager intake review depend on the deployed workflow; the writer must bind and verify those controls before publication."],"sections":[{"title":"1. Match identity and field information","steps":[{"action":"Open Reception and select the project. In ID & Field, find or scan the identifier on the physical label.","expected":"A matching source record is displayed. A KoBo submission is field provenance, not proof that the material arrived."},{"action":"Compare project, field identifier and displayed laboratory identifier. Check the source location and sampling information.","expected":"The correct project record is linked. If source coordinates exist but the draft is blank, preserve the discrepancy instead of inventing coordinates."}]},{"title":"2. Record condition and requested work","steps":[{"action":"Open Condition. Enter the actual received mass in the stated unit, the observed condition and the required compliance answers.","expected":"Missing values, insufficient mass or nonconformance are visible as specific issues rather than silently accepted defaults."},{"action":"Document any required exception reason. In Analyses, review the parameter names and method choices against the request.","expected":"The ordered work matches the request. Grouped analyses such as texture are handled according to the configured panel, not invented as unrelated tasks."}]},{"title":"3. Finish and verify the receipt","steps":[{"action":"Open Handover and review identity, condition, ordered analyses and outstanding issues. Use Save draft if the entry is not ready.","expected":"A saved draft remains distinct from an accepted receipt; it should not move unreceived material into drying workload."},{"action":"When complete, perform the verified final receipt action and inspect its confirmation and resulting intake state.","expected":"The application identifies what was received and whether another intake-review action remains. Final control binding is a required publication check for this exemplar."},{"action":"Check the sample label and the destination or handover details before transferring the physical material.","expected":"The next worker can identify the material and locate the corresponding tasks without duplicating intake."}]}],"fields":[["Field identifier","Match the source project record and physical label.","DEMO-FIELD-001"],["Received mass","Actual measured mass, using the displayed grams field.","Use the intake measurement, not a default"],["Condition / exception","Observed condition and required reason.","Damaged container documented as an exception"]],"success":"A receipt is visible for the correct material, with condition and analysis scope accounted for. If still a draft, it is clearly identified as such.","nextActor":"The manager or receiving workflow assigns the next work according to the laboratory configuration.","problems":[{"symptom":"No location recorded after resuming","why":"The draft may have lost its source link or the source may truly lack location.","action":"Compare field provenance first. Preserve existing data and report a broken link rather than adding guessed coordinates."},{"symptom":"Duplicate identifier","why":"More than one candidate or an existing receipt needs reconciliation.","action":"Inspect the matching project and intake records; do not accept a second record merely to finish quickly."}],"sources":["client/src/pages/Reception.jsx","client/src/components/reception/FieldProvenanceCard.jsx","client/src/components/reception/ComplianceChecklist.jsx"]},{"id":"review-submission","title":"Review a technician's submitted results","topic":"Review and reporting","role":"Laboratory manager","route":"/manager-queue","minutes":5,"summary":"Review the submitted version and its evidence before making a decision. Assignment, recording, acceptance and final report release are separate steps.","quick":"Open Manager Queue → Review Submissions. Select the submission, inspect its results and evidence, then use the permitted review decision. Use Final Approvals only after the required review and completeness conditions are satisfied.","before":["Confirm your laboratory and reviewer authority. A role recommendation in Help does not grant access.","Work from a submission or review receipt, not an unsent technician draft.","Use the lab's approved method/QC criteria for scientific judgment. This guide does not establish acceptance limits."],"sections":[{"title":"1. Find the submitted version","steps":[{"action":"Open Manager Queue and select Review Submissions. Check the active laboratory, filters and submission identity.","expected":"The list contains work actually submitted for review. An empty list can be a filter/scope issue or genuinely no submitted work."},{"action":"Open Review for the relevant submission. Compare sample identifiers, included analyses and FULL/PARTIAL scope.","expected":"You understand exactly what is being reviewed. A partial submission does not complete unsubmitted analyses."}]},{"title":"2. Check evidence and record the decision","steps":[{"action":"Inspect values, units/basis, method revision, required metadata, preparation evidence and relevant QC. For spectra, distinguish the acquisition from any predicted property.","expected":"Each decision has evidence for the submitted version; a successful upload or a Done label is not substituted for scientific review."},{"action":"If correction is needed, use the permitted return/reanalysis action with a precise reason, affected task and expected correction.","expected":"The technician has an actionable request and the original evidence remains in history. Bind the actual review-action label during UI verification."},{"action":"If acceptable, perform the authorized review action and verify its confirmation and resulting state.","expected":"The application records the reviewer decision. It does not automatically establish that a final report was generated or delivered."}]},{"title":"3. Check what remains","steps":[{"action":"Inspect remaining sample requirements before moving to Final Approvals.","expected":"Unsubmitted analyses, unresolved QC, nonconformance or incomplete evidence remain visible; freshly received material cannot be treated as fully analyzed."},{"action":"Where final release is permitted, inspect the current report scope and version through the reporting workflow.","expected":"Accepted determinations, final sample approval, generated report and external delivery are individually traceable."}]}],"fields":[["Submission scope","Analyses included in this submitted version.","PARTIAL: pH only"],["Review reason","A specific correction request tied to the affected work.","Check unit/basis against the instrument output"],["Remaining requirements","Server-provided reasons final approval is not yet allowed.","Another analysis remains unsubmitted"]],"success":"The reviewed version has a recorded decision and clear next ownership. The manager has not approved work merely because material was received.","nextActor":"Technician for returned work; authorized final approver/reporting role for complete accepted work.","problems":[{"symptom":"The technician says results were saved, but Review Submissions is empty","why":"Saved and recorded results may still be waiting for submission.","action":"Ask for the submission receipt. If it exists, compare lab and queue filters; otherwise the technician completes the handoff in Workbench."},{"symptom":"Final approval is disabled","why":"The server reports incomplete or unauthorized conditions.","action":"Read the specific reasons and address them through the owning workflow; do not use another page to bypass the check."}],"sources":["client/src/pages/ManagerQueue.jsx","client/src/components/workbench/ReviewSubmissionView.jsx","client/src/components/sample/SubmissionPanel.jsx"]},{"id":"method-spectral-import","title":"Import MIR or NIR spectra for assigned work","topic":"Methods and spectra","role":"Laboratory technician","route":"/workbench","minutes":5,"summary":"Import an instrument's exported spectrum, match it to the assigned sample and inspect the file evidence. A single reflectance number is not a replacement for a spectrum.","quick":"Use the spectral import flow for the assigned method: Identify & Upload → Match & Inspect → Confirm Import → Receipt. Keep the original export. Resolve unmatched samples and file/QC issues before confirmation, then verify the imported spectrum's links and review state.","before":["Have the original instrument export, instrument identity and sample/scan identifiers available.","Use an export/profile actually supported and verified for your instrument and method. A file extension in a picker is not proof that every vendor variant is supported.","Use the lab's approved acquisition and spectral QC procedure. This article does not define scan settings or acceptance thresholds."],"sections":[{"title":"1. Identify and upload","steps":[{"action":"Open spectral import from the assigned Workbench method. In Identify & Upload, select the verified spectrometer and provide required run/acquisition details.","expected":"The import is associated with the correct instrument and method context. Missing or ineligible instruments need correction, not a free-text substitute."},{"action":"Select the original export files and continue to staging preview.","expected":"The system reports recognized files and parsing problems. A staged file has not yet completed the task or been accepted for reporting."}]},{"title":"2. Match and inspect","steps":[{"action":"In Match & Inspect, compare each detected sample/scan identifier with the label and assigned task.","expected":"Each included spectrum has an intentional sample/task match. Similar filenames and row order alone do not establish identity."},{"action":"Inspect the plot, axis type and unit, acquisition metadata, replicates and reported validation issues.","expected":"You can recognize an unexpected axis, missing range or wrong sample match and follow the applicable profile/QC requirements."},{"action":"Resolve or exclude failed and unmatched entries with the available workflow, preserving the original files and exclusion reasons.","expected":"The import count reflects only the intended included items; excluded files remain accounted for."}]},{"title":"3. Confirm and trace","steps":[{"action":"Review the final mapping in Confirm Import, make the required confirmation and complete the import.","expected":"The Receipt step shows which items were imported and which were not. Use the actual receipt before retrying an uncertain upload."},{"action":"Open the linked spectrum in Spectral Library and inspect its sample association and review/QC state.","expected":"The original spectrum can be traced. Imported, quality-accepted, predicted and report-approved are not interchangeable states."},{"action":"If a prediction is produced, inspect its model/version and applicability separately from reference measurements and the final result review.","expected":"A model output is not silently represented as a measured wet-chemistry result or an approved report."}]}],"fields":[["Spectrum file","Original supported instrument export, with acquisition provenance.","A synthetic fixture supplied for the configured import profile"],["Axis and signal","Read the declared units and representation from the profile/export.","Wavenumber and absorbance or reflectance, as actually recorded"],["Sample match","Sample and assigned task linked to the scan.","DEMO-001"]],"success":"The import receipt reconciles included and excluded files, and the sample/task/library links are correct. Any QC or reviewer step remains explicit.","nextActor":"The designated spectral reviewer or method/QC owner handles the next review; a model or report process runs only when configured and permitted.","problems":[{"symptom":"Unsupported file or parse failure","why":"The export may not match an implemented profile or may be incomplete.","action":"Keep the original file and record the import error/profile. Ask the instrument/application owner for the supported export path; do not fabricate a scalar result."},{"symptom":"Uploaded but the sample is not approved","why":"Import, quality review, prediction and final approval are separate stages.","action":"Read the current stage and its assigned owner. Do not treat library presence as report release."}],"sources":["client/src/components/workbench/SpectralIntakeModal.jsx","client/src/pages/SpectralLibrary.jsx"]},{"id":"offline-sync","title":"Synchronize and verify queued work","topic":"Mobile and offline","role":"Technician or intake officer","route":"/workbench","minutes":4,"summary":"Reconnect and reconcile each pending action. Work saved on the device is not necessarily visible to the laboratory server or manager.","quick":"Keep the same account and laboratory, restore the connection, and inspect the application's synchronization view. Reconcile succeeded, pending, failed and conflicting actions individually. Use server receipts to confirm completion; never clear storage to force synchronization.","before":["Keep the device and browser profile containing the pending work.","Only actions supported by the actual downloaded work pack can be completed offline. Help downloads do not make all laboratory actions offline-capable.","The writer must verify the current synchronization control labels and receipts on representative devices before publication. Do not invent a Sync now control where none exists."],"sections":[{"title":"1. Reconnect without losing the local record","steps":[{"action":"Restore a stable connection and confirm the signed-in account and laboratory.","expected":"The queued work is reconciled under the correct identity; another lab's cache is not used."},{"action":"Open the actual synchronization status or pending-work view supplied by the application.","expected":"You can distinguish queued actions from completed server operations and see the recorded failure reasons."}]},{"title":"2. Reconcile the outcome","steps":[{"action":"Inspect each completed action and its server confirmation. For a partial sync, compare the number and identities of completed and still-pending actions.","expected":"A global online indicator is not mistaken for successful submission of every result or attachment."},{"action":"For a retryable transport failure, use the application's retry/reconciliation action after checking whether the server already recorded it.","expected":"The original operation identity is preserved; an uncertain response does not produce a duplicate result."},{"action":"For a conflict, compare the local entry and current server state and follow the permitted resolution. If work was reassigned or approved, involve the responsible manager.","expected":"The application does not silently overwrite another person's work or an approved result."},{"action":"After successful synchronization, inspect the relevant Workbench or intake receipt and resulting task state.","expected":"A synchronized draft may still require recording or reviewer submission. Sync success and analytical approval remain separate."}]}],"fields":[["Pending action","Work retained on this device and not yet confirmed by the server.","Draft or supported queued operation"],["Conflict","A newer server state requires reconciliation.","Task reassigned while disconnected"],["Receipt","Server evidence for a particular operation.","Displayed operation reference"]],"success":"All pending actions are either confirmed by the server or have a visible, owned resolution. No local work is silently discarded.","nextActor":"Technician/intake officer for ordinary retry; manager for assignment or approved-state conflicts; support for unresolved device errors.","problems":[{"symptom":"The manager still sees no result","why":"The device may have synchronized only a draft, or the handoff is still pending.","action":"Identify the last confirmed state and complete the relevant recording/submission step if permitted."},{"symptom":"An attachment remains pending","why":"The data action and file transfer may have different outcomes.","action":"Keep the original file and inspect the attachment's own status rather than assuming the entire sample failed."}],"sources":["client/src/context/SyncContext.jsx","client/src/services/offline/offlineDb.js","client/src/components/workbench/WorkbenchShell.jsx"]},{"id":"admin-translation","title":"Correct a translation without changing scientific meaning","topic":"Management and configuration","role":"Authorized editor or administrator","route":"/admin?tab=languages","minutes":4,"summary":"Change the displayed wording in the correct language and context while preserving scientific identifiers, units and previously recorded results.","quick":"Open the language/translation area, choose the language and terminology group, and compare the term with its source and actual screen. Edit the display wording, complete the required review and verify the published wording in context. Do not change a method code or unit to fix a translation.","before":["Have the page, current phrase, intended meaning and affected method or article available.","Confirm whether the change belongs to interface text, scientific analysis terminology or a Help article block.","The exact save/review/publish labels must be bound to the current editor during UI verification; the prototype's editorial controls are design proposals."],"sections":[{"title":"1. Find the correct source and language","steps":[{"action":"Open Administration → Languages and select the intended language. For Help bodies, open the linked Help content editor and the article's locale.","expected":"The editor shows the correct source text and language status, not a similarly named term from another group."},{"action":"Check the term on the actual page, including the method variant and unit where relevant.","expected":"You distinguish a label correction from a scientific definition change. Spanish and Latin American Spanish may need different approved wording."}]},{"title":"2. Edit, review and verify","steps":[{"action":"Change the translated display text. Preserve placeholders, stable IDs, formulas and units.","expected":"The wording changes without altering stored values or calculation meaning."},{"action":"Preview the text in its actual interface or article block and complete the editor's authorized review/publication workflow.","expected":"Review provenance is truthful. Saving a draft does not automatically make it visible to all readers."},{"action":"Open the affected page in the target language and check text wrapping, complete instructions and consistent terminology.","expected":"The published wording is readable and coherent. A translated menu with English article steps is not a complete article translation."}]}],"fields":[["Term/concept ID","Stable reference used to identify the concept.","Never change merely to improve wording"],["Locale","The intended regional language version.","es and es-419 are reviewed distinctly"],["Source revision","The source on which the translation is based.","Current article or terminology revision"]],"success":"The intended wording appears in the correct context and language, with source/review history retained and scientific meaning unchanged.","nextActor":"The appropriate language or method reviewer for changes that require review; the publisher releases the verified version.","problems":[{"symptom":"My edit does not appear in Help","why":"The change may be a draft, belong to another group/locale, or be excluded from the current publication.","action":"Inspect the published article/locale revision and release membership. Do not repeatedly overwrite the source English text."},{"symptom":"A scientific term is ambiguous","why":"The method context may change its meaning.","action":"Provide the method and source phrase to the terminology owner and resolve the meaning before publication."}],"sources":["client/src/pages/AdminPanel.jsx","client/src/components/TranslationEditor.jsx","client/src/pages/help/AdminHelpEditor.jsx"]}],"roles":[{"id":"LAB_TECHNICIAN","label":"Laboratory technician","tasks":["bench-batch","prep-drying","method-spectral-import"],"note":"Navigation persona only. The implementation must use actual effective permissions and laboratory/project scope."},{"id":"SAMPLE_RECEPTION","label":"Intake officer","tasks":["intake-project","intake-draft","intake-location"],"note":"Navigation persona only. The implementation must use actual effective permissions and laboratory/project scope."},{"id":"LAB_MANAGER","label":"Laboratory manager","tasks":["review-submission","review-assign","review-final"],"note":"Navigation persona only. The implementation must use actual effective permissions and laboratory/project scope."},{"id":"PROJECT_MANAGER","label":"Project manager","tasks":["connect-project","connect-progress","connect-sis"],"note":"Navigation persona only. The implementation must use actual effective permissions and laboratory/project scope."},{"id":"SURVEYOR","label":"Field surveyor","tasks":["connect-surveyor","connect-kobo","connect-field-fix"],"no function briefView(){let g=brief(S.guide);return `<div class="breadcrumb"><button class="linkbutton" data-action="scene" data-id="library">Browse the guide</button><span>/</span>${E(g.topicTitle)}</div><div class="brief"><span class="pill sand">Writing brief · content still to be produced</span><h1 style="margin-top:20px">${E(g.title)}</h1><p>${E(g.outcome)}</p><div class="notice">This is a commissioned article scope, not a completed user guide. Antigravity must write the full procedure to the standard shown in the eight detailed examples.</div><h3>A real problem this guide must resolve</h3><p>${E(g.failureToExplain)}</p><h3>Required content</h3><ul>${g.requiredBlocks.map(s=>`<li>${E(s)}</li>`).join('')}</ul><h3>Verification before publication</h3><ul>${g.acceptance.map(s=>`<li>${E(s)}</li>`).join('')}</ul><p class="small">${E(g.scopeNote)}</p><h3>Evidence to trace</h3>${g.evidenceSources.map(s=>`<p class="small"><code>${E(s.file)}</code><br>${s.existsAtBuild?'Candidate file exists':'Resolve the actual implementation path'} · verify behavior, permissions and UI.</p>`).join('')}<div class="buttonrow">${gbutton('bench-batch','Read a complete example',true)}${button('Back to the inventory','scene','data-id="library"')}</div></div>`}
function searchText(g){return [g.title,g.outcome,g.failureToExplain,g.topicTitle,g.id,g.id.includes('spectral')?'MIR NIR spectroscopy spectrum spectra reflectance':'',g.id.includes('drying')?'dry DRYING checklist':'',g.id.includes('prep')?'PREP preparation incomplete':'',g.id.includes('batch')?'pH paste 40 samples':''].join(' ').toLowerCase()}
function library(){let query=S.search.trim().toLowerCase();let rows=DATA.content.articles.filter(g=>(S.topic==='all'||g.topic===S.topic)&&(!query||query.split(/\s+/).every(q=>searchText(g).includes(q))));return `<div class="eyebrow">The complete writing commission</div><h1>${query?'Search results':'Browse the lab guide'}</h1><p class="small">${DATA.content.count} task briefs · ${DATA.examples.length} fully written English design examples · 12 topics · all 10 roles</p><div class="librarytools"><label for="topic">Topic</label><select id="topic"><option value="all">All topics</option>${DATA.content.topics.map(t=>`<option value="${t.id}" ${S.topic===t.id?'selected':''}>${E(t.title)}</option>`).join('')}</select>${query?button('Clear search','clearsearch'):''}<span class="small">${rows.length} matches${query?' for “'+E(S.search)+'”':''}</span></div><div class="resultlist">${rows.map(g=>`<button class="result" data-action="guide" data-id="${g.id}"><div><span class="pill ${article(g.id)?'':'sand'}">${article(g.id)?'Read full example':'Review writing brief'}</span><h3>${E(g.title)}</h3><p>${E(g.outcome)}</p></div><span aria-hidden="true">↗</span></button>`).join('')||`<div class="solverbox"><h2>No exact match</h2><p>Try the sample task, parameter name or the words you see on the page. Your entries have not been changed.</p>${button('Solve a problem','scene','data-id="problem"')}${button('Browse all topics','clearsearch')}</div>`}</div>`}
const outcomes={
 draft:{title:'A draft has not reached the manager',steps:['Check that the values and required metadata are correct in Worksheet.','Select the intended rows, open Review Completion and record the eligible determinations.','Open Ready to Submit, check the analyses included and submit the selected samples for review.','Verify the server confirmation and Sent & Completed.'],owner:'Technician → laboratory reviewer after submission',guide:'bench-batch'},
 recorded:{title:'The reviewer handoff is still needed',steps:['Open Ready to Submit in Workbench.','Check the intended sample, included determinations and FULL or PARTIAL scope.','Confirm Submit N Samples for Review and verify the server receipt.'],owner:'Technician submits; the manager then reviews.',guide:'bench-batch'},
 submitted:{title:'Use the receipt to trace the submitted work',steps:['Check that the receipt belongs to the same sample, task version and laboratory.','Ask the manager to inspect Review Submissions with the relevant filters.','If a server-confirmed submission is still absent, preserve the receipt and report the discrepancy. Do not create another result or repeat completion on the sample page.'],owner:'Laboratory manager, then platform support if views disagree.',guide:'review-submission'},
 receipt:{title:'Keep the receipt; do not repeat completion',steps:['Compare the sample, task and attempt on the receipt with the current task.','Check whether the label means awaiting a later review rather than awaiting confirmation.','If the same confirmed attempt remains incomplete, preserve the receipt and report the contradictory state. Do not use the sample page to force it through.'],owner:'Laboratory manager or support checks the conflicting state.',guide:'prep-receipt'},
 noreceipt:{title:'First establish whether confirmation was accepted',steps:['Checking the physical checklist does not itself confirm completion.','Inspect the task and any pending local operation before trying again.','Use Confirm Complete only for an eligible unconfirmed task; verify its resulting receipt. If the outcome is uncertain, retain the task details and resolve that uncertainty before repeating it.'],owner:'Technician verifies; manager/support resolves uncertain state.',guide:'prep-drying'},
 offline:{title:'Keep this device and its pending work intact',steps:['Reconnect and use the same authorized account and laboratory.','Inspect each queued operation, its status and any server receipt. A connection indicator alone does not prove synchronization.','Resolve conflicts through the supported recovery flow. Do not clear storage, reinstall or switch account to make the queue disappear.','Check the resulting server state and receipts before counting work as submitted.'],owner:'Technician reconciles supported operations; unresolved conflicts go to the responsible manager/support.',guide:'offline-sync'},
 uncertain:{title:'Gather what the screen actually confirms',steps:['Record the sample identifier, task, visible state and any receipt or queue status.','Distinguish a local save indicator from a server confirmation and reviewer submission.','Follow the state guide with your manager. Avoid a second completion attempt while the first outcome is unknown.'],owner:'Technician and laboratory manager',guide:'prep-receipt'}
};
function problem(){let p=S.problem;let head=p==='start'?'What are you trying to resolve?':p==='result'?'What does Workbench show for this work?':p==='prep'?'Can you find a confirmation receipt?':'Your next safe action';let choices=p==='start'?[['result','My manager cannot see my results','I have entered values, but there is no review item.'],['prep','Preparation still looks incomplete','I confirmed the work, but another page disagrees.'],['offline','Work is waiting to synchronize','This device has saved or pending operations.']]:p==='result'?[['draft','Draft or saved values','I have entered or pasted values.'],['recorded','Recorded determinations','Recording finished; I have not verified submission.'],['submitted','Submitted with a server receipt','The application confirmed reviewer submission.'],['uncertain','I cannot tell','Help me identify the evidence.']]:p==='prep'?[['receipt','Yes, for this task and attempt','There is a confirmation time and receipt.'],['noreceipt','No receipt is visible','I can see checks or a completion label only.'],['uncertain','I cannot tell','I need help comparing the task and receipt.']]:null;let o=outcomes[p];return `<div class="solver"><div class="eyebrow">Troubleshooting · one question at a time</div><h1>Start with what you can see</h1><p>Find the cause without repeating laboratory work or changing a result.</p><div class="solverbox"><div class="small" style="margin-bottom:12px">${p==='start'?'Choose a problem':o?'Recommended path':'Check the visible evidence'}</div><h2>${head}</h2>${choices?choices.map(([id,t,d])=>`<button class="choice" data-action="problem" data-id="${id}"><strong>${E(t)}</strong><small>${E(d)}</small></button>`).join(''):`<div class="solverout"><h2>${E(o.title)}</h2><ol>${o.steps.map(s=>`<li>${E(s)}</li>`).join('')}</ol><p><strong>Who helps next:</strong> ${E(o.owner)}</p>${gbutton(o.guide,'Open the detailed instructions',true)}</div>`}<div class="buttonrow">${p!=='start'?button('Start again','problem','data-id="start"'):''}${button('Browse all help','scene','data-id="library"')}</div></div><p class="small">This decision path explains actions. It does not save, confirm, retry or approve any laboratory operation.</p></div>`}
function context(){return `<div class="simulationbar">INTERACTION DEMO · Synthetic worksheet. Type in a value, open Help, then close it. Nothing is sent to LIMS.</div><div class="sectionhead"><div><div class="eyebrow">Workbench / Worksheet</div><h1 style="font-size:29px;margin:0">pH in water</h1></div>${button(S.context?'Close help':'Help on this page','togglecontext','id="toggle-help"',!S.context)}</div><div class="workspace-grid ${S.context?'':'closed'}"><section class="workcard"><h2>Example batch</h2><p class="small">Same method · synthetic samples · values remain in this prototype only</p><div class="tablewrap"><table><thead><tr><th>Sample</th><th>pH value</th><th>State</th></tr></thead><tbody><tr><td><strong>DEMO-001</strong></td><td><input aria-label="DEMO-001 pH value" data-work="a" value="${E(S.workValues.a)}"></td><td><span class="pill">Draft</span></td></tr><tr><td><strong>DEMO-002</strong></td><td><input aria-label="DEMO-002 pH value" data-work="b" value="${E(S.workValues.b)}"></td><td><span class="pill">Draft</span></td></tr></tbody></table></div><div class="buttonrow">${button('Review Completion','demoreview')}</div><p class="small" style="margin-top:18px">The design keeps contextual help beside the task and preserves typed values when it is opened, closed or expanded.</p></section>${S.context?`<aside class="companion" aria-label="Page help companion"><div class="sectionhead"><h2>Worksheet help</h2>${button('Close','togglecontext','aria-label="Close page help"')}</div><span class="pill">pH worksheet · recording results</span>${!S.contextDetail?`<h3>What changes when I record?</h3><p>Recording saves eligible determinations. You must still submit the selected samples for the manager to review them.</p><ol><li>Check identifiers, values and required metadata.</li><li>Review Completion shows included and excluded items.</li><li>Record the eligible determinations, then use Ready to Submit.</li></ol>${button('See the exact controls','contextdetail','',true)}<button class="problemrow" data-action="contexttrouble">My manager cannot see these results <span>→</span></button><p class="small">Related: parameter basis and method guidance come from the assigned laboratory method.</p>`:`<h3>From draft to reviewer handoff</h3><ol><li><strong>Review Completion:</strong> inspect Included Determinations and Excluded / Incomplete.</li><li><strong>Record N Determinations:</strong> confirm only the checked eligible entries.</li><li><strong>Ready to Submit:</strong> inspect FULL or PARTIAL sample scope.</li><li><strong>Submit N Samples for Review:</strong> verify the server confirmation in Sent & Completed.</li></ol><div class="notice">Do not assume that a saved draft has been submitted.</div>${button('Back to page help','contextdetail')}`}</aside>`:''}</div>`}
function studio(){let current=S.editorText||dryingQuick.fr;let tabs=[['article','Article'],['translations','Translations'],['coverage','Coverage'],['review','Review & release']];return `<div class="studio"><div class="eyebrow">Help administration · example workspace</div><h1>Content studio</h1><p>Maintain exact instructions, local guidance and complete translations in one place.</p><div class="studio-tabs" role="tablist">${tabs.map(([id,t])=>`<button role="tab" aria-selected="${S.studio===id}" class="${S.studio===id?'active':''}" data-action="studio" data-id="${id}">${t}</button>`).join('')}</div>${S.studio==='article'?`<div class="studio-grid"><div class="editorbox"><span class="pill sand">Design draft · not published</span><h2 style="margin-top:17px">Confirm sample drying</h2><label for="draft-title">Task title</label><input id="draft-title" value="Confirm sample drying and find its receipt"><label for="draft-action">Step action</label><textarea id="draft-action">Select Confirm Complete after checking the required physical preparation evidence.</textarea><label for="draft-outcome">Expected outcome</label><textarea id="draft-outcome" style="min-height:105px">The server confirms completion and provides the receipt. Check the task, operator and confirmation time.</textarea><div class="buttonrow">${button('Preview as a reader','guide','data-id="prep-drying"',true)}${button('Check this draft','checkdraft')}</div></div><aside class="editorbox"><div class="eyebrow">Evidence, not a generic approval stamp</div><h2>Ready to review?</h2><ul class="validation"><li>Application source control identified.</li><li>Representative UI test still required.</li><li>Screenshot with synthetic records still required.</li><li>Local scientific conditions must refer to the approved method.</li><li>Five complete locale versions are required.</li></ul><hr style="border:0;border-top:1px solid var(--line)"><h3>Application binding</h3><p class="small">Workbench → operational task → Confirm Complete → confirmation receipt</p><h3>Local laboratory note</h3><p class="small">Attach reviewed local guidance separately. It may explain the SOP or responsible contact; it cannot rewrite platform permission rules.</p><div class="notice">An editor can see what is missing before asking a reviewer to publish.</div></aside></div>`:S.studio==='translations'?`<div class="studio-grid"><section class="editorbox"><div class="sectionhead"><h2>Source · English</h2><span class="pill">Revision example 2</span></div><p class="small">Block: Quick answer</p><p class="readonly">${E(dryingQuick.en)}</p><h3 style="margin-top:26px">Protected meaning</h3><p class="small">A checked box, a server receipt and approval are distinct states. Preserve this distinction in every language.</p><div class="tablewrap"><table><thead><tr><th>Locale</th><th>Example review state</th></tr></thead><tbody>${[['English','Source draft'],['Español','Awaiting review'],['Español · América Latina','Adaptation pending'],['Français','Editing draft'],['Português','Awaiting review']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section><section class="editorbox"><h2>Translation · Français</h2><label for="translation">Quick answer translation</label><textarea id="translation" style="min-height:220px">${E(current)}</textarea><div class="buttonrow">${button('Check translation draft','checktranslation','',true)}</div><p class="small" style="margin-top:18px">The implementation validates missing blocks, protected tokens, source changes and review state. The preview keeps this text only in memory.</p><h3>Glossary suggestion</h3><p class="small">Confirmation receipt → Reçu de confirmation<br>Proposed terminology; reviewer validation required.</p></section></div>`:S.studio==='coverage'?`<div class="editorbox"><h2>Coverage means usable guidance</h2><p class="small">Proposed bindings shown here; these are not production pass results.</p><div class="tablewrap"><table><thead><tr><th>Page / situation</th><th>Specific guide</th><th>Outstanding evidence</th></tr></thead><tbody>${[['Workbench · paste preview','Record and submit a batch','UI and locale verification'],['Workbench · preparation conflict','Preparation looks incomplete','Same-task receipt fixture'],['Sample · workflow map','Read map dependencies','Complete article + screenshots'],['Admin · analysis configuration','Maintain analysis catalogue','Parameter family coverage'],['Reception · saved draft','Resume an intake draft','Location persistence fixture'],['Offline · sync conflict','Synchronize and verify queued work','Device + server conflict test']].map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="buttonrow">${button('Review all 96 writing briefs','scene','data-id="library"',true)}</div></div>`:`<div class="editorbox"><h2>Publish a verified content release</h2><p>Make reviewed replacements available while preserving the currently published guides and their URLs.</p><ol class="validation"><li>Resolve the application verification items for each changed guide.</li><li>Review scientific material with the responsible laboratory reviewer where it is present.</li><li>Complete and review all required language blocks.</li><li>Check role, route, offline and accessibility fixtures.</li><li>Build the content release manifest and test rollback.</li></ol><div class="notice"><strong>Publication is unavailable in this design preview.</strong><br>These are example drafts. No document is represented as reviewed or published.</div>${button('Inspect coverage requirements','studio','data-id="coverage"')}</div>`}<div class="releasefoot">Prototype editor only. This screen does not modify LIMS content, change permissions or publish a release.</div></div>`}
function learn(){let steps=[['Receive the physical samples','Keep expected project records separate from physical receipt. Check labels, condition and requested analyses.','intake-project'],['Confirm drying and preparation','Follow the assigned SOP, confirm the physical work and verify the receipt before analysis.','prep-drying'],['Record and submit the results','Use the same-method worksheet. Understand drafts, recording and reviewer submission.','bench-batch'],['Review the submitted version','Inspect completeness, quality evidence and any exception before accepting or returning work.','review-submission'],['Release and trace the report','Release follows the authorized final decision. Retain version history and trace any external delivery.','review-report']];return `<div class="eyebrow">First shift · guided learning</div><h1>Follow five samples through the laboratory</h1><p style="max-width:720px">A short orientation that connects each person's work. Read the relevant guide at each stage and explain what evidence the next person should receive.</p><div class="simulationbar">Synthetic training scenario · DEMO-001 to DEMO-005 · SoilFER example project · no laboratory operations</div>${steps.map(([title,body,id],n)=>`<section class="learnstep"><span class="num">${n+1}</span><div><h3>${title}</h3><p>${body}</p>${gbutton(id,article(id)?'Read this stage':'Review planned stage guidance')}</div></section>`).join('')}<div class="notice">The implemented tutorial must use isolated demo data. Reading or completing it is not proof of laboratory competency or method authorization.</div>`}
function render(){let l=L();document.documentElement.lang=S.language;document.body.dataset.theme=S.theme;$('#scene').value=['brief'].includes(S.scene)?'library':S.scene;$('#role').value=S.role;$('#language').value=S.language;$('#theme').value=S.theme;$('#brandtitle').textContent=l.brand;$('#searchbutton').textContent=l.search;$('#search').placeholder=l.placeholder;$('#search').value=S.search;renderNav();let locale=S.language==='en'?'':`<div class="localization"><strong>Localization preview:</strong> navigation and the drying quick answer are translated. Full procedures and review controls remain in English here. Production requires complete, reviewed content in all five languages.</div>`;let scenes={home,guide:reader,brief:briefView,library,problem,context,studio,learn};$('#main').innerHTML=locale+(scenes[S.scene]||home)()+`<footer class="footer"><span>SoilFER · Help & lab guide</span><span>Review v2 · Synthetic examples · No live changes</span></footer>`;}
$('#role').innerHTML=DATA.roles.map(r=>`<option value="${r.id}">${E(r.label)}</option>`).join('');
$('#scene').addEventListener('change',e=>setScene(e.target.value));$('#role').addEventListener('change',e=>{S.role=e.target.value;setScene('home')});$('#language').addEventListener('change',e=>{S.language=e.target.value;render()});$('#theme').addEventListener('change',e=>{S.theme=e.target.value;render()});
$('#searchform').addEventListener('submit',e=>{e.preventDefault();S.search=$('#search').value;S.topic='all';setScene('library')});
document.addEventListener('change',e=>{if(e.target.id==='topic'){S.topic=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.work)S.workValues[e.target.dataset.work]=e.target.value;if(e.target.id==='translation')S.editorText=e.target.value});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;
 if(a==='scene')setScene(id);if(a==='guide')openGuide(id);if(a==='topic'){S.topic=id;S.search='';setScene('library')}if(a==='clearsearch'){S.search='';S.topic='all';setScene('library')}
 if(a==='problem'){S.problem=id;setScene('problem')}if(a==='togglecontext'){S.context=!S.context;render();if(!S.context)$('#toggle-help').focus()}if(a==='contextdetail'){S.contextDetail=!S.contextDetail;render()}
 if(a==='contexttrouble'){S.contextDetail=true;render();toast('Your worksheet values remain in place. Follow the draft → record → submit distinction.')}if(a==='demoreview')toast('Demonstration only: a real review checks included and excluded determinations. No result has been recorded.');
 if(a==='studio'){S.studio=id;setScene('studio')}if(a==='checkdraft')toast('Example check: UI evidence, screenshots and locale review are still outstanding. Nothing was saved or published.');if(a==='checktranslation')toast('Translation draft retained in this preview. It still requires terminology and language review; no publication occurred.');if(a==='feedback')toast(id==='yes'?'Prototype feedback noted for this view; no message was sent.':'In the implementation, this opens a short explanation field with the article and section attached.');
});
render();
</script></body></html>
