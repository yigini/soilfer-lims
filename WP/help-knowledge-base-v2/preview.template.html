function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,6000)}
function figure(){return `<div class="benchfigure" role="img" aria-label="Synthetic batch example: 40 rows checked, 38 matched drafts and two excluded rows"><div class="figurehead"><span>EXAMPLE · pH WORKSHEET</span><span>40-row batch</span></div><div class="worksheetmini"><div class="minirow head"><span>Sample</span><span>pH</span><span>Paste preview</span></div><div class="minirow"><b>DEMO-001</b><span>6.42</span><span class="ok">Matched</span></div><div class="minirow"><b>DEMO-002</b><span>5.88</span><span class="ok">Matched</span></div><div class="minirow"><b>DEMO-039</b><span>6.15</span><span class="warn">Blocked</span></div><div class="minirow"><b>DEMO-040</b><span>—</span><span class="warn">No value</span></div></div><div class="figurecaption">4 of 40 rows shown · 38 matched · 2 excluded<br>Applying values creates drafts. Submission comes later.</div></div>`}
function setScene(scene){S.scene=scene;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function openGuide(id){S.guide=id;setScene(article(id)?'guide':'brief')}
function renderNav(){let l=L();$('#sidebar').innerHTML=[['home','⌂'],['problem','?'],['learn','↗'],['library','≡']].map(([id,sym])=>`<button class="navbtn ${S.scene===id?'active':''}" data-action="scene" data-id="${id}" ${S.scene===id?'aria-current="page"':''}><span class="navsymbol" aria-hidden="true">${sym}</span>${E(l[id])}</button>`).join('')+`<p class="sidelabel">${E(l.topics)}</p>`+DATA.content.topics.map(t=>`<button class="navbtn topiclink ${S.scene==='library'&&S.topic===t.id?'active':''}" data-action="topic" data-id="${t.id}">${E(t.title)}</button>`).join('')+`<div class="side-note">Application instructions explain the controls.<br><br>Your laboratory SOP defines how the analysis is performed.</div>`;}
function taskSummary(g){const copy={'bench-batch':'Enter a method batch, resolve unmatched rows, then send the checked work to your reviewer.','prep-drying':'Finish the required checks, confirm completion and verify the receipt.','method-spectral-import':'Upload instrument exports, match each spectrum and check the import receipt.','offline-sync':'Reconcile pending work and verify which operations reached the server.','start-settings':'Choose your language and appearance, and understand which settings are saved.'};return copy[g.id]||article(g.id)?.summary||g.outcome;}
function roleFigure(){if(S.role==='LAB_TECHNICIAN')return figure();const sets={SAMPLE_RECEPTION:['SAMPLE RECEIPT',['1 · Match the physical label','2 · Check condition & analyses','3 · Verify the receipt'],'A project record is not proof of physical receipt.'],LAB_MANAGER:['REVIEWER HANDOFF',['1 · Find the submitted version','2 · Inspect evidence & exceptions','3 · Accept or return with a reason'],'Final approval and report release are separate decisions.'],PROJECT_MANAGER:['PROJECT PROGRESS',['Field records → laboratory receipt','Laboratory work → reviewed results','Released report → external delivery'],'Follow the owner and evidence at each handoff.'],SURVEYOR:['FIELD TO LAB',['Capture the field sample record','Check identity and source location','Follow the laboratory handover'],'Importing field data does not receive the physical sample.']};let v=sets[S.role]||['TRACEABLE LABORATORY WORK',['Know your permitted scope','Follow the current record and version','Verify the outcome and next owner'],'Reading another role’s guide does not change your permissions.'];return '<div class="benchfigure"><div class="figurehead">'+v[0]+'</div><div class="worksheetmini">'+v[1].map(t=>'<div style="padding:14px 5px;border-bottom:1px solid var(--line);font-size:14px">'+E(t)+'</div>').join('')+'</div><p class="figurecaption">'+E(v[2])+'</p></div>';}
function home(){let r=DATA.roles.find(r=>r.id===S.role),main=brief(r.tasks[0]),l=L();let heading=S.role==='LAB_TECHNICIAN'?l.lab:S.role==='SAMPLE_RECEPTION'?l.intake:S.role==='LAB_MANAGER'?l.manager:l.role;return `<div class="home-intro"><div class="eyebrow">${E(r.label)} · ${E(l.home)}</div><h1>${E(heading)}</h1><p>${E(l.intro)}</p></div><div class="feature"><div class="feature-copy"><div class="eyebrow">A useful place to start</div><h2>${E(main.title)}</h2><p>${E(taskSummary(main))}</p><div class="buttonrow">${gbutton(main.id,article(main.id)?l.read:'Review this guide brief',true)}${button('Learn with five example samples','scene','data-id="learn"')}</div></div>${roleFigure()}</div><div class="pair"><section><div class="sectionhead"><h2>${E(l.next)}</h2></div><div class="taskrows">${[...r.tasks.slice(1),S.role==='LAB_TECHNICIAN'?'offline-sync':'start-settings'].map((id,n)=>{let g=brief(id);return `<button class="taskrow" data-action="guide" data-id="${id}"><span class="num">${n+1}</span><span><strong>${E(g.title)}</strong><small>${E(taskSummary(g))}</small></span><span aria-hidden="true">↗</span></button>`}).join('')}</div></section><section><div class="sectionhead"><h2>${E(l.stuck)}</h2></div>${['My result is saved, but the manager cannot see it','Preparation still looks incomplete','I have pending work on this device'].map((s,n)=>`<button class="problemrow" data-action="problem" data-id="${['result','prep','offline'][n]}">${E(s)}<span aria-hidden="true">→</span></button>`).join('')}<div class="buttonrow">${button(l.problem,'scene','data-id="problem"')}</div><p class="small" style="margin-top:15px">Start with what you can see. The guide explains the next safe action and who can help.</p></section></div><section class="workflow"><div class="sectionhead"><h2>How laboratory work connects</h2><span class="small">A learning path</span></div><div class="flow">${[['Receive','intake-project'],['Prepare','prep-drying'],['Record & submit','bench-batch'],['Review','review-submission'],['Release report','review-report']].map(([t,id],n)=>(n?'<span aria-hidden="true">→</span>':'')+`<button data-action="guide" data-id="${id}">${t}</button>`).join('')}</div></section>`}
function reader(){let g=article(S.guide)||DATA.examples[0],l=L(),n=0;let toc=[['before',l.before],...g.sections.map((s,i)=>['phase-'+i,s.title]),['fields','Field guide'],['success',l.verified],['problems','If something differs']];return `<div class="breadcrumb"><button class="linkbutton" data-action="scene" data-id="home">${E(l.home)}</button><span>/</span><span>${E(brief(g.id)?.topicTitle||g.topic)}</span></div><header class="article-head"><div class="eyebrow">Task guide</div><h1>${E(g.title)}</h1><p>${E(g.summary)}</p><div class="meta"><span class="pill">English design exemplar</span><span>${E(g.role)}</span><span>${E(g.minutes)} min guide</span><span>Awaiting application review</span></div></header><div class="quick"><strong>${E(l.quick)}</strong><p>${E(g.id==='prep-drying'?dryingQuick[S.language]:g.quick)}</p></div><div class="articlelayout"><article class="articlebody"><section id="before"><h2>${E(l.before)}</h2><ul class="checks">${g.before.map(s=>`<li>${E(s)}</li>`).join('')}</ul></section>${g.id==='bench-batch'?figure():''}${g.sections.map((s,i)=>`<section id="phase-${i}"><h2>${E(s.title)}</h2>${s.steps.map(st=>`<div class="step"><span class="num">${++n}</span><div><p class="action">${E(st.action)}</p><div class="expected"><strong>What you should see</strong>${E(st.expected)}</div></div></div>`).join('')}</section>`).join('')}<section id="fields"><h2>Field guide & examples</h2><div class="tablewrap"><table><thead><tr><th>Field or state</th><th>What it means</th><th>Example / instruction</th></tr></thead><tbody>${g.fields.map(row=>`<tr>${row.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${g.example?`<div class="notice"><strong>Worked example</strong><p style="margin:9px 0 0">${E(g.example)}</p></div>`:''}</section><section id="success" class="success"><h2>${E(l.verified)}</h2><p>${E(g.success)}</p><h3>Who acts next</h3><p>${E(g.nextActor)}</p></section><section id="problems"><h2>If something differs</h2>${g.problems.map(p=>`<details><summary>${E(p.symptom)}</summary><p>${E(p.why)}</p><p class="fix">${E(p.action)}</p></details>`).join('')}</section><div class="feedback"><strong>Did this explain your next step?</strong>${button('Yes','feedback','data-id="yes"')}${button('Still unclear','feedback','data-id="no"')}</div><div class="endnote"><strong>Review status</strong><p>Detailed English design example. Source controls still require verification in the candidate release before publication. Scientific operating conditions must come from the approved local method.</p><details><summary>Implementation evidence</summary>${g.sources.map(s=>`<p>${E(s)}</p>`).join('')}</details></div></article><aside class="toc" aria-label="On this page"><strong>On this page</strong>${toc.map(([id,t])=>`<a href="#${id}">${E(t)}</a>`).join('')}<div class="buttonrow">${button('Try help beside a worksheet','scene','data-id="context"')}</div></aside></div>`}
function briefView(){let g=brief(S.guide);return `<div class="breadcrumb"><button class="linkbutton" data-action="scene" data-id="library">Browse the guide</button><span>/</span>${E(g.topicTitle)}</div><div class="brief"><span class="pill sand">Writing brief · content still to be produced</span><h1 style="margin-top:20px">${E(g.title)}</h1><p>${E(g.outcome)}</p><div class="notice">This is a commissioned article scope, not a completed user guide. Antigravity must write the full procedure to the standard shown in the eight detailed examples.</div><h3>A real problem this guide must resolve</h3><p>${E(g.failureToExplain)}</p><h3>Required content</h3><ul>${g.requiredBlocks.map(s=>`<li>${E(s)}</li>`).join('')}</ul><h3>Verification before publication</h3><ul>${g.acceptance.map(s=>`<li>${E(s)}</li>`).join('')}</ul><p class="small">${E(g.scopeNote)}</p><h3>Evidence to trace</h3>${g.evidenceSources.map(s=>`<p class="small"><code>${E(s.file)}</code><br>${s.existsAtBuild?'Candidate file exists':'Resolve the actual implementation path'} · verify behavior, permissions and UI.</p>`).join('')}<div class="buttonrow">${gbutton('bench-batch','Read a complete example',true)}${button('Back to the inventory','scene','data-id="library"')}</div></div>`}
function searchText(g){return [g.title,g.outcome,g.failureToExplain,g.topicTitle,g.id,g.id.includes('spectral')?'MIR NIR spectroscopy spectrum spectra reflectance':'',g.id.includes('drying')?'dry DRYING checklist':'',g.id.includes('prep')?'PREP preparation incomplete':'',g.id.includes('batch')?'pH paste 40 samples':''].join(' ').toLowerCase()}
function library(){let query=S.search.trim().toLowerCase();let rows=DATA.content.articles.filter(g=>(S.topic==='all'||g.topic===S.topic)&&(!query||query.split(/\s+/).every(q=>searchText(g).includes(q))));return `<div class="eyebrow">The complete writing commission</div><h1>${query?'Search results':'Browse the lab guide'}</h1><p class="small">${DATA.content.count} task briefs · ${DATA.examples.length} fully written English design examples · 12 topics · all 10 roles</p><div class="librarytools"><label for="topic">Topic</label><select id="topic"><option value="all">All topics</option>${DATA.content.topics.map(t=>`<option value="${t.id}" ${S.topic===t.id?'selected':''}>${E(t.title)}</option>`).join('')}</select>${query?button('Clear search','clearsearch'):''}<span class="small">${rows.length} matches${query?' for “'+E(S.search)+'”':''}</span></div><div class="resultlist">${rows.map(g=>`<button class="result" data-action="guide" data-id="${g.id}"><div><span class="pill ${article(g.id)?'':'sand'}">${article(g.id)?'Read full example':'Review writing brief'}</span><h3>${E(g.title)}</h3><p>${E(g.outcome)}</p></div><span aria-hidden="true">↗</span></button>`).join('')||`<div class="solverbox"><h2>No exact match</h2><p>Try the sample task, parameter name or the words you see on the page. Your entries have not been changed.</p>${button('Solve a problem','scene','data-id="problem"')}${button('Browse all topics','clearsearch')}</div>`}</div>`}
const outcomes={
 draft:{title:'A draft has not reached the manager',steps:['Check that the values and required metadata are correct in Worksheet.','Select the intended rows, open Review Completion and record the eligible determinations.','Open Ready to Submit, check the analyses included and submit the selected samples for review.','Verify the server confirmation and Sent & Completed.'],owner:'Technician → laboratory reviewer after submission',guide:'bench-batch'},
 recorded:{title:'The reviewer handoff is still needed',steps:['Open Ready to Submit in Workbench.','Check the intended sample, included determinations and FULL or PARTIAL scope.','Confirm Submit N Samples for Review and verify the server receipt.'],owner:'Technician submits; the manager then reviews.',guide:'bench-batch'},
 submitted:{title:'Use the receipt to trace the submitted work',steps:['Check that the receipt belongs to the same sample, task version and laboratory.','Ask the manager to inspect Review Submissions with the relevant filters.','If a server-confirmed submission is still absent, preserve the receipt and report the discrepancy. Do not create another result or repeat completion on the sample page.'],owner:'Laboratory manager, then platform support if views disagree.',guide:'review-submission'},
 receipt:{title:'Keep the receipt; do not repeat completion',steps:['Compare the sample, task and attempt on the receipt with the current task.','Check whether the label means awaiting a later review rather than awaiting confirmation.','If the same confirmed attempt remains incomplete, preserve the receipt and report the contradictory state. Do not use the sample page to force it through.'],owner:'Laboratory manager or support checks the conflicting state.',guide:'prep-receipt'},
 noreceipt:{title:'First establish whether confirmation was accepted',steps:['Checking the physical checklist does not itself confirm completion.','Inspect the task and any pending local operation before trying again.','Use Confirm Complete only for an eligible unconfirmed task; verify its resulting receipt. If the outcome is uncertain, retain the task details and resolve that uncertainty before repeating it.'],owner:'Technician verifies; manager/support resolves uncertain state.',guide:'prep-drying'},
 offline:{title:'Keep this device and its pending work intact',steps:['Reconnect and use the same authorized account and laboratory.','Inspect each queued operation, its status and any server receipt. A connection indicator alone does not prove synchronization.','Resolve conflicts through the supported recovery flow. Do not clear storage, reinstall or switch account to make the queue disappear.','Check the resulting server state and receipts before counting work as submitted.'],owner:'Technician reconciles supported operations; unresolved conflicts go to the responsible manager/support.',guide:'offline-sync'},
 uncertain:{title:'Gather what the screen actually confirms',steps:['Record the sample identifier, task, visible state and any receipt or queue status.','Distinguish a local save indicator from a server confirmation and reviewer submission.','Follow the state guide with your manager. Avoid a second completion attempt while the first outcome is unknown.'],owner:'Technician and laboratory manager',guide:'prep-receipt'}
};
function problem(){let p=S.problem;let head=p==='start'?'What are you trying to resolve?':p==='result'?'What does Workbench show for this work?':p==='prep'?'Can you find a confirmation receipt?':'Your next safe action';let choices=p==='start'?[['result','My manager cannot see my results','I have entered values, but there is no review item.'],['prep','Preparation still looks incomplete','I confirmed the work, but another page disagrees.'],['offline','Work is waiting to synchronize','This device has saved or pending operations.']]:p==='result'?[['draft','Draft or saved values','I have entered or pasted values.'],['recorded','Recorded determinations','Recording finished; I have not verified submission.'],['submitted','Submitted with a server receipt','The application confirmed reviewer submission.'],['uncertain','I cannot tell','Help me identify the evidence.']]:p==='prep'?[['receipt','Yes, for this task and attempt','There is a confirmation time and receipt.'],['noreceipt','No receipt is visible','I can see checks or a completion label only.'],['uncertain','I cannot tell','I need help comparing the task and receipt.']]:null;let o=outcomes[p];return `<div class="solver"><div class="eyebrow">Troubleshooting · one question at a time</div><h1>Start with what you can see</h1><p>Find the cause without repeating laboratory work or changing a result.</p><div class="solverbox"><div class="small" style="margin-bottom:12px">${p==='start'?'Choose a problem':o?'Recommended path':'Check the visible evidence'}</div><h2>${head}</h2>${choices?choices.map(([id,t,d])=>`<button class="choice" data-action="problem" data-id="${id}"><strong>${E(t)}</strong><small>${E(d)}</small></button>`).join(''):`<div class="solverout"><h2>${E(o.title)}</h2><ol>${o.steps.map(s=>`<li>${E(s)}</li>`).join('')}</ol><p><strong>Who helps next:</strong> ${E(o.owner)}</p>${gbutton(o.guide,'Open the detailed instructions',true)}</div>`}<div class="buttonrow">${p!=='start'?button('Start again','problem','data-id="start"'):''}${button('Browse all help','scene','data-id="library"')}</div></div><p class="small">This decision path explains actions. It does not save, confirm, retry or approve any laboratory operation.</p></div>`}
function context(){return `<div class="simulationbar">INTERACTION DEMO · Synthetic worksheet. Type in a value, open Help, then close it. Nothing is sent to LIMS.</div><div class="sectionhead"><div><div class="eyebrow">Workbench / Worksheet</div><h1 style="font-size:29px;margin:0">pH in water</h1></div>${button(S.context?'Close help':'Help on this page','togglecontext','id="toggle-help"',!S.context)}</div><div class="workspace-grid ${S.context?'':'closed'}"><section class="workcard"><h2>Example batch</h2><p class="small">Same method · synthetic samples · values remain in this prototype only</p><div class="tablewrap"><table><thead><tr><th>Sample</th><th>pH value</th><th>State</th></tr></thead><tbody><tr><td><strong>DEMO-001</strong></td><td><input aria-label="DEMO-001 pH value" data-work="a" value="${E(S.workValues.a)}"></td><td><span class="pill">Draft</span></td></tr><tr><td><strong>DEMO-002</strong></td><td><input aria-label="DEMO-002 pH value" data-work="b" value="${E(S.workValues.b)}"></td><td><span class="pill">Draft</span></td></tr></tbody></table></div><div class="buttonrow">${button('Review Completion','demoreview')}</div><p class="small" style="margin-top:18px">The design keeps contextual help beside the task and preserves typed values when it is opened, closed or expanded.</p></section>${S.context?`<aside class="companion" aria-label="Page help companion"><div class="sectionhead"><h2>Worksheet help</h2>${button('Close','togglecontext','aria-label="Close page help"')}</div><span class="pill">pH worksheet · recording results</span>${!S.contextDetail?`<h3>What changes when I record?</h3><p>Recording saves eligible determinations. You must still submit the selected samples for the manager to review them.</p><ol><li>Check identifiers, values and required metadata.</li><li>Review Completion shows included and excluded items.</li><li>Record the eligible determinations, then use Ready to Submit.</li></ol>${button('See the exact controls','contextdetail','',true)}<button class="problemrow" data-action="contexttrouble">My manager cannot see these results <span>→</span></button><p class="small">Related: parameter basis and method guidance come from the assigned laboratory method.</p>`:`<h3>From draft to reviewer handoff</h3><ol><li><strong>Review Completion:</strong> inspect Included Determinations and Excluded / Incomplete.</li><li><strong>Record N Determinations:</strong> confirm only the checked eligible entries.</li><li><strong>Ready to Submit:</strong> inspect FULL or PARTIAL sample scope.</li><li><strong>Submit N Samples for Review:</strong> verify the server confirmation in Sent & Completed.</li></ol><div class="notice">Do not assume that a saved draft has been submitted.</div>${button('Back to page help','contextdetail')}`}</aside>`:''}</div>`}
function studio(){let current=S.editorText||dryingQuick.fr;let tabs=[['article','Article'],['translations','Translations'],['coverage','Coverage'],['review','Review & release']];return `<div class="studio"><div class="eyebrow">Help administration · example workspace</div><h1>Content studio</h1><p>Maintain exact instructions, local guidance and complete translations in one place.</p><div class="studio-tabs" role="tablist">${tabs.map(([id,t])=>`<button role="tab" aria-selected="${S.studio===id}" class="${S.studio===id?'active':''}" data-action="studio" data-id="${id}">${t}</button>`).join('')}</div>${S.studio==='article'?`<div class="studio-grid"><div class="editorbox"><span class="pill sand">Design draft · not published</span><h2 style="margin-top:17px">Confirm sample drying</h2><label for="draft-title">Task title</label><input id="draft-title" value="Confirm sample drying and find its receipt"><label for="draft-action">Step action</label><textarea id="draft-action">Select Confirm Complete after checking the required physical preparation evidence.</textarea><label for="draft-outcome">Expected outcome</label><textarea id="draft-outcome" style="min-height:105px">The server confirms completion and provides the receipt. Check the task, operator and confirmation time.</textarea><div class="buttonrow">${button('Preview as a reader','guide','data-id="prep-drying"',true)}${button('Check this draft','checkdraft')}</div></div><aside class="editorbox"><div class="eyebrow">Evidence, not a generic approval stamp</div><h2>Ready to review?</h2><ul class="validation"><li>Application source control identified.</li><li>Representative UI test still required.</li><li>Screenshot with synthetic records still required.</li><li>Local scientific conditions must refer to the approved method.</li><li>Five complete locale versions are required.</li></ul><hr style="border:0;border-top:1px solid var(--line)"><h3>Application binding</h3><p class="small">Workbench → operational task → Confirm Complete → confirmation receipt</p><h3>Local laboratory note</h3><p class="small">Attach reviewed local guidance separately. It may explain the SOP or responsible contact; it cannot rewrite platform permission rules.</p><div class="notice">An editor can see what is missing before asking a reviewer to publish.</div></aside></div>`:S.studio==='translations'?`<div class="studio-grid"><section class="editorbox"><div class="sectionhead"><h2>Source · English</h2><span class="pill">Revision example 2</span></div><p class="small">Block: Quick answer</p><p class="readonly">${E(dryingQuick.en)}</p><h3 style="margin-top:26px">Protected meaning</h3><p class="small">A checked box, a server receipt and approval are distinct states. Preserve this distinction in every language.</p><div class="tablewrap"><table><thead><tr><th>Locale</th><th>Example review state</th></tr></thead><tbody>${[['English','Source draft'],['Español','Awaiting review'],['Español · América Latina','Adaptation pending'],['Français','Editing draft'],['Português','Awaiting review']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section><section class="editorbox"><h2>Translation · Français</h2><label for="translation">Quick answer translation</label><textarea id="translation" style="min-height:220px">${E(current)}</textarea><div class="buttonrow">${button('Check translation draft','checktranslation','',true)}</div><p class="small" style="margin-top:18px">The implementation validates missing blocks, protected tokens, source changes and review state. The preview keeps this text only in memory.</p><h3>Glossary suggestion</h3><p class="small">Confirmation receipt → Reçu de confirmation<br>Proposed terminology; reviewer validation required.</p></section></div>`:S.studio==='coverage'?`<div class="editorbox"><h2>Coverage means usable guidance</h2><p class="small">Proposed bindings shown here; these are not production pass results.</p><div class="tablewrap"><table><thead><tr><th>Page / situation</th><th>Specific guide</th><th>Outstanding evidence</th></tr></thead><tbody>${[['Workbench · paste preview','Record and submit a batch','UI and locale verification'],['Workbench · preparation conflict','Preparation looks incomplete','Same-task receipt fixture'],['Sample · workflow map','Read map dependencies','Complete article + screenshots'],['Admin · analysis configuration','Maintain analysis catalogue','Parameter family coverage'],['Reception · saved draft','Resume an intake draft','Location persistence fixture'],['Offline · sync conflict','Synchronize and verify queued work','Device + server conflict test']].map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="buttonrow">${button('Review all 96 writing briefs','scene','data-id="library"',true)}</div></div>`:`<div class="editorbox"><h2>Publish a verified content release</h2><p>Make reviewed replacements available while preserving the currently published guides and their URLs.</p><ol class="validation"><li>Resolve the application verification items for each changed guide.</li><li>Review scientific material with the responsible laboratory reviewer where it is present.</li><li>Complete and review all required language blocks.</li><li>Check role, route, offline and accessibility fixtures.</li><li>Build the content release manifest and test rollback.</li></ol><div class="notice"><strong>Publication is unavailable in this design preview.</strong><br>These are example drafts. No document is represented as reviewed or published.</div>${button('Inspect coverage requirements','studio','data-id="coverage"')}</div>`}<div class="releasefoot">Prototype editor only. This screen does not modify LIMS content, change permissions or publish a release.</div></div>`}
function learn(){let steps=[['Receive the physical samples','Keep expected project records separate from physical receipt. Check labels, condition and requested analyses.','intake-project'],['Confirm drying and preparation','Follow the assigned SOP, confirm the physical work and verify the receipt before analysis.','prep-drying'],['Record and submit the results','Use the same-method worksheet. Understand drafts, recording and reviewer submission.','bench-batch'],['Review the submitted version','Inspect completeness, quality evidence and any exception before accepting or returning work.','review-submission'],['Release and trace the report','Release follows the authorized final decision. Retain version history and trace any external delivery.','review-report']];return `<div class="eyebrow">First shift · guided learning</div><h1>Follow five samples through the laboratory</h1><p style="max-width:720px">A short orientation that connects each person's work. Read the relevant guide at each stage and explain what evidence the next person should receive.</p><div class="simulationbar">Synthetic training scenario · DEMO-001 to DEMO-005 · SoilFER example project · no laboratory operations</div>${steps.map(([title,body,id],n)=>`<section class="learnstep"><span class="num">${n+1}</span><div><h3>${title}</h3><p>${body}</p>${gbutton(id,article(id)?'Read this stage':'Review planned stage guidance')}</div></section>`).join('')}<div class="notice">The implemented tutorial must use isolated demo data. Reading or completing it is not proof of laboratory competency or method authorization.</div>`}
function render(){let l=L();document.documentElement.lang=S.language;document.body.dataset.theme=S.theme;$('#scene').value=['brief'].includes(S.scene)?'library':S.scene;$('#role').value=S.role;$('#language').value=S.language;$('#theme').value=S.theme;$('#brandtitle').textContent=l.brand;$('#searchbutton').textContent=l.search;$('#search').placeholder=l.placeholder;$('#search').value=S.search;renderNav();let locale=S.language==='en'?'':`<div class="localization"><strong>Localization preview:</strong> navigation and the drying quick answer are translated. Full procedures and review controls remain in English here. Production requires complete, reviewed content in all five languages.</div>`;let scenes={home,guide:reader,brief:briefView,library,problem,context,studio,learn};$('#main').innerHTML=locale+(scenes[S.scene]||home)()+`<footer class="footer"><span>SoilFER · Help & lab guide</span><span>Review v2 · Synthetic examples · No live changes</span></footer>`;}
$('#role').innerHTML=DATA.roles.map(r=>`<option value="${r.id}">${E(r.label)}</option>`).join('');
$('#scene').addEventListener('change',e=>setScene(e.target.value));$('#role').addEventListener('change',e=>{S.role=e.target.value;setScene('home')});$('#language').addEventListener('change',e=>{S.language=e.target.value;render()});$('#theme').addEventListener('change',e=>{S.theme=e.target.value;render()});
$('#searchform').addEventListener('submit',e=>{e.preventDefault();S.search=$('#search').value;S.topic='all';setScene('library')});
document.addEventListener('change',e=>{if(e.target.id==='topic'){S.topic=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.work)S.workValues[e.target.dataset.work]=e.target.value;if(e.target.id==='translation')S.editorText=e.target.value});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;
 if(a==='scene')setScene(id);if(a==='guide')openGuide(id);if(a==='topic'){S.topic=id;S.search='';setScene('library')}if(a==='clearsearch'){S.search='';S.topic='all';setScene('library')}
 if(a==='problem'){S.problem=id;setScene('problem')}if(a==='togglecontext'){S.context=!S.context;render();if(!S.context)$('#toggle-help').focus()}if(a==='contextdetail'){S.contextDetail=!S.contextDetail;render()}
 if(a==='contexttrouble'){S.contextDetail=true;render();toast('Your worksheet values remain in place. Follow the draft → record → submit distinction.')}if(a==='demoreview')toast('Demonstration only: a real review checks included and excluded determinations. No result has been recorded.');
 if(a==='studio'){S.studio=id;setScene('studio')}if(a==='checkdraft')toast('Example check: UI evidence, screenshots and locale review are still outstanding. Nothing was saved or published.');if(a==='checktranslation')toast('Translation draft retained in this preview. It still requires terminology and language review; no publication occurred.');if(a==='feedback')toast(id==='yes'?'Prototype feedback noted for this view; no message was sent.':'In the implementation, this opens a short explanation field with the article and section attached.');
});
render();
</script></body></html>
