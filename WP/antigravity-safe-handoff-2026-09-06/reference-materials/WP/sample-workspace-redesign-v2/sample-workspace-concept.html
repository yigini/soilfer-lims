<div id="sample-lab-concept" aria-label="Sample workspace design">
<style>
#sample-lab-concept{--sw-bg:light-dark(#f4f7f6,#101b21);--sw-panel:light-dark(#fff,#19282f);--sw-text:light-dark(#203b40,#e6f0ed);--sw-muted:light-dark(#586f73,#b0c2c6);--sw-line:light-dark(#d6e2df,#3a5158);--sw-accent:light-dark(#176653,#88d8ba);--sw-on:light-dark(#fff,#102b23);--sw-soft:light-dark(#e9f5ef,#243f36);--sw-warn:light-dark(#82520b,#f1cc8f);--sw-warning:light-dark(#fff3dd,#3b3021);font:14px/1.5 system-ui,sans-serif;color:var(--sw-text);background:var(--sw-bg);border-radius:12px;overflow:clip}
#sample-lab-concept *{box-sizing:border-box}#sample-lab-concept h1{font-size:28px;margin:0}#sample-lab-concept h2{font-size:18px;margin:0 0 10px}#sample-lab-concept h3{font-size:15px;margin:0 0 6px}#sample-lab-concept p{margin:5px 0 12px}#sample-lab-concept small{font-size:12px;color:var(--sw-muted)}#sample-lab-concept button,#sample-lab-concept input,#sample-lab-concept select,#sample-lab-concept textarea{font:inherit;color:inherit;border:1px solid var(--sw-line);border-radius:7px;background:var(--sw-panel);padding:9px 12px;max-width:100%}#sample-lab-concept button{cursor:pointer}#sample-lab-concept button:hover:not(:disabled){border-color:var(--sw-accent)}#sample-lab-concept button:disabled{opacity:.55;cursor:not-allowed}#sample-lab-concept .sw-primary{background:var(--sw-accent);color:var(--sw-on);border-color:var(--sw-accent)}#sample-lab-concept .sw-preview{padding:12px 20px;background:var(--sw-warning);display:flex;align-items:center;gap:12px;flex-wrap:wrap}#sample-lab-concept .sw-preview label{display:flex;align-items:center;gap:7px}#sample-lab-concept .sw-shell{display:grid;grid-template-columns:146px minmax(0,1fr)}#sample-lab-concept aside{background:var(--sw-panel);border-right:1px solid var(--sw-line);padding:22px 14px}#sample-lab-concept .sw-logo{font-size:20px;color:var(--sw-accent);margin-bottom:28px}#sample-lab-concept .sw-navitem{padding:10px;margin:3px 0;color:var(--sw-muted)}#sample-lab-concept .sw-navitem.active{background:var(--sw-soft);color:var(--sw-accent);border-radius:8px}#sample-lab-concept main{min-width:0;padding:24px}#sample-lab-concept .sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#sample-lab-concept .sw-actions{display:flex;gap:8px;flex-wrap:wrap}#sample-lab-concept .sw-header{margin:16px 0 20px}#sample-lab-concept .sw-pill{display:inline-block;padding:3px 9px;border-radius:5px;background:var(--sw-soft);color:var(--sw-accent);font-size:12px}#sample-lab-concept .sw-alert{background:var(--sw-warning);color:var(--sw-warn);padding:16px;border-radius:9px;margin:16px 0}#sample-lab-concept .sw-next{background:var(--sw-panel);padding:17px;border:1px solid var(--sw-line);border-left:4px solid var(--sw-accent);border-radius:8px;margin-bottom:20px}#sample-lab-concept .sw-tabs{display:flex;gap:4px;border-bottom:1px solid var(--sw-line);flex-wrap:wrap;margin-bottom:20px}#sample-lab-concept .sw-tabs button{border:0;border-radius:0;background:transparent;color:var(--sw-muted);padding:12px 10px}#sample-lab-concept .sw-tabs button[aria-pressed=true]{color:var(--sw-accent);border-bottom:3px solid var(--sw-accent)}#sample-lab-concept .sw-panel{background:var(--sw-panel);border:1px solid var(--sw-line);border-radius:10px;padding:18px;margin-bottom:15px}#sample-lab-concept .sw-work{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(180px,1fr);gap:16px}#sample-lab-concept .sw-task{display:grid;grid-template-columns:minmax(140px,1fr) minmax(110px,.85fr) auto;align-items:center;gap:12px;padding:var(--sw-rowpad,16px) 0;border-bottom:1px solid var(--sw-line)}#sample-lab-concept .sw-task:last-child{border-bottom:0}#sample-lab-concept .sw-label{color:var(--sw-muted);font-size:12px;display:block;margin-bottom:3px}#sample-lab-concept .sw-divider{border:0;border-top:1px solid var(--sw-line);margin:16px 0}#sample-lab-concept .sw-check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}#sample-lab-concept .sw-check input{margin-top:5px}#sample-lab-concept .sw-form{display:grid;gap:12px}#sample-lab-concept .sw-form label{display:grid;gap:5px}#sample-lab-concept textarea{min-height:80px;width:100%}#sample-lab-concept .sw-note{color:var(--sw-muted)}#sample-lab-concept .sw-history{padding:12px 0;border-bottom:1px solid var(--sw-line)}#sample-lab-concept .sw-chart{width:100%;height:150px;color:var(--sw-accent)}#sample-lab-concept .sw-toast{margin-top:14px;color:var(--sw-accent)}#sample-lab-concept .sw-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}#sample-lab-concept [hidden]{display:none!important}
@media(max-width:760px){#sample-lab-concept .sw-shell{grid-template-columns:1fr}#sample-lab-concept aside{display:none}#sample-lab-concept main{padding:16px}#sample-lab-concept .sw-work,#sample-lab-concept .sw-two{grid-template-columns:1fr}}@media(max-width:440px){#sample-lab-concept .sw-task{grid-template-columns:1fr}#sample-lab-concept .sw-preview{padding:12px}#sample-lab-concept .sw-preview label{flex-wrap:wrap}#sample-lab-concept button{min-height:44px}}
</style>
<div class="sw-preview"><strong>Design preview</strong><label>Scenario <select id="sw-scenario"><option value="historical">S003 · evidence gap</option><option value="intake">Fresh intake</option><option value="recorded">Technician entry</option><option value="submitted">Submitted for review</option><option value="released">Report released</option><option value="disposed">Material disposed</option></select></label><label>View as <select id="sw-role"><option value="manager">Lab manager</option><option value="technician">Technician</option><option value="reception">Reception</option><option value="auditor">Auditor</option></select></label><small>Simulated actions only</small></div>
<div class="sw-shell"><aside><div class="sw-logo">SoilFER <small>LIMS</small></div><div class="sw-navitem">Overview</div><div class="sw-navitem active">Samples</div><div class="sw-navitem">My workbench</div><div class="sw-navitem">Spectral library</div><div class="sw-navitem">Reports</div></aside><main>
<div class="sw-row"><small>Samples / Sample workspace</small><small id="sw-person"></small></div>
<header class="sw-header"><div class="sw-row"><div><h1 id="sw-identity">S003</h1><span id="sw-field" class="sw-note">GTM0000-0-1022-S · Soil · SOILFER-US</span></div><span class="sw-pill">GTM-LAB1</span></div><div class="sw-row" style="margin-top:12px"><span id="sw-status"></span><small id="sw-material"></small></div></header>
<div id="sw-banner"></div><div class="sw-next sw-row"><div><strong id="sw-next-title"></strong><div id="sw-next-detail" class="sw-note"></div></div><button id="sw-next-button" class="sw-primary"></button></div>
<nav class="sw-tabs" aria-label="Sample sections"><button data-tab="work" aria-pressed="true">Work & results</button><button data-tab="review" aria-pressed="false">Review</button><button data-tab="request" aria-pressed="false">Sample & request</button><button data-tab="reports" aria-pressed="false">Reports</button><button data-tab="history" aria-pressed="false">History</button></nav>
<section id="sw-content" aria-label="Sample content"></section><div id="sw-feedback" class="sw-toast" role="status" aria-live="polite"></div>
</main></div></div>
<script>
(()=>{
const root=document.getElementById('sample-lab-concept');const q=s=>root.querySelector(s);
const state={scenario:'historical',role:'manager',tab:'work',detail:null,accepted:false,amendment:false,saved:false,density:'Comfortable'};
const demoTasks=[['MIR spectroscopy','DRIFTS · SOP-MIR rev 3','Spectrum · 3 replicates'],['Soil pH','Water 1:5 · SOP-pH rev 2','6.42 · dimensionless']];
const historyTasks=['Extractable zinc','Extractable iron','Extractable copper','Extractable manganese','Extractable boron','Soil pH'];
const isReleased=()=>['released','disposed'].includes(state.scenario);const canReview=()=>state.role==='manager'&&state.scenario==='submitted'&&!state.accepted;const canRelease=()=>state.role==='manager'&&state.accepted&&!isReleased();
function say(t){q('#sw-feedback').textContent=t}function selectTab(tab){state.tab=tab;state.detail=null;render()}
function render(){
root.style.setProperty('--sw-rowpad',state.density==='Compact'?'10px':'16px');q('#sw-person').textContent={manager:'Lab manager · review authority',technician:'Technician · Marcos A.',reception:'Reception · intake authority',auditor:'Auditor · read only'}[state.role];
q('#sw-identity').textContent=state.scenario==='historical'?'S003':'DEMO-004';q('#sw-field').textContent=state.scenario==='historical'?'GTM0000-0-1022-S · Soil · SOILFER-US':'Training sample · Soil · SOILFER-US';
q('#sw-status').textContent=state.scenario==='historical'?'Intake accepted · 6 ordered analyses':isReleased()?'Intake accepted · Report v1 released':state.scenario==='intake'?'Received · Intake review pending':'Intake accepted · 2 ordered analyses';
q('#sw-material').textContent=state.scenario==='disposed'?'Material: disposed · no retained aliquot':state.scenario==='historical'?'Material location: not recorded':'Material: 42 g · Cabinet A / Tray 12';
q('#sw-banner').innerHTML=state.scenario==='historical'?'<div class="sw-alert"><strong>Historical approval — evidence needs verification</strong><div>5 analyses are marked accepted without evidence shown. Report release is blocked until the record is investigated.</div></div>':state.amendment?'<div class="sw-alert"><strong>Amendment A-01 open</strong><div>Original evidence and report v1 preserved. Affected work needs a new review.</div></div>':'';
let title,detail,button;
if(state.scenario==='historical'){title='Resolve the evidence gap';detail='Manager · Inspect the five recorded acceptance decisions';button='Inspect evidence'}
else if(state.scenario==='intake'){title='Check the sample and requested work';detail='Reception · Confirm condition, identity and requested methods';button='Review intake'}
else if(state.scenario==='disposed'){title='New testing requires available material';detail='Request a new sample or verify a retained aliquot';button='View material'}
else if(isReleased()){title='Report v1 is the released record';detail='Corrections require a traceable amendment';button='View report'}
else if(state.accepted){title='Both results reviewed · ready for report';detail='Authorized release remains a separate decision';button='Preview report'}
else if(state.scenario==='submitted'){title='2 results submitted for review';detail='Inspect evidence and QC before accepting';button='Review submission'}
else{title=state.saved?'Draft saved · not submitted':'Complete your assigned work';detail='Technician · Record evidence, then submit for review';button='Open worksheet'}
q('#sw-next-title').textContent=title;q('#sw-next-detail').textContent=detail;q('#sw-next-button').textContent=button;
root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab));
if(state.detail){renderDetail();return}({work:work,review:review,request:request,reports:reports,history:history}[state.tab])();
}
function work(){
const historical=state.scenario==='historical';const tasks=historical?historyTasks.map((n,i)=>[n,'Method revision not recorded',i<5?'No linked evidence shown':'Not recorded']):demoTasks;
const done=isReleased()||state.accepted;const phase=done?'Reviewed':state.scenario==='submitted'?'Submitted':state.scenario==='intake'?'Awaiting intake acceptance':'Ready to record';
q('#sw-content').innerHTML='<div class="sw-work"><div><div class="sw-panel"><div class="sw-row"><h2>Ordered analyses</h2><small>'+tasks.length+' total · '+(state.role==='technician'&&!historical?'2 assigned to you':'all work visible')+'</small></div>'+tasks.map((t,i)=>'<div class="sw-task"><div><strong>'+t[0]+'</strong><small class="sw-label">'+t[1]+'</small><small>'+(historical?'Unassigned':'Marcos A.')+'</small></div><div><span class="sw-label">'+(historical?(i<5?'Historical accepted':'Unassigned'):phase)+'</span>'+(historical?t[2]:state.scenario==='intake'?'No evidence yet':state.scenario==='recorded'&&!state.saved?'Not recorded':t[2])+'</div><button data-evidence="'+i+'">'+(state.role==='technician'&&state.scenario==='recorded'?'Record':'Inspect')+'</button></div>').join('')+'</div></div><div><div class="sw-panel"><h3>Preparation</h3><p>'+(historical?'Historical acceptance recorded':'Drying & milling')+'</p><small>'+(historical?'Completion evidence needs verification.':state.scenario==='intake'?'Pending intake and method checks.':'Completed · SOP-PREP rev 2 · verified equipment')+'</small></div><div class="sw-panel"><h3>Review coverage</h3><p>'+(historical?'0 / 6 evidence-verified':done?'2 / 2 reviewed':state.scenario==='submitted'?'0 / 2 reviewed · 2 submitted':'0 / 2 submitted')+'</p><small>Only submitted evidence can be accepted.</small></div></div></div>';
root.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{state.detail={kind:'evidence',index:Number(b.dataset.evidence)};render()});
}
function review(){
if(state.scenario==='historical'||state.scenario==='intake'||state.scenario==='recorded'){q('#sw-content').innerHTML='<div class="sw-panel"><h2>No reviewable submission</h2><p>'+(state.scenario==='historical'?'Accepted labels do not establish that testing or submission occurred. Investigate the original records.':'Recorded and validated work must be submitted before review.')+'</p><button class="sw-primary" data-back>View work & evidence</button><hr class="sw-divider"><button disabled>Accept results</button> <small>Blocked: no submitted evidence package.</small></div>';q('[data-back]').onclick=()=>selectTab('work');return}
q('#sw-content').innerHTML='<div class="sw-panel"><div class="sw-row"><h2>Submission SUB-DEMO-07</h2><span class="sw-pill">'+(state.accepted||isReleased()?'Reviewed':'Awaiting review')+'</span></div><p class="sw-note">Submitted by Marcos A. · 2 frozen evidence versions</p><div class="sw-two">'+demoTasks.map((t,i)=>'<div><h3>'+t[0]+'</h3><p>'+t[2]+'</p><small>Attempt 1 · QC passed · method revision captured</small><p><button data-evidence="'+i+'">Inspect evidence</button></p></div>').join('')+'</div>'+(canReview()?'<hr class="sw-divider"><label class="sw-check"><input id="sw-check" type="checkbox"> I checked the submitted evidence, method and QC for both results.</label><div class="sw-actions"><button id="sw-accept" class="sw-primary" disabled>Accept 2 results</button><button id="sw-return">Return for correction</button></div>':'<p class="sw-note">'+(state.role!=='manager'?'Review decisions require an authorized reviewer.':'The original review decision is preserved.')+'</p>')+'</div>';
root.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{state.detail={kind:'evidence',index:Number(b.dataset.evidence)};render()});
if(canReview()){q('#sw-check').onchange=e=>q('#sw-accept').disabled=!e.target.checked;q('#sw-accept').onclick=()=>{state.accepted=true;render();say('2 results accepted in this simulation. No report has been released.')};q('#sw-return').onclick=()=>{state.detail={kind:'return'};render()}}
}
function request(){q('#sw-content').innerHTML='<div class="sw-two"><div class="sw-panel"><h2>Request & identity</h2><p>Soil · SOILFER-US · GTM-LAB1</p><span class="sw-label">Current request</span><p>'+(state.scenario==='historical'?'6 analyses · pH added in latest change':'MIR acquisition and soil pH · Revision 1')+'</p><span class="sw-label">Reception condition</span><p>'+(state.scenario==='historical'?'Open original intake record for verification':'Label matches request · container intact')+'</p><button id="sw-order" '+(['manager','reception'].includes(state.role)?'':'disabled')+'>Request analysis change</button></div><div class="sw-panel"><h2>Physical material</h2><p>'+(state.scenario==='disposed'?'Disposed · 0 g available':state.scenario==='historical'?'Location and quantity not recorded':'Container C-04 · 42 g available')+'</p><p class="sw-note">'+(state.scenario==='disposed'?'Disposal cannot be undone by changing the order.':'Record movement and availability separately from analytical review.')+'</p><span class="sw-label">Next custody action</span><p>'+(state.scenario==='disposed'?'Request recollection':state.scenario==='historical'?'Verify location and retained material':'Retrieve from Cabinet A / Tray 12')+'</p></div></div>'+(state.scenario==='intake'&&['manager','reception'].includes(state.role)?'<div class="sw-panel"><h2>Intake decision</h2><label class="sw-check"><input id="sw-intake-check" type="checkbox"> Identity, condition, quantity and requested methods checked</label><button id="sw-intake-accept" class="sw-primary" disabled>Accept intake</button><p><small>This creates work; it does not approve analytical results.</small></p></div>':'');q('#sw-order').onclick=()=>{state.detail={kind:'order'};render()};if(q('#sw-intake-check')){q('#sw-intake-check').onchange=e=>q('#sw-intake-accept').disabled=!e.target.checked;q('#sw-intake-accept').onclick=()=>{state.scenario='recorded';q('#sw-scenario').value='recorded';render();say('Simulated intake acceptance. Analytical review remains blocked.')};}}
function reports(){const released=isReleased();q('#sw-content').innerHTML='<div class="sw-panel"><div class="sw-row"><h2>'+(released?'Report v1':'Report preview')+'</h2><span class="sw-pill">'+(released?'Released · immutable snapshot':'DRAFT · not released')+'</span></div><p>'+(released?'Training certificate · authorized reviewer recorded · order revision 1':'A release will include only the exact accepted evidence versions.')+'</p><div class="sw-two"><div><h3>Included evidence</h3><p>'+(released||state.accepted?'pH 6.42 · Attempt 1<br>MIR spectrum · Acquisition record':'No release-ready evidence in this scenario')+'</p></div><div><h3>Release checks</h3><p>'+(released||state.accepted?'2/2 required lines covered<br>QC resolved · no omissions':'Blocked: current required evidence is not reviewed')+'</p></div></div>'+(!released?'<button id="sw-release" class="sw-primary" '+(canRelease()?'':'disabled')+'>Authorize & release report</button>':'<button id="sw-amend" '+(state.role==='manager'?'':'disabled')+'>Start amendment</button>')+'<hr class="sw-divider"><small>'+(released?'Corrections create a new version. Previous evidence and the released snapshot remain available.':'Generating or saving a preview does not publish, sign or supersede a report.')+'</small></div>';if(q('#sw-release'))q('#sw-release').onclick=()=>{state.scenario='released';q('#sw-scenario').value='released';render();say('Report v1 released in the simulation. The production platform was not changed.')};if(q('#sw-amend'))q('#sw-amend').onclick=()=>{state.detail={kind:'amend'};render()};}
function history(){const actual=state.scenario==='historical';q('#sw-content').innerHTML='<div class="sw-panel"><h2>Traceable history</h2><small>'+(actual?'Observed event summary · S003':'Illustrative training events')+'</small>'+ (actual?[['00:11 · Manager','pH added to the request'],['00:03 · Manager','Seven work items bulk accepted — evidence verification required'],['00:02 · Reception','Intake accepted; seven tasks generated']]:[[state.amendment?'Amendment A-01':'Current order revision 1',state.amendment?'Reason recorded; historical evidence retained':'MIR acquisition and pH requested'],['Submission SUB-DEMO-07','Exact evidence versions retained'],['Preparation','Drying and milling completion evidence linked'],['Intake','Identity, condition and request accepted']]).map(e=>'<div class="sw-history"><strong>'+e[0]+'</strong><div>'+e[1]+'</div></div>').join('')+'</div>'}
function renderDetail(){const d=state.detail;let html='<div class="sw-panel"><button id="sw-close">← Back</button><hr class="sw-divider">';
if(d.kind==='evidence'){
if(state.scenario==='historical'){html+='<h2>'+historyTasks[d.index]+'</h2><div class="sw-alert">No linked result or submission evidence shown</div><p>The historical acceptance event is retained. It cannot substitute for a worksheet, instrument export or submitted result.</p><h3>Investigation</h3><p>Locate original evidence; verify the sample, method, operator and acquisition date. Register verified legacy evidence with a review trail, or authorize new testing.</p><button disabled>Accept result</button>'}
else if(state.scenario==='intake'){html+='<h2>'+demoTasks[d.index][0]+'</h2><p>Work is blocked until intake acceptance and applicable preparation are complete.</p><button disabled>Record result</button>'}
else if(state.scenario==='recorded'&&state.role==='technician'){
html+='<h2>'+demoTasks[d.index][0]+' · Attempt 1</h2><p class="sw-note">DEMO-004 · Marcos A. · Draft only</p>'+(d.index===0?'<div class="sw-alert">Instrument-file workflow</div><p>Import the original spectrum, map the sample, inspect axes and QC, then record the acquisition.</p><button id="sw-load">Load illustrative spectrum</button><div id="sw-import"></div>':'<div class="sw-form"><label>pH · Water 1:5<input id="sw-value" inputmode="decimal" placeholder="Enter measured value"></label><small>Dimensionless · SOP-pH rev 2 · valid entry required</small><button id="sw-save" class="sw-primary">Save draft</button></div>')}
else{html+='<h2>'+demoTasks[d.index][0]+' · Evidence version 1</h2><p>'+demoTasks[d.index][1]+' · Marcos A. · Attempt 1</p>'+(d.index===0?chart()+'<div class="sw-two"><p>Source: DEMO-004-MIR.csv<br>3 replicates · QC passed</p><p>Signal: absorbance<br>Axis: wavenumber / cm⁻¹</p></div><small>Illustrative spectrum, not a measurement. No chemistry prediction is implied.</small>':'<h1>6.42 <small>pH</small></h1><p>Water 1:5 · Instrument qualification passed · QC batch verified</p>')+'<hr class="sw-divider"><p>Submitted evidence is locked. Corrections create a new attempt with an explicit reason.</p>'}
}else{
const order=d.kind==='order',ret=d.kind==='return';html+='<h2>'+(order?'Change requested analyses':ret?'Return for correction':'Start a report amendment')+'</h2>'+(state.scenario==='disposed'&&order?'<div class="sw-alert">New physical testing blocked: material disposed.</div><p>Request a linked replacement sample or verify an existing retained aliquot before authorizing new work.</p><button disabled>Add analytical work</button>':'<div class="sw-form">'+(order?'<label>Proposed change<select id="sw-change"><option>Add soil organic carbon</option><option>Cancel pending pH</option></select></label>':'')+'<label>Reason<textarea id="sw-reason" placeholder="Describe the request or specific correction needed"></textarea></label><div class="sw-alert"><strong>Impact preview</strong><div>'+(order?'Creates order revision 2. Existing evidence remains. Material and preparation must be checked.':ret?'Return only this submission for correction. The original evidence and review trail remain.':'Report v1 remains preserved. Affected evidence requires correction and renewed review before version 2 can be released.')+'</div></div><button id="sw-confirm" class="sw-primary" disabled>'+(order?'Submit change request':ret?'Return with reason':'Open amendment')+'</button></div>')}
q('#sw-content').innerHTML=html+'</div>';q('#sw-close').onclick=()=>{state.detail=null;render()};
if(q('#sw-reason')){q('#sw-reason').oninput=e=>q('#sw-confirm').disabled=e.target.value.trim().length<8;q('#sw-confirm').onclick=()=>{state.amendment=d.kind!=='order';if(d.kind==='return'){state.scenario='recorded';state.accepted=false;q('#sw-scenario').value='recorded'}state.detail=null;render();say(d.kind==='order'?'Change request saved for manager authorization in this simulation.':'Reason recorded; historical evidence preserved in this simulation.')}}
if(q('#sw-save'))q('#sw-save').onclick=()=>{const v=q('#sw-value').value.trim().replace(',','.');if(!v||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>14){say('Enter a numeric pH from 0 to 14 for this illustrative method. Blank is not zero.');return}state.saved=true;say('Draft saved: pH '+v+'. Recording completion and submission remain separate actions.')};
if(q('#sw-load'))q('#sw-load').onclick=()=>{q('#sw-import').innerHTML=chart()+'<p>DEMO-004 matched · 3 replicates · axis units verified · QC passed</p><button id="sw-record" class="sw-primary">Record illustrative acquisition</button>';q('#sw-record').onclick=()=>{state.saved=true;say('Illustrative acquisition recorded. It still needs submission and review.')}};
}
function chart(){return '<svg class="sw-chart" viewBox="0 0 600 150" role="img" aria-label="Illustrative MIR spectrum, absorbance against wavenumber"><line x1="35" y1="120" x2="570" y2="120" stroke="currentColor" opacity=".3"/><path d="M35 89 L65 85 L90 82 L120 50 L135 38 L150 70 L180 78 L220 75 L250 73 L280 68 L310 60 L335 76 L365 55 L390 32 L410 63 L440 75 L460 69 L480 49 L500 80 L530 85 L570 87" fill="none" stroke="currentColor" stroke-width="2"/><text x="35" y="143" fill="currentColor" font-size="12">4000 cm⁻¹</text><text x="505" y="143" fill="currentColor" font-size="12">400 cm⁻¹</text><text x="35" y="17" fill="currentColor" font-size="12">Absorbance · illustrative</text></svg>'}
q('#sw-scenario').onchange=e=>{state.scenario=e.target.value;state.accepted=false;state.saved=false;state.amendment=false;state.detail=null;state.tab='work';say('');render()};q('#sw-role').onchange=e=>{state.role=e.target.value;state.detail=null;say('');render()};root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));q('#sw-next-button').onclick=()=>{if(state.scenario==='historical')selectTab('work');else if(['intake','disposed'].includes(state.scenario))selectTab('request');else if(isReleased()||state.accepted)selectTab('reports');else if(state.scenario==='submitted')selectTab('review');else{state.detail={kind:'evidence',index:1};render()}};
