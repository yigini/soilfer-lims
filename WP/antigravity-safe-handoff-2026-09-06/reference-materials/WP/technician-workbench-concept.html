<style>
#technician-bench{--wb-bg:light-dark(#f5f7f8,#101923);--wb-panel:light-dark(#fff,#192530);--wb-soft:light-dark(#eef3f5,#21313f);--wb-text:light-dark(#18313c,#e7eff4);--wb-muted:light-dark(#536b77,#b0c1cc);--wb-line:light-dark(#d5e0e5,#354856);--wb-green:light-dark(#146b54,#80d8b7);--wb-green-soft:light-dark(#e5f4ed,#193d35);--wb-blue:light-dark(#2556a5,#a7c5ff);--wb-blue-soft:light-dark(#eaf0ff,#233c5b);--wb-red:light-dark(#a02e35,#ffb0b4);--wb-red-soft:light-dark(#fff0f0,#442930);--wb-amber:light-dark(#805800,#efd08c);--wb-amber-soft:light-dark(#fff5dc,#443b24);font:14px/1.45 Inter,"Segoe UI",sans-serif;color:var(--wb-text);background:var(--wb-bg);border:1px solid var(--wb-line);border-radius:14px;overflow:hidden;color-scheme:light dark}
#technician-bench *{box-sizing:border-box}#technician-bench button,#technician-bench input,#technician-bench select,#technician-bench textarea{font:inherit;color:inherit}#technician-bench button{cursor:pointer}#technician-bench button:disabled{cursor:not-allowed;opacity:.55}#technician-bench [hidden]{display:none!important}#technician-bench h2,#technician-bench h3,#technician-bench p{margin:0}#technician-bench h2{font-size:24px;font-weight:500;letter-spacing:-.7px}#technician-bench h3{font-size:17px;font-weight:500;letter-spacing:-.2px}#technician-bench .wb-shell{display:grid;grid-template-columns:48px minmax(0,1fr)}#technician-bench .wb-rail{background:var(--wb-panel);border-right:1px solid var(--wb-line);padding:17px 8px;display:flex;flex-direction:column;align-items:center;gap:26px;color:var(--wb-muted)}#technician-bench .wb-mark{font-size:22px;color:var(--wb-green);font-weight:500}#technician-bench .wb-rail i{width:18px;height:18px}#technician-bench .wb-active-icon{background:var(--wb-green-soft);color:var(--wb-green);padding:8px;border-radius:8px}#technician-bench .wb-ribbon{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 20px;font-size:11px;color:var(--wb-muted);border-bottom:1px solid var(--wb-line);background:var(--wb-panel)}#technician-bench .wb-header{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--wb-panel)}#technician-bench .wb-sub{font-size:12px;color:var(--wb-muted);margin-top:5px}#technician-bench .wb-sync{font-size:12px;color:var(--wb-green);display:flex;align-items:center;gap:6px}#technician-bench .wb-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 20px 14px;background:var(--wb-panel)}#technician-bench .wb-tabs button{font-size:12px;padding:8px 11px;border:0;border-radius:7px;background:transparent;color:var(--wb-muted)}#technician-bench .wb-tabs button[aria-pressed=true]{background:var(--wb-green-soft);color:var(--wb-green)}#technician-bench .wb-body{padding:18px 20px 20px;border-top:1px solid var(--wb-line);min-width:0}#technician-bench .wb-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}#technician-bench .wb-toolbar .wb-spacer{flex:1}#technician-bench .wb-button{border:1px solid var(--wb-line);border-radius:7px;background:var(--wb-panel);padding:8px 11px;font-size:12px;display:inline-flex;justify-content:center;gap:7px;align-items:center}#technician-bench .wb-primary{background:var(--wb-green);color:light-dark(#fff,#09251d);border-color:var(--wb-green)}#technician-bench .wb-small{font-size:11px;color:var(--wb-muted)}#technician-bench .wb-pill{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;background:var(--wb-soft);color:var(--wb-muted);line-height:1.5}#technician-bench .wb-pill.good{background:var(--wb-green-soft);color:var(--wb-green)}#technician-bench .wb-pill.info{background:var(--wb-blue-soft);color:var(--wb-blue)}#technician-bench .wb-pill.bad{background:var(--wb-red-soft);color:var(--wb-red)}#technician-bench .wb-pill.warn{background:var(--wb-amber-soft);color:var(--wb-amber)}#technician-bench .wb-method{padding:14px 16px;background:var(--wb-panel);border:1px solid var(--wb-line);border-radius:9px 9px 0 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#technician-bench .wb-field{border:1px solid var(--wb-line);border-radius:6px;background:var(--wb-panel);padding:8px 9px;min-width:0;max-width:100%;font-size:13px}#technician-bench .wb-search{width:185px}#technician-bench .wb-workarea{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:16px;align-items:start}#technician-bench .wb-sheet{min-width:0}#technician-bench .wb-table{width:100%;border-collapse:collapse;background:var(--wb-panel);font-size:12px}#technician-bench .wb-table th{text-align:left;padding:11px 9px;font-size:11px;font-weight:500;color:var(--wb-muted);background:var(--wb-soft)}#technician-bench .wb-table td{padding:13px 9px;border-bottom:1px solid var(--wb-line);vertical-align:middle}#technician-bench .wb-table tr[data-selected=true]{background:var(--wb-blue-soft)}#technician-bench .wb-table input[type=checkbox]{accent-color:var(--wb-green);width:15px;height:15px}#technician-bench .wb-result{width:88px;font-size:15px;font-variant-numeric:tabular-nums;background:var(--wb-panel);border:1px solid var(--wb-line);padding:8px;border-radius:6px}#technician-bench .wb-result[aria-invalid=true]{border-color:var(--wb-red)}#technician-bench .wb-texture-input{width:64px}#technician-bench .wb-sample{font-weight:500;white-space:nowrap}#technician-bench .wb-hint{font-size:11px;color:var(--wb-muted);margin-top:4px;max-width:170px}#technician-bench .wb-details-btn{background:transparent;border:0;padding:6px;color:var(--wb-blue);font-size:12px}#technician-bench .wb-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 15px;background:var(--wb-panel);border:1px solid var(--wb-line);border-top:0;border-radius:0 0 9px 9px}#technician-bench .wb-inspector{padding:16px;border:1px solid var(--wb-line);background:var(--wb-panel);border-radius:9px;min-width:0}#technician-bench .wb-inspector p{font-size:12px;color:var(--wb-muted);line-height:1.65;margin:10px 0}#technician-bench .wb-inspector-section{border-top:1px solid var(--wb-line);margin-top:15px;padding-top:13px}#technician-bench .wb-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--wb-muted);margin-bottom:8px}#technician-bench .wb-inspector label{display:grid;gap:5px;font-size:11px;color:var(--wb-muted);margin-top:10px}#technician-bench .wb-inspector .wb-field{width:100%;font-size:12px}#technician-bench .wb-wide{width:100%;margin-top:9px}#technician-bench .wb-message{padding:11px 13px;border-radius:7px;background:var(--wb-blue-soft);color:var(--wb-blue);font-size:12px;margin-bottom:13px;line-height:1.55}#technician-bench .wb-warning{background:var(--wb-amber-soft);color:var(--wb-amber)}#technician-bench .wb-error{background:var(--wb-red-soft);color:var(--wb-red)}#technician-bench .wb-check{display:flex;align-items:flex-start;gap:9px;margin:13px 0;font-size:12px}#technician-bench .wb-check input{accent-color:var(--wb-green);margin-top:3px}#technician-bench .wb-preflight{background:var(--wb-panel);border:1px solid var(--wb-line);border-radius:10px;padding:20px}#technician-bench .wb-review-item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--wb-line);font-size:13px}#technician-bench .wb-review-item:last-child{border-bottom:0}#technician-bench .wb-review-value{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}#technician-bench .wb-action-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:17px}#technician-bench .wb-paste{padding:16px;background:var(--wb-panel);border:1px solid var(--wb-line);border-radius:9px;margin-bottom:15px}#technician-bench textarea.wb-field{width:100%;min-height:98px;font-family:ui-monospace,monospace;font-size:12px}#technician-bench .wb-queue-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}#technician-bench .wb-queue-filters button[aria-pressed=true]{border-color:var(--wb-green);background:var(--wb-green-soft);color:var(--wb-green)}#technician-bench .wb-event{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--wb-line);font-size:12px}#technician-bench .wb-status-message{margin-top:14px;min-height:18px;font-size:12px;color:var(--wb-green)}#technician-bench .wb-prep{padding:18px;background:var(--wb-panel);border:1px solid var(--wb-line);border-radius:0 0 9px 9px}#technician-bench[data-density=compact] .wb-table td{padding-top:8px;padding-bottom:8px}#technician-bench .wb-mobile-label{display:none}
@media(max-width:860px){#technician-bench .wb-workarea{grid-template-columns:1fr}#technician-bench .wb-inspector{display:grid;grid-template-columns:1fr 1fr;gap:20px}#technician-bench .wb-inspector-section{margin-top:0}#technician-bench .wb-result{width:100px}}
@media(max-width:540px){#technician-bench .wb-shell{grid-template-columns:1fr}#technician-bench .wb-rail{display:none}#technician-bench .wb-ribbon,#technician-bench .wb-header,#technician-bench .wb-body{padding:14px}#technician-bench .wb-tabs{padding:0 14px 12px}#technician-bench .wb-inspector{display:block}#technician-bench .wb-inspector-section{margin-top:15px}#technician-bench .wb-table thead{display:none}#technician-bench .wb-table,#technician-bench .wb-table tbody{display:block}#technician-bench .wb-table tr{display:flex;flex-wrap:wrap;align-items:center;padding:10px 5px;border-bottom:1px solid var(--wb-line);gap:4px}#technician-bench .wb-table td{display:block;border:0;padding:6px;max-width:100%}#technician-bench .wb-table td.wb-state-cell{flex:1;min-width:140px}#technician-bench .wb-table td.wb-texture-cell{width:27%}#technician-bench .wb-mobile-label{display:block;font-size:11px;color:var(--wb-muted);margin-bottom:4px}#technician-bench .wb-result{width:105px;font-size:16px}#technician-bench .wb-texture-input{width:100%}#technician-bench .wb-table td.wb-sample-cell{min-width:190px}#technician-bench .wb-review-item{flex-wrap:wrap}#technician-bench .wb-search{flex:1;min-width:140px}#technician-bench .wb-method{padding:13px}#technician-bench .wb-preflight{padding:14px}#technician-bench .wb-field{font-size:16px}#technician-bench .wb-inspector .wb-field{font-size:16px}#technician-bench .wb-event{grid-template-columns:45px 1fr}}
@media(pointer:coarse){#technician-bench button,#technician-bench select{min-height:44px}}
</style>
<div class="wb-shell"><aside class="wb-rail" aria-label="Application navigation sketch"><span class="wb-mark">S</span><i data-lucide="layout-dashboard" aria-hidden="true"></i><span class="wb-active-icon"><i data-lucide="flask-conical" aria-hidden="true"></i></span><i data-lucide="list-checks" aria-hidden="true"></i><i data-lucide="activity" aria-hidden="true"></i></aside><main>
<div class="wb-ribbon"><span>SoilFER LIMS / Technician workspace</span><span>Interactive concept · illustrative records · no LIMS connection</span></div>
<div class="wb-header"><div><h2>My workbench</h2><p class="wb-sub">Demo laboratory · Your assigned work, from entry to handoff</p></div><div class="wb-sync" data-save-summary aria-live="polite"></div></div>
<nav class="wb-tabs" aria-label="Workbench sections"><button type="button" data-view="queue">My queue</button><button type="button" data-view="worksheet">Worksheet</button><button type="button" data-view="submit">Review & submit <span data-submit-count></span></button><button type="button" data-view="activity">Activity</button></nav>
<div class="wb-body"><div data-screen></div><div class="wb-status-message" data-message role="status"></div><p class="wb-small" style="margin-top:12px">All edits and actions stay inside this demonstration and reset on reload.</p></div>
</main></div>
<script>
(()=>{
const root=document.getElementById('technician-bench'),screen=root.querySelector('[data-screen]');
const state={view:'worksheet',method:'ph',selected:'D-101',search:'',filter:'all',network:'online',density:'comfortable',reviewIds:[],reviewMode:'record',paste:false,pasteRows:[],confirmation:false};
const rows=[
{id:'D-101',method:'ph',value:'6.42',sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'PH-07',version:1,selected:true},
{id:'D-102',method:'ph',value:'',sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'PH-07',version:1,selected:true},
{id:'D-103',method:'ph',value:'15.2',sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'PH-07',version:1,selected:false},
{id:'D-104',method:'ph',value:'',sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'PH-07',version:1,gate:'Preparation incomplete',selected:false},
{id:'D-105',method:'ph',value:'6.80',remote:'6.90',sync:'conflict',stage:'draft',basis:'Air-dry',rep:'1',instrument:'PH-07',version:1,selected:false},
{id:'D-201',method:'texture',values:['40','40','20'],sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'HYD-02',version:1,selected:true},
{id:'D-202',method:'texture',values:['50','20','20'],sync:'saved',stage:'draft',basis:'Air-dry',rep:'1',instrument:'HYD-02',version:1,selected:true},
{id:'D-301',method:'prep',checks:[true,false,false],sync:'saved',stage:'draft',basis:'Not applicable',rep:'1',instrument:'PREP-02',version:1,selected:true}
];
const methods={ph:{name:'pH in water',code:'DEMO-PH-01 · revision 3',unit:'pH',note:'Illustrative method range 0–14 · decimal point or comma accepted'},texture:{name:'Texture fractions',code:'DEMO-TEX-01 · revision 2',unit:'%',note:'Illustrative closure rule: sand + silt + clay = 100% ± 2%'},prep:{name:'Milling & sieving',code:'DEMO-PREP-01 · revision 1',unit:'',note:'Illustrative checklist · drying prerequisite satisfied'}};
let events=[{time:'09:12',text:'D-105 has a newer saved result. Your 6.80 draft is preserved for comparison.'},{time:'09:10',text:'Worksheet opened with five pH tasks, two texture sets and one preparation task.'}],timers={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=id=>rows.find(r=>r.id===id);
function parse(v){const t=String(v??'').trim();if(!t)return {blank:true};if(!/^-?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(t))return {error:'Enter a number; keep units in the unit field'};const n=Number(t.replace(',','.'));return Number.isFinite(n)?{n}:{error:'Enter a finite number'};}
function validation(r){if(r.stage==='completed')return {tone:'good',label:'Task completed',why:'Preparation recorded; downstream readiness recalculated',eligible:false};if(r.stage==='submitted')return {tone:'info',label:'Awaiting review',why:'Submitted and read-only',eligible:false};if(r.stage==='recorded')return {tone:'good',label:'Recorded',why:'Not yet submitted for review',eligible:false};if(r.remote!==undefined)return {tone:'warn',label:'Resolve conflict',why:'A newer saved value exists',eligible:false};if(r.gate)return {tone:'warn',label:'Blocked',why:r.gate,eligible:false};if(r.method==='prep'){const n=r.checks.filter(Boolean).length;return {tone:n===3?'good':'',label:n===3?'Ready to record':'Checklist incomplete',why:n+' / 3 checks confirmed',eligible:n===3};}if(r.instrument==='PH-02')return {tone:'warn',label:'Instrument blocked',why:'PH-02 calibration overdue',eligible:false};if(r.method==='texture'){const p=r.values.map(parse);if(p.some(v=>v.blank))return {tone:'',label:'Missing fraction',why:'All three fractions are required',eligible:false};if(p.some(v=>v.error||v.n<0||v.n>100))return {tone:'bad',label:'Check fraction',why:'Each fraction must be 0–100%',eligible:false};const total=p.reduce((a,v)=>a+v.n,0),ok=Math.abs(total-100)<=2;return {tone:ok?'good':'bad',label:ok?'Closure passes':'Closure fails',why:'Total '+total.toFixed(1)+'% · target 98–102%',eligible:ok};}const p=parse(r.value);if(p.blank)return {tone:'',label:'Needs result',why:'Blank is not zero',eligible:false};if(p.error)return {tone:'bad',label:'Invalid format',why:p.error,eligible:false};if(p.n<0||p.n>14)return {tone:'bad',label:'Outside method range',why:'Retain the value; investigate with supervisor',eligible:false};return {tone:'good',label:'Ready to record',why:String(r.value).includes(',')?'Interpreted as '+p.n:'Within illustrative method range',eligible:true};}
function pill(v){return '<span class="wb-pill '+v.tone+'">'+esc(v.label)+'</span>';}
function message(t){root.querySelector('[data-message]').textContent=t;}
function log(t){events.unshift({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),text:t});}
function summary(){const dirty=rows.filter(r=>r.sync==='saving'||r.sync==='unsaved'||r.sync==='offline').length,conflicts=rows.filter(r=>r.remote!==undefined).length;root.querySelector('[data-save-summary]').textContent=state.network==='offline'?'Offline · edits remain on this page':dirty?dirty+' draft'+(dirty===1?'':'s')+' saving…':conflicts?'Drafts saved · '+conflicts+' conflict needs attention':'✓ Drafts saved in demo';root.querySelector('[data-submit-count]').textContent='('+rows.filter(r=>r.stage==='recorded').length+')';}
function saveDraft(r){if(timers[r.id])clearTimeout(timers[r.id]);r.version++;const v=r.version;r.sync=state.network==='offline'?'offline':'saving';summary();refreshRow(r);if(state.network==='offline')return;timers[r.id]=setTimeout(()=>{if(state.network==='offline'){r.sync='offline';summary();refreshRow(r);return;}if(r.version===v&&r.remote===undefined){r.sync='saved';summary();refreshRow(r);if(state.view==='review'&&state.reviewMode==='record'){state.confirmation=false;render();}}},650);}
function refreshRow(r){const cell=screen.querySelector('[data-row-state="'+r.id+'"]');if(cell){const v=validation(r);cell.innerHTML=pill(v)+'<div class="wb-hint">'+esc(v.why)+'</div><div class="wb-hint">'+(r.sync==='saving'?'Saving draft…':r.sync==='offline'?'Not saved remotely':r.sync==='conflict'?'Both versions retained':'Draft saved')+'</div>';}screen.querySelectorAll('[data-input-id="'+r.id+'"]').forEach(el=>el.setAttribute('aria-invalid',String(validation(r).tone==='bad')));}
function select(id){state.selected=id;screen.querySelectorAll('[data-row]').forEach(el=>el.dataset.selected=String(el.dataset.row===id));drawInspector();}
function inspectorHTML(r){const v=validation(r),locked=r.stage!=='draft';let body='<div><div class="wb-eyebrow">Selected sample</div><h3>'+esc(r.id)+'</h3><p>'+esc(methods[r.method].name)+' · '+esc(methods[r.method].code)+'</p>'+pill(v)+'<p>'+esc(v.why)+'</p><div class="wb-inspector-section"><div class="wb-eyebrow">Prerequisites</div><p>'+(r.gate?'△ '+esc(r.gate)+'<br>Next owner: preparation team':'✓ Intake accepted<br>✓ Drying complete'+(r.method==='prep'?'':'<br>✓ Preparation complete'))+'</p></div></div><div>';
if(r.remote!==undefined){body+='<div class="wb-eyebrow">Compare before saving</div><p>Your draft: <strong>'+esc(r.value)+'</strong><br>Newer saved value: <strong>'+esc(r.remote)+'</strong></p><label>Reason for retaining your draft<textarea class="wb-field" data-conflict-reason aria-label="Reason for keeping local draft" rows="2">'+esc(r.reason||'')+'</textarea></label><button type="button" class="wb-button wb-wide" data-use-remote>Use saved '+esc(r.remote)+'</button><button type="button" class="wb-button wb-wide" data-keep-local>Keep my draft with reason</button>';}else if(r.method!=='prep'){body+='<label>Result basis<select class="wb-field" data-meta="basis" '+(locked?'disabled':'')+'>'+['Air-dry','Oven-dry','Field-moist'].map(x=>'<option '+(x===r.basis?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Replicate<select class="wb-field" data-meta="rep" '+(locked?'disabled':'')+'>'+['1','2','3'].map(x=>'<option '+(x===r.rep?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Instrument<select class="wb-field" data-meta="instrument" '+(locked?'disabled':'')+'>'+((r.method==='ph')?'<option value="PH-07" '+(r.instrument==='PH-07'?'selected':'')+'>PH-07 · ready</option><option value="PH-02" '+(r.instrument==='PH-02'?'selected':'')+'>PH-02 · calibration overdue</option>':'<option>HYD-02</option>')+'</select></label>';}else{body+='<div class="wb-eyebrow">Task evidence</div><p>Preparation task completion uses a checklist. It does not create an invented numeric analytical result.</p>';}
body+='<div class="wb-inspector-section"><div class="wb-eyebrow">Quality & handoff</div><p>'+(r.method==='prep'?'Completion unlocks eligible downstream analyses.':'Recording is separate from submitting. QC and reviewer acceptance remain separate decisions.')+'</p></div></div>';return body;}
function drawInspector(){const el=screen.querySelector('[data-inspector]');if(!el)return;const r=row(state.selected);el.innerHTML=inspectorHTML(r);el.querySelectorAll('[data-meta]').forEach(input=>input.onchange=()=>{r[input.dataset.meta]=input.value;saveDraft(r);drawInspector();});const remote=el.querySelector('[data-use-remote]');if(remote)remote.onclick=()=>{r.value=r.remote;delete r.remote;r.sync='saved';log(r.id+': adopted newer saved value; local version retained in demo history.');render();};const keep=el.querySelector('[data-keep-local]');if(keep)keep.onclick=()=>{const reason=el.querySelector('[data-conflict-reason]').value.trim();if(!reason){message('Add a reason before retaining your conflicting draft.');return;}r.reason=reason;delete r.remote;saveDraft(r);log(r.id+': conflict reviewed; kept draft with reason: '+reason);render();};}
function filtered(){return rows.filter(r=>r.method===state.method&&(!state.search||r.id.toLowerCase().includes(state.search.toLowerCase())));}
function input(r,index){const value=index===undefined?r.value:r.values[index];return '<input class="wb-result '+(index!==undefined?'wb-texture-input':'')+'" type="text" inputmode="decimal" aria-label="'+esc(r.id)+' '+(index===undefined?'result':['sand','silt','clay'][index])+'" data-input-id="'+r.id+'" '+(index!==undefined?'data-fraction="'+index+'"':'')+' value="'+esc(value)+'" '+(r.gate||r.stage!=='draft'?'disabled':'')+' aria-invalid="'+(validation(r).tone==='bad')+'">';}
function worksheet(){const m=methods[state.method],rs=filtered();return '<div class="wb-toolbar"><label><span class="wb-small">Analysis </span><select class="wb-field" data-method>'+Object.entries(methods).map(([id,v])=>'<option value="'+id+'" '+(id===state.method?'selected':'')+'>'+v.name+'</option>').join('')+'</select></label><span class="wb-spacer"></span><input class="wb-field wb-search" data-search aria-label="Find a sample" placeholder="Find sample ID" value="'+esc(state.search)+'">'+(state.method==='ph'?'<button type="button" class="wb-button" data-paste-toggle>Paste values</button>':'')+'</div>'+(state.paste?pasteHTML():'')+'<div class="wb-workarea"><section class="wb-sheet"><div class="wb-method"><div><h3>'+m.name+'</h3><div class="wb-sub">'+m.code+'</div></div><span class="wb-pill">'+(m.unit?'Unit: '+m.unit:'Task checklist')+'</span><p class="wb-small" style="width:100%">'+m.note+'</p></div>'+(state.method==='prep'?prepHTML(rs):'<table class="wb-table"><thead><tr><th><input type="checkbox" aria-label="Select visible rows" data-select-all '+(rs.length&&rs.every(r=>r.selected)?'checked':'')+'></th><th>Sample</th>'+(state.method==='texture'?'<th>Sand %</th><th>Silt %</th><th>Clay %</th>':'<th>Result</th>')+'<th>Readiness & save state</th><th><span class="wb-small">Details</span></th></tr></thead><tbody>'+rs.map(r=>'<tr data-row="'+r.id+'" data-selected="'+(state.selected===r.id)+'"><td><input type="checkbox" aria-label="Select '+r.id+'" data-select="'+r.id+'" '+(r.selected?'checked':'')+' '+(r.stage!=='draft'?'disabled':'')+'></td><td class="wb-sample-cell"><span class="wb-sample">'+r.id+'</span><div class="wb-hint">Demo project</div></td>'+(state.method==='texture'?[0,1,2].map(i=>'<td class="wb-texture-cell"><span class="wb-mobile-label">'+['Sand','Silt','Clay'][i]+' %</span>'+input(r,i)+'</td>').join(''):'<td>'+input(r)+'</td>')+'<td class="wb-state-cell" data-row-state="'+r.id+'">'+pill(validation(r))+'<div class="wb-hint">'+esc(validation(r).why)+'</div><div class="wb-hint">'+(r.sync==='saved'?'Draft saved':r.sync==='conflict'?'Both versions retained':'Saving…')+'</div></td><td><button type="button" class="wb-details-btn" data-inspect="'+r.id+'" aria-label="Inspect '+r.id+'">Inspect →</button></td></tr>').join('')+'</tbody></table><div class="wb-footer"><span class="wb-small"><span data-selection-count>'+rs.filter(r=>r.selected&&r.stage==='draft').length+' selected</span> · Enter moves to the next value</span><button type="button" class="wb-button wb-primary" data-review-record>Review completion →</button></div>')+'</section><aside class="wb-inspector" aria-label="Selected result context" data-inspector></aside></div>';}
function prepHTML(rs){const r=rs[0];if(!r)return '<div class="wb-prep">No matching preparation task.</div>';return '<div class="wb-prep"><span class="wb-pill good">✓ Drying complete</span><h3 style="margin-top:13px">'+r.id+'</h3><p class="wb-sub">Confirm the performed steps from the applicable SOP.</p>'+['Dried sample identity verified','Milling and sieving completed','Container identity checked'].map((t,i)=>'<label class="wb-check"><input type="checkbox" data-prep="'+i+'" '+(r.checks[i]?'checked':'')+' '+(r.stage!=='draft'?'disabled':'')+'>'+t+'</label>').join('')+'<div data-row-state="'+r.id+'">'+pill(validation(r))+'</div><div class="wb-action-row"><button type="button" class="wb-button wb-primary" data-review-record>Review task completion →</button></div></div>';}
function queueHTML(){const visible=rows.filter(r=>state.filter==='all'||(state.filter==='attention'&&!validation(r).eligible&&r.stage==='draft')||(state.filter==='ready'&&validation(r).eligible)||(state.filter==='recorded'&&r.stage==='recorded'));return '<div class="wb-toolbar"><h3>Your next work</h3><span class="wb-spacer"></span><span class="wb-small">'+rows.length+' assigned demo work units</span></div><div class="wb-queue-filters">'+[['all','All work'],['ready','Ready to record'],['attention','Needs attention'],['recorded','Ready to submit']].map(([id,t])=>'<button type="button" class="wb-button" data-filter="'+id+'" aria-pressed="'+(state.filter===id)+'">'+t+'</button>').join('')+'</div><div class="wb-preflight">'+visible.map(r=>'<div class="wb-review-item"><div><strong>'+r.id+'</strong><p class="wb-sub">'+methods[r.method].name+'</p></div><div>'+pill(validation(r))+'<div class="wb-hint">'+esc(validation(r).why)+'</div></div><button type="button" class="wb-button" data-open="'+r.id+'">Open →</button></div>').join('')+(visible.length?'':'<p class="wb-sub">No work matches this view.</p>')+'</div>';}
function valText(r){return r.method==='ph'?esc(r.value)+' pH':r.method==='texture'?r.values.map(esc).join(' / ')+' %':r.checks.filter(Boolean).length+'/3 checks';}
function readyRecord(r){return validation(r).eligible&&r.sync==='saved'&&state.network==='online';}
function reviewHTML(){const isSubmit=state.reviewMode==='submit',rs=isSubmit?rows.filter(r=>r.stage==='recorded'):state.reviewIds.map(row).filter(Boolean),eligible=isSubmit?rs:rs.filter(readyRecord);return '<div class="wb-toolbar"><h3>'+(isSubmit?'Review before submitting':'Review before recording')+'</h3><span class="wb-spacer"></span><button type="button" class="wb-button" data-back-sheet>Back to worksheet</button></div><div class="wb-message">'+(isSubmit?'Submission sends the listed results for review and makes them read-only. Each sample receives its own submission record.':'Record only the eligible items listed below. Excluded items remain drafts. Recording does not submit or approve a result.')+'</div><div class="wb-preflight">'+(rs.length?rs.map(r=>'<div class="wb-review-item"><div><strong>'+r.id+'</strong><p class="wb-sub">'+methods[r.method].name+' · '+esc(r.basis)+' · R'+r.rep+'</p><p class="wb-small">'+esc(r.instrument)+'</p></div><span class="wb-review-value">'+valText(r)+'</span><div>'+pill(isSubmit?{tone:'good',label:'Ready for submission'}:readyRecord(r)?{tone:'good',label:'Included'}:{tone:'warn',label:'Excluded'})+'<p class="wb-hint">'+(isSubmit?'Recorded, not yet submitted':readyRecord(r)?'Identity and readiness checked':esc(validation(r).why)+(r.sync!=='saved'?' · save or resolve draft first':''))+'</p></div></div>').join(''):'<p class="wb-sub">No recorded results are waiting for submission. Record eligible worksheet results first.</p>')+(rs.length?'<label class="wb-check"><input type="checkbox" data-confirm>I checked the sample IDs, method, values and metadata shown above.</label>':'')+'<div class="wb-action-row"><span class="wb-small" style="margin-right:auto">'+eligible.length+' included'+(!isSubmit?' · '+(rs.length-eligible.length)+' excluded':'')+'</span><button type="button" class="wb-button wb-primary" data-commit disabled>'+(isSubmit?'Submit '+eligible.length+' for review':'Record '+eligible.length+' eligible '+(eligible.length===1?'item':'items'))+'</button></div></div>';}
function pasteHTML(){return '<div class="wb-paste"><h3>Paste by sample ID</h3><p class="wb-sub">Tab-separated sample ID and result. Preview matches before changing any draft.</p><textarea class="wb-field" aria-label="Paste sample IDs and values" data-paste-text style="margin-top:10px">D-101\t6.55\nD-102\t7.12\nD-999\t6.00</textarea><div class="wb-action-row"><button type="button" class="wb-button" data-paste-preview>Preview matches</button></div><div data-paste-preview-list></div></div>';}
function render(){root.dataset.density=state.density;root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view||(state.view==='review'&&b.dataset.view==='submit'))));summary();screen.innerHTML=state.view==='worksheet'?worksheet():state.view==='queue'?queueHTML():state.view==='review'?reviewHTML():'<h3>Activity</h3><p class="wb-sub">Demo receipts and changes</p>'+events.map(e=>'<div class="wb-event"><span class="wb-small">'+esc(e.time)+'</span><span>'+esc(e.text)+'</span></div>').join('');wire();if(state.view==='worksheet')drawInspector();}
function wire(){screen.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=row(b.dataset.open);state.method=r.method;state.selected=r.id;state.view='worksheet';state.search='';render();});screen.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render();});const method=screen.querySelector('[data-method]');if(method)method.onchange=()=>{state.method=method.value;state.selected=rows.find(r=>r.method===state.method).id;state.search='';state.paste=false;render();};const search=screen.querySelector('[data-search]');if(search)search.onchange=()=>{state.search=search.value;render();};screen.querySelectorAll('[data-input-id]').forEach(el=>{el.oninput=()=>{const r=row(el.dataset.inputId);if(el.dataset.fraction!==undefined)r.values[Number(el.dataset.fraction)]=el.value;else r.value=el.value;if(r.remote!==undefined){r.sync='conflict';refreshRow(r);}else saveDraft(r);};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const inputs=[...screen.querySelectorAll('[data-input-id]:not(:disabled)')],next=inputs[inputs.indexOf(el)+1];if(next)next.focus();else screen.querySelector('[data-review-record]')?.focus();}};});screen.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{row(el.dataset.select).selected=el.checked;const count=screen.querySelector('[data-selection-count]');if(count)count.textContent=filtered().filter(r=>r.selected&&r.stage==='draft').length+' selected';});const all=screen.querySelector('[data-select-all]');if(all)all.onchange=()=>{filtered().filter(r=>r.stage==='draft').forEach(r=>r.selected=all.checked);render();};screen.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>select(b.dataset.inspect));screen.querySelectorAll('[data-prep]').forEach(el=>el.onchange=()=>{const r=rows.find(r=>r.method==='prep');r.checks[Number(el.dataset.prep)]=el.checked;saveDraft(r);});const record=screen.querySelector('[data-review-record]');if(record)record.onclick=()=>{state.reviewIds=filtered().filter(r=>r.selected&&r.stage==='draft').map(r=>r.id);if(!state.reviewIds.length){message('Select at least one draft to review.');return;}state.reviewMode='record';state.view='review';state.confirmation=false;render();};const back=screen.querySelector('[data-back-sheet]');if(back)back.onclick=()=>{state.view='worksheet';render();};const confirm=screen.querySelector('[data-confirm]');if(confirm)confirm.onchange=()=>{state.confirmation=confirm.checked;const candidates=state.reviewMode==='submit'?rows.filter(r=>r.stage==='recorded'):state.reviewIds.map(row).filter(readyRecord);screen.querySelector('[data-commit]').disabled=!confirm.checked||!candidates.length||state.network!=='online';};const commit=screen.querySelector('[data-commit]');if(commit)commit.onclick=()=>{if(!state.confirmation||state.network!=='online')return;const submitting=state.reviewMode==='submit',valid=submitting?rows.filter(r=>r.stage==='recorded'):state.reviewIds.map(row).filter(readyRecord);if(!valid.length){message('No eligible items remain. Review the current state.');return;}valid.forEach(r=>{r.stage=submitting?'submitted':r.method==='prep'?'completed':'recorded';r.selected=false;});log(valid.map(r=>r.id).join(', ')+(submitting?': submitted for reviewer decision.':': recorded successfully; not submitted.'));message(submitting?valid.length+' demo items submitted. No production data was sent.':valid.length+' demo items recorded. Continue to Review & submit for the handoff.');state.reviewMode='submit';state.view='review';state.confirmation=false;render();};const paste=screen.querySelector('[data-paste-toggle]');if(paste)paste.onclick=()=>{state.paste=!state.paste;render();};const preview=screen.querySelector('[data-paste-preview]');if(preview)preview.onclick=()=>{const text=screen.querySelector('[data-paste-text]').value;const seen=new Set();state.pasteRows=text.split(/\r?\n/).filter(x=>x.trim()).map(line=>{const cols=line.split('\t'),id=(cols[0]||'').trim(),value=(cols[1]||'').trim(),r=row(id),p=parse(value);let error=cols.length!==2?'Expected two tab-separated columns':seen.has(id)?'Duplicate ID in pasted data':!r||r.method!=='ph'?'No matching pH task':r.stage!=='draft'?'Read-only result':r.gate?'Preparation blocked':r.remote!==undefined?'Resolve existing conflict first':p.blank||p.error?'Invalid or blank number':'';seen.add(id);return {id,value,error};});const counts={};state.pasteRows.forEach(p=>counts[p.id]=(counts[p.id]||0)+1);state.pasteRows.forEach(p=>{if(counts[p.id]>1)p.error='Duplicate ID in pasted data';});const list=screen.querySelector('[data-paste-preview-list]');list.innerHTML=state.pasteRows.map(p=>'<div class="wb-review-item"><span>'+esc(p.id)+' → '+esc(p.value)+'</span>'+pill({tone:p.error?'warn':'good',label:p.error||'Matched'})+'</div>').join('')+'<div class="wb-action-row"><button type="button" class="wb-button wb-primary" data-apply-paste>Apply '+state.pasteRows.filter(p=>!p.error).length+' matched drafts</button></div>';list.querySelector('[data-apply-paste]').onclick=()=>{const valid=state.pasteRows.filter(p=>!p.error);valid.forEach(p=>{const r=row(p.id);r.value=p.value;saveDraft(r);});state.paste=false;log('Pasted '+valid.length+' matched draft values; unmatched rows were excluded explicitly.');render();message(valid.length+' draft values applied. Nothing was recorded or submitted.');};};}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view==='submit'?'review':b.dataset.view;if(b.dataset.view==='submit')state.reviewMode='submit';state.confirmation=false;render();});render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{if(state.network==='online')rows.filter(r=>r.sync==='offline').forEach(saveDraft);render();}});tweak.addSelect(state,'network',{label:'Connection scenario',options:['online','offline']});tweak.addSelect(state,'density',{label:'Worksheet spacing',options:['comfortable','compact']});}
})();
</script>
</div>
